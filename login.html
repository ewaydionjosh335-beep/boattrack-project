<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login / Sign Up - BoatTrack Binangonan</title>
  <link rel="stylesheet" href="/css/tokens.css">
  <link rel="stylesheet" href="/css/base.css">
  <link rel="stylesheet" href="/css/components.css">
  <link rel="stylesheet" href="/css/layout.css">
  <!-- QR Code Generator CDN (qrcodejs) -->
  <script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>
  <style>
    .auth-container {
      max-width: 460px;
      margin: 3rem auto;
      padding: 0 1rem;
    }
    .auth-tabs {
      display: flex;
      border-bottom: 2px solid var(--border);
      margin-bottom: 1.5rem;
    }
    .auth-tab {
      flex: 1;
      text-align: center;
      padding: 0.75rem;
      font-weight: 600;
      color: var(--text-muted);
      cursor: pointer;
      background: none;
      border: none;
      font-size: 1rem;
    }
    .auth-tab.active {
      color: var(--teal);
      border-bottom: 2px solid var(--teal);
      margin-bottom: -2px;
    }
    .auth-form { display: none; }
    .auth-form.active { display: block; }
    .dev-hint {
      background: #e2e8f0;
      padding: 0.75rem;
      border-radius: var(--radius-sm);
      font-size: 0.85rem;
      margin-bottom: 1.5rem;
      color: #334155;
    }
    .password-wrapper {
      position: relative;
    }
    .password-toggle {
      position: absolute;
      right: 10px;
      top: 50%;
      transform: translateY(-50%);
      background: none;
      border: none;
      cursor: pointer;
      color: var(--text-muted);
      display: flex;
      align-items: center;
      padding: 0.25rem;
    }
    .password-toggle:hover { color: var(--primary); }
  </style>
</head>
<body>

  <nav class="navbar">
    <div class="container">
      <a href="/index.html" class="nav-brand">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M2 21c.6.5 1.2 1 2.5 1 2.5 0 2.5-2 5-2 1.3 0 1.9.5 2.5 1 .6.5 1.2 1 2.5 1 2.5 0 2.5-2 5-2 1.3 0 1.9.5 2.5 1"/><path d="M19.38 20A11.6 11.6 0 0 0 21 14l-9-4-9 4c0 2.3.6 4.5 1.62 6"/><path d="M12 10V4l3 2-3 2"/></svg>
        BoatTrack
      </a>
      <div class="nav-links">
        <a href="/index.html" class="btn btn-outline" style="color: white; border-color: rgba(255,255,255,0.4);">Home / Schedules</a>
      </div>
    </div>
  </nav>

  <main class="auth-container">
    <div class="card">
      <div class="dev-hint" id="devHintBox">
        <strong>Dev Login Hint:</strong> admin@boattrack.local / Admin@12345
      </div>

      <div class="auth-tabs">
        <button class="auth-tab active" data-tab="login">Login</button>
        <button class="auth-tab" data-tab="signup">Sign Up</button>
      </div>

      <!-- LOGIN FORM -->
      <form id="loginForm" class="auth-form active">
        <div class="form-group">
          <label class="form-label">Email or Username</label>
          <input type="text" id="loginIdentifier" class="form-control" required placeholder="admin@boattrack.local">
        </div>
        <div class="form-group">
          <label class="form-label">Password</label>
          <div class="password-wrapper">
            <input type="password" id="loginPassword" class="form-control" required placeholder="••••••••" style="padding-right: 40px;">
            <button type="button" class="password-toggle" id="toggleLoginPass" title="Show/Hide Password">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
            </button>
          </div>
        </div>
        <div id="loginError" class="error-text" style="margin-bottom: 1rem;"></div>
        <button type="submit" class="btn btn-primary" style="width: 100%;">Login</button>
      </form>

      <!-- SIGNUP FORM (PASSENGER ONLY) -->
      <form id="signupForm" class="auth-form">
        <h3 style="font-size: 1.1rem; margin-bottom: 1rem; color: var(--teal);">Passenger Registration</h3>
        <div class="form-group">
          <label class="form-label">Full Name</label>
          <input type="text" id="signupName" class="form-control" required placeholder="Juan Dela Cruz">
        </div>
        <div class="form-group">
          <label class="form-label">Email Address</label>
          <input type="email" id="signupEmail" class="form-control" required placeholder="juan@example.com">
        </div>
        <div class="form-group">
          <label class="form-label">Username</label>
          <input type="text" id="signupUsername" class="form-control" required placeholder="juandc">
        </div>
        <div class="form-group">
          <label class="form-label">Body Weight (kg, 1–300)</label>
          <input type="number" id="signupWeight" class="form-control" min="1" max="300" value="65">
        </div>
        <div class="form-group">
          <label class="form-label">Password (Min 8 chars, letter & number)</label>
          <div class="password-wrapper">
            <input type="password" id="signupPassword" class="form-control" required placeholder="••••••••" style="padding-right: 40px;">
            <button type="button" class="password-toggle" id="toggleSignupPass" title="Show/Hide Password">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
            </button>
          </div>
        </div>
        <div class="form-group">
          <label class="form-label">Confirm Password</label>
          <div class="password-wrapper">
            <input type="password" id="signupConfirm" class="form-control" required placeholder="••••••••" style="padding-right: 40px;">
            <button type="button" class="password-toggle" id="toggleConfirmPass" title="Show/Hide Password">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
            </button>
          </div>
        </div>
        <div id="signupError" class="error-text" style="margin-bottom: 1rem;"></div>
        <button type="submit" class="btn btn-primary" style="width: 100%;">Create Passenger Account</button>
      </form>

      <!-- QR SUCCESS SCREEN -->
      <div id="qrSuccessScreen" style="display: none; text-align: center;">
        <h3 style="color: var(--success); margin-bottom: 0.5rem;">Registration Successful!</h3>
        <p style="color: var(--text-muted); margin-bottom: 1.0rem;">Here is your permanent passenger QR code for boarding and ticketing at Binangonan Port.</p>
        <div id="qrcodeDisplay" style="display: inline-block; padding: 1rem; background: white; border: 1px solid var(--border); border-radius: var(--radius-md); margin-bottom: 1rem;"></div>
        <div>
          <button id="downloadQrBtn" class="btn btn-primary" style="margin-right: 0.5rem;">Download QR Code</button>
          <a href="/login.html" class="btn btn-outline">Proceed to Login</a>
        </div>
      </div>

    </div>
  </main>

  <script type="module">
    import { api } from '/js/api.js';
    import { seedDatabase } from '/js/seed.js';
    import { hashPassword } from '/js/auth.js';

    await seedDatabase();

    const setupPasswordToggle = (btnId, inputId) => {
      const btn = document.getElementById(btnId);
      const input = document.getElementById(inputId);
      if (btn && input) {
        btn.onclick = () => {
          if (input.type === 'password') {
            input.type = 'text';
            btn.innerHTML = `<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/></svg>`;
          } else {
            input.type = 'password';
            btn.innerHTML = `<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>`;
          }
        };
      }
    };

    setupPasswordToggle('toggleLoginPass', 'loginPassword');
    setupPasswordToggle('toggleSignupPass', 'signupPassword');
    setupPasswordToggle('toggleConfirmPass', 'signupConfirm');

    const tabs = document.querySelectorAll('.auth-tab');
    tabs.forEach(tab => {
      tab.onclick = () => {
        tabs.forEach(t => t.classList.remove('active'));
        tab.classList.add('active');
        const target = tab.dataset.tab;
        document.querySelectorAll('.auth-form').forEach(f => f.classList.remove('active'));
        if (target === 'login') document.getElementById('loginForm').classList.add('active');
        if (target === 'signup') document.getElementById('signupForm').classList.add('active');
        document.getElementById('qrSuccessScreen').style.display = 'none';
      };
    });

    const urlParams = new URLSearchParams(window.location.search);
    if (urlParams.get('tab') === 'signup') {
      document.querySelector('[data-tab="signup"]').click();
    }

    document.getElementById('loginForm').onsubmit = async (e) => {
      e.preventDefault();
      const identifier = document.getElementById('loginIdentifier').value.trim();
      const password = document.getElementById('loginPassword').value;
      const errBox = document.getElementById('loginError');
      errBox.textContent = '';

      try {
        const hashed = await hashPassword(password);
        const session = await api.auth.login(identifier, hashed);
        const ROLE_HOMES = {
          administrator: '/admin/dashboard.html',
          port_manager: '/manager/dashboard.html',
          receptionist: '/receptionist/dashboard.html',
          boat_owner: '/owner/dashboard.html',
          boat_operator: '/operator/dashboard.html',
          passenger: '/passenger/dashboard.html',
          crew: '/crew/dashboard.html'
        };
        const home = ROLE_HOMES[session.role] || `/roles/placeholder.html?role=${session.role}`;
        window.location.href = home;
      } catch (err) {
        errBox.textContent = err.message;
      }
    };

    document.getElementById('signupForm').onsubmit = async (e) => {
      e.preventDefault();
      const full_name = document.getElementById('signupName').value.trim();
      const email = document.getElementById('signupEmail').value.trim();
      const username = document.getElementById('signupUsername').value.trim();
      const password = document.getElementById('signupPassword').value;
      const confirm = document.getElementById('signupConfirm').value;
      const errBox = document.getElementById('signupError');
      errBox.textContent = '';

      if (password.length < 8 || !/[a-zA-Z]/.test(password) || !/[0-9]/.test(password)) {
        errBox.textContent = 'Password must be at least 8 characters and contain both a letter and a number.';
        return;
      }
      if (password !== confirm) {
        errBox.textContent = 'Passwords do not match.';
        return;
      }

      try {
        const password_hash = await hashPassword(password);
        const weight_kg = parseFloat(document.getElementById('signupWeight').value) || 65;
        
        const result = await api.auth.registerUser({
          full_name, email, username, password, password_hash, role: 'passenger', weight_kg
        });

        document.getElementById('signupForm').style.display = 'none';
        document.querySelector('.auth-tabs').style.display = 'none';
        document.getElementById('devHintBox').style.display = 'none';
        
        const qrScreen = document.getElementById('qrSuccessScreen');
        qrScreen.style.display = 'block';

        const qrContainer = document.getElementById('qrcodeDisplay');
        qrContainer.innerHTML = '';
        new QRCode(qrContainer, {
          text: result.passenger.qr_code,
          width: 200,
          height: 200
        });

        document.getElementById('downloadQrBtn').onclick = () => {
          const canvas = qrContainer.querySelector('canvas');
          if (canvas) {
            const link = document.createElement('a');
            link.download = `boattrack_qr_${username}.png`;
            link.href = canvas.toDataURL('image/png');
            link.click();
          }
        };
      } catch (err) {
        errBox.textContent = err.message;
      }
    };
  </script>
</body>
</html>
