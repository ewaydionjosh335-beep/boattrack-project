<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Departure Approval - BoatTrack</title>
  <link rel="stylesheet" href="/css/tokens.css">
  <link rel="stylesheet" href="/css/base.css">
  <link rel="stylesheet" href="/css/components.css">
  <link rel="stylesheet" href="/css/layout.css">
</head>
<body class="admin-layout">

  <aside class="admin-sidebar">
    <div class="sidebar-header">
      <span style="display: flex; align-items: center; gap: 0.5rem;">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M2 21c.6.5 1.2 1 2.5 1 2.5 0 2.5-2 5-2 1.3 0 1.9.5 2.5 1 .6.5 1.2 1 2.5 1 2.5 0 2.5-2 5-2 1.3 0 1.9.5 2.5 1"/><path d="M19.38 20A11.6 11.6 0 0 0 21 14l-9-4-9 4c0 2.3.6 4.5 1.62 6"/><path d="M12 10V4l3 2-3 2"/></svg>
        Port Manager
      </span>
    </div>
    <div class="sidebar-menu">
      <a href="/manager/dashboard.html"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M3 9h18"/><path d="M9 21V9"/></svg> Dashboard</a>
      <a href="/manager/trip-schedule.html"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="1 6 1 22 8 18 16 22 23 18 23 2 16 6 8 2 1 6"/><line x1="8" y1="2" x2="8" y2="18"/><line x1="16" y1="6" x2="16" y2="22"/></svg> Trip Schedule</a>
      <a href="/manager/monitoring.html"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M2 21c.6.5 1.2 1 2.5 1 2.5 0 2.5-2 5-2 1.3 0 1.9.5 2.5 1 .6.5 1.2 1 2.5 1 2.5 0 2.5-2 5-2 1.3 0 1.9.5 2.5 1"/><path d="M19.38 20A11.6 11.6 0 0 0 21 14l-9-4-9 4c0 2.3.6 4.5 1.62 6"/><path d="M12 10V4l3 2-3 2"/></svg> Boat &amp; Trip Monitoring</a>
      <a href="/manager/risk-assessment.html"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg> Risk Assessment</a>
      <a href="/manager/payments.html"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="5" width="20" height="14" rx="2"/><line x1="2" y1="10" x2="22" y2="10"/></svg> Payment Records</a>
      <a href="/manager/departure-approval.html" class="active"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg> Departure Approval</a>
      <a href="/manager/weather.html"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 10h-1.26A8 8 0 1 0 9 20h9a5 5 0 0 0 0-10z"/></svg> Weather</a>
      <a href="/manager/profile.html"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg> Profile</a>
      <a href="#" id="logoutBtn" style="color: var(--danger);"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg> Logout</a>
    </div>
  </aside>

  <div class="admin-main">
    <header class="admin-header">
      <h2>Departure Approval</h2>
    </header>

    <div class="admin-content">
      <div id="approvalList" style="display: flex; flex-direction: column; gap: 0.75rem;">
        <p style="color: var(--text-muted);">Loading trips...</p>
      </div>
    </div>
  </div>

  <!-- HOLD REMARKS MODAL -->
  <div id="holdRemarksModal" class="modal-backdrop" style="display: none;">
    <div class="modal" style="max-width: 480px; width: 100%; border-radius: var(--radius-lg);">
      <div class="modal-header" style="padding: 1.25rem 1.5rem;">
        <h3 style="color: var(--danger); font-size: 1.15rem;">Hold Trip</h3>
        <button type="button" class="btn btn-outline btn-sm" id="closeHoldRemarksModalBtn" style="padding: 0.35rem 0.75rem;">&times;</button>
      </div>
      <form id="holdRemarksForm">
        <div class="modal-body" style="padding: 1.5rem;">
          <input type="hidden" id="holdRemarksTripId">
          <p id="holdRemarksSummary" style="font-size: 0.9rem; color: var(--text-muted); margin-bottom: 1.25rem;"></p>
          <div class="form-group">
            <label class="form-label">Coast Guard Hold Reason (required)</label>
            <textarea id="holdRemarksInput" class="form-control" rows="3" placeholder="e.g. Weather advisory, safety inspection pending, coast guard order..."></textarea>
          </div>
          <div id="holdRemarksError" class="error-text"></div>
        </div>
        <div class="modal-footer" style="padding: 1rem 1.5rem;">
          <button type="button" class="btn btn-outline" id="cancelHoldRemarksBtn" style="padding: 0.6rem 1.25rem;">Cancel</button>
          <button type="submit" class="btn btn-danger" style="padding: 0.6rem 1.25rem;">Confirm Hold</button>
        </div>
      </form>
    </div>
  </div>

  <!-- APPROVAL MODAL: evidence + coast guard remarks -->
  <div id="approvalModal" class="modal-backdrop" style="display: none;">
    <div class="modal" style="max-width: 720px; width: 100%; border-radius: var(--radius-lg);">
      <div class="modal-header" style="padding: 1.25rem 1.5rem;">
        <h3 style="font-size: 1.25rem;">Record Departure Approval</h3>
        <button type="button" class="btn btn-outline btn-sm" id="closeApprovalModalBtn" style="padding: 0.35rem 0.75rem;">&times;</button>
      </div>
      <form id="approvalForm">
        <div class="modal-body" style="font-size: 0.95rem; padding: 1.5rem;">
          <input type="hidden" id="approvalTripId">
          <p id="approvalSummary" style="margin-bottom: 1.25rem; color: var(--text-muted); font-size: 1rem;"></p>
          <div id="approvalEvidence" style="margin-bottom: 1.25rem;"></div>
          <div class="form-group">
            <label class="form-label" id="approvalRemarksLabel" style="font-size: 1rem;">Remarks</label>
            <textarea id="approvalRemarks" class="form-control" rows="4" style="font-size: 0.95rem; padding: 0.75rem;"></textarea>
          </div>
          <div id="approvalError" class="error-text" style="font-size: 0.9rem;"></div>
        </div>
        <div class="modal-footer" style="padding: 1rem 1.5rem;">
          <button type="button" class="btn btn-outline" id="cancelApprovalBtn" style="padding: 0.6rem 1.25rem; font-size: 1rem;">Cancel</button>
          <button type="submit" class="btn btn-primary" id="recordApprovalBtn" style="padding: 0.6rem 1.25rem; font-size: 1rem;">Record Approval</button>
        </div>
      </form>
    </div>
  </div>

  <script type="module">
    import { api } from '/js/api.js';
    import { auth } from '/js/auth.js';
    import { ui } from '/js/ui.js';

    const session = await auth.requireAuth(['port_manager']);
    if (!session) throw new Error('Unauthorized');

    const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

    let evidenceByTrip = {};
    let activeTripId = null;
    let activeEvidence = null;

    const latest = (list, field) => list
      .slice()
      .sort((a, b) => new Date(b[field]) - new Date(a[field]))[0] || null;

    const classificationColor = c =>
      c === 'Not Advisable' ? 'var(--danger)' : c === 'Caution' ? 'var(--warning)' : c === 'Safe' ? 'var(--success)' : 'var(--text-muted)';

    async function render() {
      // Prevent background 5s refresh from replacing evidence while modal is open
      if (activeTripId) return;

      const [trips, routes, terminals, approvals, scans, inspections, boats] = await Promise.all([
        api.trips.list(), api.routes.list(), api.terminals.list(),
        api.departureApprovals.list(), api.riskScans.list(), api.inspections.list(), api.boats.list()
      ]);
      const list = document.getElementById('approvalList');
      evidenceByTrip = {};

      // Only today's departures are actionable; stale Scheduled/Held trips from earlier
      // days are dropped and the list stays ordered by departure time.
      const today = ui.localDateStr();
      const pending = trips
        .filter(t => (t.trip_status === 'Scheduled' || t.trip_status === 'Held') && ui.localDateStr(t.departure_time) === today)
        .sort((a, b) => new Date(a.departure_time) - new Date(b.departure_time));
      if (!pending.length) {
        list.innerHTML = '<div style="text-align: center; padding: 3rem; color: var(--text-muted); font-size: 1.1rem;"><svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" style="margin-bottom: 1rem; opacity: 0.5;"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></svg><br>No trips departing today are awaiting departure approval.</div>';
        return;
      }

      list.innerHTML = pending.map(trip => {
        const route = routes.find(r => r.id === trip.route_id);
        // Departure is recorded at the route's origin terminal (not the first terminal in the list).
        const origin = terminals.find(t => t.id === route?.origin_terminal_id);
        const dest = terminals.find(t => t.id === route?.destination_terminal_id);
        const boat = boats.find(b => b.id === trip.boat_id);
        const latestDecision = latest(approvals.filter(a => a.trip_id === trip.id), 'recorded_at');
        // Evidence must belong to this trip's current vessel, otherwise a boat change
        // would show (and re-approve with) the previous boat's scan/inspection.
        const scan = latest(scans.filter(s => s.trip_id === trip.id && s.boat_id === trip.boat_id), 'scanned_at');
        // Only a pre-departure inspection is relevant to clearing the trip.
        const insp = latest(
          inspections.filter(i =>
            i.trip_id === trip.id &&
            i.boat_id === trip.boat_id &&
            i.inspection_type === 'Pre-departure'),
          'inspected_at'
        );

        const decision = latestDecision?.decision || 'Pending';
        // Mark Departed needs an approval for the current schedule revision; a schedule
        // edit or hold bumps approval_revision and invalidates the old clearance.
        const approvalCurrent = !!latestDecision && decision === 'Approved'
          && (latestDecision.trip_revision || 0) === (trip.approval_revision || 0);
        const approvalExpired = !!latestDecision && decision === 'Approved' && !approvalCurrent;
        const canDepart = trip.trip_status === 'Scheduled' && approvalCurrent;
        const isHeld = decision === 'Held' && trip.trip_status === 'Held';
        const missingOrigin = !origin;
        const missingDest = !dest;
        const terminalWarning = missingOrigin || missingDest;

        evidenceByTrip[trip.id] = { trip, route, origin, dest, boat, scan, insp, decision, approvalCurrent, isHeld, latestDecision };

        return `
        <div class="card" style="padding: 1.25rem; margin-bottom: 0.75rem;">
          <div style="display: flex; justify-content: space-between; gap: 1rem; align-items: flex-start; flex-wrap: wrap;">
            <div style="flex: 1; min-width: 280px;">
              <div style="display: flex; gap: 0.5rem; margin-bottom: 0.5rem; flex-wrap: wrap;">
                <span class="badge badge-${esc(String(trip.trip_status).toLowerCase())}" style="font-size: 0.75rem; padding: 0.2rem 0.5rem;">${esc(trip.trip_status)}</span>
                <span class="badge badge-${esc(String(decision).toLowerCase())}" style="font-size: 0.75rem; padding: 0.2rem 0.5rem;">${esc(decision)} ${approvalExpired ? '(approval expired for this schedule)' : ''}</span>
                ${terminalWarning ? `<span class="badge" style="background:#fef3c7; color:#92400e; font-size: 0.7rem; padding: 0.15rem 0.4rem;">⚠ Terminal${missingOrigin ? ' origin' : ''}${missingDest ? ' destination' : ''} missing</span>` : ''}
              </div>
              <h3 style="margin: 0 0 0.25rem 0; font-size: 1.1rem; color: var(--primary);">
                ${esc(boat?.name || 'Unknown vessel')}
              </h3>
              <p style="font-size: 0.95rem; margin-bottom: 0.5rem; color: var(--text-main);">
                <strong>${esc(origin?.name || 'Unknown origin')}</strong> &rarr; <strong>${esc(dest?.name || 'Unknown destination')}</strong>
                <span style="color: var(--text-muted); margin-left: 0.5rem;">&middot; ${new Date(trip.departure_time).toLocaleString()}</span>
              </p>
              <div style="display: flex; flex-direction: column; gap: 0.25rem; font-size: 0.85rem;">
                <div style="display: flex; align-items: center; gap: 0.5rem;">
                  <span style="color: var(--text-muted); min-width: 100px;">Coast Guard:</span>
                  <span>${latestDecision
                    ? `${esc(latestDecision.decision)} by ${esc(latestDecision.recorded_by || '-')} (${esc(latestDecision.coast_guard_name || 'n/a')})`
                    : 'No record yet'}</span>
                </div>
                <div style="display: flex; align-items: center; gap: 0.5rem;">
                  <span style="color: var(--text-muted); min-width: 100px;">Risk Scan:</span>
                  <span style="color: ${classificationColor(scan?.classification)}; font-weight: 600;">
                    ${scan
                      ? `${esc(scan.classification)} by ${esc(scan.scanned_by || '-')} at ${new Date(scan.scanned_at).toLocaleString()}`
                      : 'None on record'}
                  </span>
                </div>
                <div style="display: flex; align-items: center; gap: 0.5rem;">
                  <span style="color: var(--text-muted); min-width: 100px;">Inspection:</span>
                  <span style="color: ${!insp || insp.overall !== 'Passed' ? 'var(--danger)' : 'var(--text-muted)'}; font-weight: 600;">
                    ${insp
                      ? `${esc(insp.overall)} by ${esc(insp.inspected_by || '-')} at ${new Date(insp.inspected_at).toLocaleString()}`
                      : 'None on record'}
                  </span>
                </div>
              </div>
            </div>
            <div style="display: flex; gap: 0.5rem; flex-wrap: wrap; align-items: flex-start; padding-top: 0.25rem;">
              <button class="btn btn-primary approve" data-trip="${esc(trip.id)}" ${origin && !terminalWarning && !approvalCurrent ? '' : 'disabled'} style="padding: 0.5rem 1rem; font-size: 0.9rem;" ${terminalWarning ? 'title="Cannot approve: route terminal missing"' : ''}>
                ${approvalCurrent ? 'Approved' : 'Approve'}
              </button>
              <button class="btn btn-danger hold" data-trip="${esc(trip.id)}" ${origin && !terminalWarning && !isHeld ? '' : 'disabled'} style="padding: 0.5rem 1rem; font-size: 0.9rem;" ${terminalWarning ? 'title="Cannot hold: route terminal missing"' : ''}>
                ${isHeld ? 'Held' : 'Hold'}
              </button>
              <button class="btn btn-outline depart" data-trip="${esc(trip.id)}" ${canDepart && !terminalWarning ? '' : 'disabled'} style="padding: 0.5rem 1rem; font-size: 0.9rem;" ${terminalWarning ? 'title="Cannot depart: route terminal missing"' : ''}>
                Mark Departed
              </button>
            </div>
          </div>
        </div>`;
      }).join('');

      list.querySelectorAll('.approve').forEach(b => b.onclick = () => openApprovalModal(b.dataset.trip));

      list.querySelectorAll('.hold').forEach(b => b.onclick = () => {
        const ev = evidenceByTrip[b.dataset.trip];
        if (!ev) return;
        if (ev.isHeld || (ev.trip.trip_status === 'Held' && ev.decision === 'Held')) {
          ui.showToast('Trip is already held.', 'warning');
          return;
        }
        openHoldRemarksModal(b.dataset.trip);
      });

      list.querySelectorAll('.depart').forEach(b => b.onclick = async () => {
        b.disabled = true;
        try {
          await api.trips.markDeparted(b.dataset.trip);
          ui.showToast('Trip marked as departed.', 'success');
          render();
        } catch (err) {
          ui.showToast(err.message, 'error');
          b.disabled = false;
        }
      });
    }

    const approvalModal = document.getElementById('approvalModal');
    const closeApprovalModal = () => {
      approvalModal.style.display = 'none';
      activeTripId = null;
      activeEvidence = null;
      render();
    };
    document.getElementById('closeApprovalModalBtn').onclick = closeApprovalModal;
    document.getElementById('cancelApprovalBtn').onclick = closeApprovalModal;
    approvalModal.onclick = (e) => { if (e.target === approvalModal) closeApprovalModal(); };

    // Hold Remarks Modal
    let holdTarget = null;
    const holdRemarksModal = document.getElementById('holdRemarksModal');
    const closeHoldRemarksModal = () => {
      holdRemarksModal.style.display = 'none';
      holdTarget = null;
    };
    document.getElementById('closeHoldRemarksModalBtn').onclick = closeHoldRemarksModal;
    document.getElementById('cancelHoldRemarksBtn').onclick = closeHoldRemarksModal;
    holdRemarksModal.onclick = (e) => { if (e.target === holdRemarksModal) closeHoldRemarksModal(); };

    function openHoldRemarksModal(tripId) {
      const ev = evidenceByTrip[tripId];
      if (!ev) return;
      holdTarget = { tripId, ev };
      document.getElementById('holdRemarksTripId').value = tripId;
      document.getElementById('holdRemarksSummary').innerHTML =
        `<strong>${esc(ev.boat?.name || 'Vessel')}</strong> &middot; ` +
        `Scan: <strong>${ev.scan ? esc(ev.scan.classification) : 'None'}</strong> &middot; ` +
        `Inspection: <strong>${ev.insp ? esc(ev.insp.overall) : 'None'}</strong>` +
        `${!ev.origin || !ev.dest ? `<br><span style="color:#92400e; font-size:0.85rem;">⚠ ${!ev.origin ? 'Origin terminal missing' : ''}${!ev.dest ? ' Destination terminal missing' : ''}</span>` : ''}`;
      document.getElementById('holdRemarksInput').value = '';
      document.getElementById('holdRemarksError').textContent = '';
      holdRemarksModal.style.display = 'flex';
    }

    document.getElementById('holdRemarksForm').onsubmit = async (e) => {
      e.preventDefault();
      const errBox = document.getElementById('holdRemarksError');
      errBox.textContent = '';
      const remarks = document.getElementById('holdRemarksInput').value.trim();
      if (!remarks) { errBox.textContent = 'A hold reason is required.'; return; }
      if (!holdTarget) return;
      const { ev } = holdTarget;
      const submitBtn = e.submitter;
      submitBtn.disabled = true;
      try {
        const curApprovals = await api.departureApprovals.listByTrip(ev.trip.id);
        const curLatest = latest(curApprovals, 'recorded_at');
        const curTrip = (await api.trips.list()).find(t => t.id === ev.trip.id);
        if (curLatest?.decision === 'Held' && curTrip?.trip_status === 'Held') {
          ui.showToast('Trip is already held.', 'warning');
          closeHoldRemarksModal();
          render();
          return;
        }
        await api.departureApprovals.create({
          trip_id: ev.trip.id,
          terminal_id: ev.origin?.id || null,
          coast_guard_name: ev.origin?.coast_guard_personnel || null,
          decision: 'Held',
          remarks,
          risk_scan_id: ev.scan?.id || null,
          inspection_id: ev.insp?.id || null,
          advisory_result: ev.scan?.classification || null,
          advisory_overridden: false,
          recorded_by: session.full_name,
          recorded_at: new Date().toISOString()
        });
        if (ev.trip.trip_status !== 'Held') {
          await api.trips.updateStatus(ev.trip.id, 'Held', remarks);
        }
        ui.showToast('Trip held.', 'success');
        closeHoldRemarksModal();
        render();
      } catch (err) {
        errBox.textContent = err.message;
        submitBtn.disabled = false;
      }
    };

    function openApprovalModal(tripId) {
      const ev = evidenceByTrip[tripId];
      if (!ev) return;
      if (ev.approvalCurrent) {
        ui.showToast('Trip has already been approved for this schedule.', 'warning');
        return;
      }
      activeTripId = tripId;
      // Freeze the exact evidence the approver inspects in the modal so submit
      // records only this evidence, even if background state changes.
      activeEvidence = {
        trip: { ...ev.trip },
        origin: ev.origin ? { ...ev.origin } : null,
        dest: ev.dest ? { ...ev.dest } : null,
        boat: ev.boat ? { ...ev.boat } : null,
        scan: ev.scan ? { ...ev.scan } : null,
        insp: ev.insp ? { ...ev.insp } : null,
        decision: ev.decision,
        approvalCurrent: ev.approvalCurrent
      };
const { trip, origin, dest, boat, scan, insp } = activeEvidence;
      const needsJudgement = !scan || scan.classification !== 'Safe' || !insp || insp.overall !== 'Passed';
      const failedItems = (insp?.items || []).filter(i => i.result === 'Fail');
      const terminalMissing = !origin || !dest;

      document.getElementById('approvalTripId').value = tripId;
       document.getElementById('approvalSummary').innerHTML = `
          <div style="display: flex; align-items: center; gap: 0.75rem; margin-bottom: 0.5rem;">
            <span class="badge badge-${esc(String(trip.trip_status).toLowerCase())}" style="font-size: 0.8rem; padding: 0.3rem 0.75rem;">${esc(trip.trip_status)}</span>
            <strong style="font-size: 1.1rem; color: var(--primary);">${esc(boat?.name || 'Vessel')}</strong>
          </div>
          <div style="font-size: 1rem; color: var(--text-main);">
            ${esc(origin?.name || 'Origin')} &rarr; ${esc(dest?.name || 'Destination')}
          </div>
          <div style="font-size: 0.9rem; color: var(--text-muted); margin-top: 0.25rem;">
            Departure: ${new Date(trip.departure_time).toLocaleString()} &middot; Status: ${esc(trip.trip_status)}
          </div>
          ${terminalMissing ? `<div style="margin-top: 0.5rem; padding: 0.5rem; background:#fef3c7; color:#92400e; border-radius:4px; font-weight:600;">⚠ ${!origin ? 'Origin terminal missing' : ''}${!dest ? ' Destination terminal missing' : ''} — cannot record approval until fixed in Admin → Terminals/Routes</div>` : ''}`;

        document.getElementById('approvalEvidence').innerHTML = `
         <div class="table-container" style="font-size: 0.95rem;">
           <table style="width: 100%;">
             <tr>
               <td style="width: 35%; padding: 0.75rem 1rem;"><strong>Risk scan</strong></td>
               <td style="padding: 0.75rem 1rem;">${scan
                 ? `<span class="badge" style="background: ${classificationColor(scan.classification)}; color: white; padding: 0.3rem 0.75rem; font-size: 0.85rem;">${esc(scan.classification)}</span>
                    <span style="margin-left: 0.5rem;">${esc(scan.scanned_by || '-')} &middot; ${new Date(scan.scanned_at).toLocaleString()}</span>`
                 : '<span style="color: var(--danger); font-weight: 600;">No scan on record</span>'}</td>
             </tr>
             ${scan ? `<tr>
               <td style="padding: 0.75rem 1rem;"><strong>Load / Capacity</strong></td>
               <td style="padding: 0.75rem 1rem;">${Number(scan.total_load_kg || 0).toFixed(1)} / ${esc(scan.max_load_kg ?? '-')} kg &middot;
                   ${esc(scan.passenger_count ?? '-')} / ${esc(scan.passenger_capacity ?? '-')} pax</td>
             </tr>` : ''}
             <tr>
               <td style="padding: 0.75rem 1rem;"><strong>Pre-departure inspection</strong></td>
               <td style="padding: 0.75rem 1rem;">${insp
                 ? `<strong style="color: ${insp.overall === 'Passed' ? 'var(--success)' : 'var(--danger)'}; font-size: 1rem;">${esc(insp.overall)}</strong>
                    by ${esc(insp.inspected_by || '-')} &middot; ${new Date(insp.inspected_at).toLocaleString()}`
                 : '<span style="color: var(--danger); font-weight: 600;">None on record</span>'}</td>
             </tr>
             ${failedItems.length ? `<tr>
               <td style="padding: 0.75rem 1rem;"><strong>Failed items</strong></td>
               <td style="padding: 0.75rem 1rem; color: var(--danger);">${failedItems.map(i => esc(i.item) + (i.note ? ` (${esc(i.note)})` : '')).join('<br>')}</td>
             </tr>` : ''}
           </table>
         </div>
         ${needsJudgement
           ? '<p style="color: var(--danger); font-size: 0.9rem; margin-top: 1rem; padding: 0.75rem; background: #fef2f2; border-radius: 6px; font-weight: 600;">The latest scan or inspection is not a clean Safe / Passed result. The coast guard still decides, so record the reason for clearing this trip.</p>'
           : ''}`;

      document.getElementById('approvalRemarksLabel').innerHTML = needsJudgement
        ? 'Justification for clearing (required, at least 10 characters)'
        : 'Remarks';
      document.getElementById('approvalRemarks').value = '';
      document.getElementById('approvalError').textContent = '';
      document.getElementById('recordApprovalBtn').disabled = terminalMissing;
      approvalModal.style.display = 'flex';
    }

    document.getElementById('approvalForm').onsubmit = async (e) => {
      e.preventDefault();
      const errBox = document.getElementById('approvalError');
      errBox.textContent = '';
      const ev = activeEvidence;
      if (!ev || ev.trip.id !== activeTripId) { errBox.textContent = 'Trip no longer available. Close and reload.'; return; }
      if (terminalMissing) { errBox.textContent = 'Cannot approve: route has missing terminal(s). Fix in Admin → Terminals/Routes.'; return; }

      const remarks = document.getElementById('approvalRemarks').value.trim();
      const needsJudgement = !ev.scan || ev.scan.classification !== 'Safe' || !ev.insp || ev.insp.overall !== 'Passed';
      if (needsJudgement && remarks.length < 10) {
        errBox.textContent = 'Record at least 10 characters explaining why this trip is cleared despite the advisory.';
        return;
      }

      const btn = document.getElementById('recordApprovalBtn');
      btn.disabled = true;
      try {
        const curApprovals = await api.departureApprovals.listByTrip(ev.trip.id);
        const curLatest = latest(curApprovals, 'recorded_at');
        const curTrip = (await api.trips.list()).find(t => t.id === ev.trip.id);
        const curRev = curTrip ? (curTrip.approval_revision || 0) : 0;
        if (curLatest?.decision === 'Approved' && (curLatest.trip_revision || 0) === curRev) {
          errBox.textContent = 'Trip has already been approved for this schedule.';
          btn.disabled = false;
          return;
        }

        await api.departureApprovals.create({
          trip_id: ev.trip.id,
          terminal_id: ev.origin.id,
          coast_guard_name: ev.origin.coast_guard_personnel || null,
          decision: 'Approved',
          remarks: remarks || 'Cleared for departure',
          risk_scan_id: ev.scan?.id || null,
          inspection_id: ev.insp?.id || null,
          advisory_result: ev.scan?.classification || null,
          advisory_overridden: needsJudgement,
          recorded_by: session.full_name,
          recorded_at: new Date().toISOString()
        });
        if (ev.trip.trip_status === 'Held') {
          // Clearing a held trip must return it to Scheduled, otherwise it can never depart.
          await api.trips.updateStatus(ev.trip.id, 'Scheduled', null);
        }
        ui.showToast('Trip approved.', 'success');
        closeApprovalModal();
      } catch (err) {
        errBox.textContent = err.message;
        btn.disabled = false;
      }
    };

    try {
      await render();
      ui.setupSync(render);
    } catch (err) {
      document.getElementById('approvalList').innerHTML = `<div style="color: var(--danger); padding: 2rem; text-align: center; font-size: 1rem;">Error loading trips: ${esc(err.message)}</div>`;
      console.error('Departure Approval render error:', err);
    }

    document.getElementById('logoutBtn').onclick = async (e) => {
      e.preventDefault();
      await api.auth.logout();
      window.location.href = '/login.html';
    };
  </script>
</body>
</html>
