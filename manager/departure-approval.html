  <div class="admin-main">
    <header class="admin-header">
      <h2>Departure Approval</h2>
      <span id="managerName" style="font-weight: 600;"></span>
    </header>

    <div class="admin-content">
      <div id="approvalList" style="display: flex; flex-direction: column; gap: 0.75rem;">
        <p style="color: var(--text-muted);">Loading trips...</p>
      </div>
    </div>
  </div>

  <script type="module">
    import { api } from '/js/api.js';
    import { auth } from '/js/auth.js';
    import { ui } from '/js/ui.js';

    const session = await auth.requireAuth(['port_manager']);
    if (!session) throw new Error('Unauthorized');
    document.getElementById('managerName').textContent = session.full_name;

    const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

    async function render() {
      const [trips, routes, terminals, approvals] = await Promise.all([
        api.trips.list(), api.routes.list(), api.terminals.list(), api.departureApprovals.list()
      ]);
      const list = document.getElementById('approvalList');

      const pending = trips.filter(t => t.trip_status === 'Scheduled' || t.trip_status === 'Held');
      if (!pending.length) {
        list.innerHTML = '<p style="color: var(--text-muted);">No scheduled or held trips awaiting departure.</p>';
        return;
      }

      list.innerHTML = pending.map(trip => {
        const route = routes.find(r => r.id === trip.route_id);
        // Departure is recorded at the route's origin terminal (not the first terminal in the list).
        const origin = terminals.find(t => t.id === route?.origin_terminal_id);
        const dest = terminals.find(t => t.id === route?.destination_terminal_id);
        const latest = approvals
          .filter(a => a.trip_id === trip.id)
          .sort((a, b) => new Date(b.recorded_at) - new Date(a.recorded_at))[0];
        const decision = latest?.decision || 'Pending';
        return `
        <div class="card">
          <div style="display: flex; justify-content: space-between; gap: 1rem; align-items: center; flex-wrap: wrap;">
            <div>
              <span class="badge badge-${esc(String(trip.trip_status).toLowerCase())}">${esc(trip.trip_status)}</span>
              <span class="badge badge-${esc(String(decision).toLowerCase())}">${esc(decision)}</span>
              <p style="margin-top: 0.5rem;">
                <strong>${esc(origin?.name || 'Unknown origin')}</strong> &rarr; <strong>${esc(dest?.name || 'Unknown destination')}</strong>
                &middot; Departure ${new Date(trip.departure_time).toLocaleString()}
              </p>
              <small style="color: var(--text-muted);">
                ${latest
                  ? `Latest approval: ${esc(latest.decision)} by ${esc(latest.recorded_by || '-')} (${esc(latest.coast_guard_name || 'n/a')}) at ${new Date(latest.recorded_at).toLocaleString()}`
                  : 'No coast guard record yet.'}
              </small>
            </div>
            <div style="display: flex; gap: 0.5rem; flex-wrap: wrap;">
              <button class="btn btn-primary btn-sm dec" data-trip="${esc(trip.id)}" data-dec="Approved" ${origin ? '' : 'disabled'}>Approve</button>
              <button class="btn btn-danger btn-sm dec" data-trip="${esc(trip.id)}" data-dec="Held" ${origin ? '' : 'disabled'}>Hold</button>
              <button class="btn btn-outline btn-sm depart" data-trip="${esc(trip.id)}">Mark Departed</button>
            </div>
          </div>
        </div>`;
      }).join('');

      list.querySelectorAll('.dec').forEach(b => b.onclick = async () => {
        const tripId = b.dataset.trip;
        const dec = b.dataset.dec;
        const trip = trips.find(t => t.id === tripId);
        const route = routes.find(r => r.id === trip?.route_id);
        const origin = terminals.find(t => t.id === route?.origin_terminal_id);
        if (!origin) { ui.showToast('Route has no origin terminal configured.', 'error'); return; }
        b.disabled = true;
        try {
          await api.departureApprovals.create({
            trip_id: tripId,
            terminal_id: origin.id,
            coast_guard_name: origin.coast_guard_personnel,
            decision: dec,
            remarks: dec === 'Approved' ? 'Cleared for departure' : 'Held by coast guard',
            risk_scan_id: null,
            inspection_id: null,
            recorded_by: session.full_name,
            recorded_at: new Date().toISOString()
          });
          if (dec === 'Held') {
            await api.trips.updateStatus(tripId, 'Held', 'Coast Guard decision: held');
          } else if (trip?.trip_status === 'Held') {
            // Clearing a held trip must return it to Scheduled, otherwise it can never depart.
            await api.trips.updateStatus(tripId, 'Scheduled', null);
          }
          ui.showToast(`Trip ${dec === 'Approved' ? 'approved' : 'held'}.`, 'success');
          render();
        } catch (err) {
          ui.showToast(err.message, 'error');
          b.disabled = false;
        }
      });

      list.querySelectorAll('.depart').forEach(b => b.onclick = async () => {
        b.disabled = true;
        try {
          await api.trips.markDeparted(b.dataset.trip);
          ui.showToast('Trip marked as departed.', 'success');
          render();
        } catch (err) {
          ui.showToast(err.message, 'error');
          b.disabled = false;
        }
      });
    }

    await render();

    document.getElementById('logoutBtn').onclick = async (e) => {
      e.preventDefault();
      await api.auth.logout();
      window.location.href = '/login.html';
    };
  </script>
</body>
