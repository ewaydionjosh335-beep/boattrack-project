<body class="admin-layout">

  <aside class="admin-sidebar">

        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M2 21c.6.5 1.2 1 2.5 1 2.5 0 2.5-2 5-2 1.3 0 1.9.5 2.5 1 .6.5 1.2 1 2.5 1 2.5 0 2.5-2 5-2 1.3 0 1.9.5 2.5 1"/><path d="M19.38 20A11.6 11.6 0 0 0 21 14l-9-4-9 4c0 2.3.6 4.5 1.62 6"/><path d="M12 10V4l3 2-3 2"/></svg>
        Port Manager
      </span>
    </div>
    <div class="sidebar-menu">
      <a href="/manager/dashboard.html"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M3 9h18"/><path d="M9 21V9"/></svg> Dashboard</a>
      <a href="/manager/trip-schedule.html"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="1 6 1 22 8 18 16 22 23 18 23 2 16 6 8 2 1 6"/><line x1="8" y1="2" x2="8" y2="18"/><line x1="16" y1="6" x2="16" y2="22"/></svg> Trip Schedule</a>
      <a href="/manager/monitoring.html"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M2 21c.6.5 1.2 1 2.5 1 2.5 0 2.5-2 5-2 1.3 0 1.9.5 2.5 1 .6.5 1.2 1 2.5 1 2.5 0 2.5-2 5-2 1.3 0 1.9.5 2.5 1"/><path d="M19.38 20A11.6 11.6 0 0 0 21 14l-9-4-9 4c0 2.3.6 4.5 1.62 6"/><path d="M12 10V4l3 2-3 2"/></svg> Boat &amp; Trip Monitoring</a>
      <a href="/manager/risk-assessment.html"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg> Risk Assessment</a>
      <a href="/manager/payments.html"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="5" width="20" height="14" rx="2"/><line x1="2" y1="10" x2="22" y2="10"/></svg> Payment Records</a>
      <a href="/manager/departure-approval.html"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg> Departure Approval</a>
      <a href="/manager/sos-alerts.html" class="active"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="7.86 2 16.14 2 22 7.86 22 16.14 16.14 22 7.86 22 2 16.14 2 7.86 7.86 7.86"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg> SOS Alerts</a>
      <a href="/manager/weather.html"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 10h-1.26A8 8 0 1 0 9 20h9a5 5 0 0 0 0-10z"/></svg> Weather</a>

    </div>
  </aside>

  <div class="admin-main">
    <header class="admin-header">
      <h2>SOS Alerts</h2>
      <span id="managerName" style="font-weight: 600;"></span>
    </header>

    <div class="admin-content">
      <div id="alertList" style="display: flex; flex-direction: column; gap: 0.75rem;">
        <p style="color: var(--text-muted);">Loading alerts...</p>
      </div>
    </div>
  </div>

  <script type="module">
    import { api } from '/js/api.js';
    import { auth } from '/js/auth.js';
    import { ui } from '/js/ui.js';

    const session = await auth.requireAuth(['port_manager']);
    if (!session) throw new Error('Unauthorized');
    document.getElementById('managerName').textContent = session.full_name;

    const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

    async function load() {
      const alerts = await api.alerts.list();
      const list = document.getElementById('alertList');
      if (!alerts.length) {
        list.innerHTML = '<p style="color: var(--text-muted);">No SOS alerts.</p>';
        return;
      }
      list.innerHTML = alerts.map(a => `
        <div class="card">
          <div style="display: flex; justify-content: space-between; gap: 1rem; align-items: center; flex-wrap: wrap;">
            <div>
              <span class="badge badge-${esc(String(a.status).toLowerCase())}">${esc(a.status)}</span>
              <strong style="margin-left: 0.5rem;">${esc(a.sender_role)}</strong>
              <p style="margin-top: 0.5rem;">${esc(a.message)}</p>
              <small style="color: var(--text-muted);">${new Date(a.created_at).toLocaleString()}${a.acknowledged_by ? ` &middot; Acknowledged by ${esc(a.acknowledged_by)}` : ''}</small>
            </div>
            ${a.status === 'Open' ? `<button class="btn btn-danger btn-sm ack" data-id="${esc(a.id)}">Acknowledge</button>` : ''}
          </div>
        </div>`).join('');

      list.querySelectorAll('.ack').forEach(b => b.onclick = async () => {
        try {
          await api.alerts.acknowledge(b.dataset.id, session.full_name);
          ui.showToast('Alert acknowledged.', 'success');
          load();
        } catch (err) {
          ui.showToast(err.message, 'error');
        }
      });
    }

    await load();

    document.getElementById('logoutBtn').onclick = async (e) => {
      e.preventDefault();
      await api.auth.logout();
      window.location.href = '/login.html';
    };
  </script>
</body>
</html>
