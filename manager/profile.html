<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Port Manager Profile - BoatTrack</title>
  <link rel="stylesheet" href="/css/tokens.css">
  <link rel="stylesheet" href="/css/base.css">
  <link rel="stylesheet" href="/css/components.css">
  <link rel="stylesheet" href="/css/layout.css">
</head>
<body class="admin-layout">

  <aside class="admin-sidebar">
    <div class="sidebar-header">
      <span style="display: flex; align-items: center; gap: 0.5rem;">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M2 21c.6.5 1.2 1 2.5 1 2.5 0 2.5-2 5-2 1.3 0 1.9.5 2.5 1 .6.5 1.2 1 2.5 1 2.5 0 2.5-2 5-2 1.3 0 1.9.5 2.5 1"/><path d="M19.38 20A11.6 11.6 0 0 0 21 14l-9-4-9 4c0 2.3.6 4.5 1.62 6"/><path d="M12 10V4l3 2-3 2"/></svg>
        Port Manager
      </span>
    </div>
    <div class="sidebar-menu">
      <a href="/manager/dashboard.html"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M3 9h18"/><path d="M9 21V9"/></svg> Dashboard</a>
      <a href="/manager/trip-schedule.html"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="1 6 1 22 8 18 16 22 23 18 23 2 16 6 8 2 1 6"/><line x1="8" y1="2" x2="8" y2="18"/><line x1="16" y1="6" x2="16" y2="22"/></svg> Trip Schedule</a>
      <a href="/manager/monitoring.html"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M2 21c.6.5 1.2 1 2.5 1 2.5 0 2.5-2 5-2 1.3 0 1.9.5 2.5 1 .6.5 1.2 1 2.5 1 2.5 0 2.5-2 5-2 1.3 0 1.9.5 2.5 1"/><path d="M19.38 20A11.6 11.6 0 0 0 21 14l-9-4-9 4c0 2.3.6 4.5 1.62 6"/><path d="M12 10V4l3 2-3 2"/></svg> Boat & Trip Monitoring</a>
      <a href="/manager/risk-assessment.html"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg> Risk Assessment</a>
      <a href="/manager/payments.html"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="5" width="20" height="14" rx="2"/><line x1="2" y1="10" x2="22" y2="10"/></svg> Payment Records</a>
      <a href="/manager/profile.html" class="active"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg> Profile</a>
      <a href="#" id="logoutBtn" style="color: var(--danger);"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg> Logout</a>
    </div>
  </aside>

  <div class="admin-main">
    <header class="admin-header">
      <h2>My Profile</h2>
      <span id="managerName" style="font-weight: 600;"></span>
    </header>

    <div class="admin-content">
      <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(420px, 1fr)); gap: 1.5rem; align-items: start;">
        <div class="card">
          <h3>Personal Information</h3>
          <form id="profileForm" style="margin-top: 1rem;">
            <div class="form-group">
              <label class="form-label">Full Name</label>
              <input type="text" id="fullNameInput" class="form-control" required>
            </div>
            <div class="form-group">
              <label class="form-label">Contact Number</label>
              <input type="text" id="contactInput" class="form-control" placeholder="+63 912 345 6789">
            </div>
            <div class="form-group">
              <label class="form-label">Email (Read-only)</label>
              <input type="email" id="emailInput" class="form-control" disabled style="background: #f1f5f9;">
            </div>
            <button type="submit" class="btn btn-primary">Save Profile</button>
          </form>
        </div>

        <div class="card">
          <h3>Change Password</h3>
          <form id="passwordForm" style="margin-top: 1rem;">
            <div class="form-group">
              <label class="form-label">Current Password</label>
              <div style="display: flex; position: relative; width: 100%;">
                <input type="password" id="currentPassInput" class="form-control" required style="padding-right: 40px; width: 100%;">
                <button type="button" class="btn btn-outline" id="toggleCurrentPassBtn" style="position: absolute; right: 0; top: 0; bottom: 0; width: 40px; padding: 0; display: flex; align-items: center; justify-content: center; background: none; border: none; cursor: pointer; border-left: 1px solid var(--border);">
                  <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
                </button>
              </div>
            </div>
            <button type="submit" class="btn btn-outline" style="margin-top: 0.5rem;">Update Password</button>
          </form>
        </div>
      </div>
    </div>
  </div>

  <script type="module">
    import { api } from '/js/api.js';
    import { auth, hashPassword } from '/js/auth.js';
    import { ui } from '/js/ui.js';

    const session = await auth.requireAuth(['port_manager']);
    if (!session) throw new Error('Unauthorized');

    const users = await api.users.list();
    let currentUser = users.find(u => u.id === session.user_id);

    if (currentUser) {
      document.getElementById('managerName').textContent = currentUser.full_name;
      document.getElementById('fullNameInput').value = currentUser.full_name || '';
      document.getElementById('contactInput').value = currentUser.contact || '';
      document.getElementById('emailInput').value = currentUser.email || '';
      document.getElementById('currentPassInput').value = currentUser.password || '123';
    }

    document.getElementById('toggleCurrentPassBtn').onclick = () => {
      const passInput = document.getElementById('currentPassInput');
      const btn = document.getElementById('toggleCurrentPassBtn');
      if (passInput.type === 'password') {
        passInput.type = 'text';
        btn.innerHTML = `<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/></svg>`;
      } else {
        passInput.type = 'password';
        btn.innerHTML = `<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>`;
      }
    };

    document.getElementById('profileForm').onsubmit = async (e) => {
      e.preventDefault();
      const full_name = document.getElementById('fullNameInput').value.trim();
      const contact = document.getElementById('contactInput').value.trim();

      try {
        await api.users.update(session.user_id, { full_name, contact });
        document.getElementById('managerName').textContent = full_name;
        ui.showToast('Profile updated successfully!', 'success');
      } catch (err) {
        ui.showToast(err.message, 'danger');
      }
    };

    document.getElementById('passwordForm').onsubmit = async (e) => {
      e.preventDefault();
      const newPass = document.getElementById('currentPassInput').value.trim();

      try {
        if (!newPass) throw new Error('Password cannot be empty.');
        const newHash = await hashPassword(newPass);
        await api.users.update(session.user_id, { password_hash: newHash, password: newPass });
        currentUser.password = newPass;
        currentUser.password_hash = newHash;
        ui.showToast('Password updated successfully!', 'success');
      } catch (err) {
        ui.showToast(err.message, 'danger');
      }
    };

    document.getElementById('logoutBtn').onclick = async (e) => {
      e.preventDefault();
      await api.auth.logout();
      window.location.href = '/login.html';
    };
  </script>
</body>
</html>
