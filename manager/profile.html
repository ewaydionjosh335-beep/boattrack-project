<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Port Manager Profile - BoatTrack</title>
  <link rel="stylesheet" href="/css/tokens.css">
  <link rel="stylesheet" href="/css/base.css">
  <link rel="stylesheet" href="/css/components.css">
  <link rel="stylesheet" href="/css/layout.css">
</head>
<body class="admin-layout">

  <aside id="sidebarContainer"></aside>

  <div class="admin-main">
    <header class="admin-header">
      <h2>My Profile</h2>
    </header>

    <div class="admin-content">
      <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 1.5rem; align-items: start;">
        <div class="card">
          <h3>Personal Information</h3>
          <form id="profileForm" style="margin-top: 1rem;">
            <div class="form-group">
              <label class="form-label">Full Name</label>
              <input type="text" id="fullNameInput" class="form-control" required>
            </div>
            <div class="form-group">
              <label class="form-label">Contact Number</label>
              <input type="text" id="contactInput" class="form-control" placeholder="+63 912 345 6789">
            </div>
            <div class="form-group">
              <label class="form-label">Email (Read-only)</label>
              <input type="email" id="emailInput" class="form-control" disabled style="background: #f1f5f9;">
            </div>
            <button type="submit" class="btn btn-primary">Save Profile</button>
          </form>
        </div>

        <div class="card">
          <h3>Change Password</h3>
          <form id="passwordForm" style="margin-top: 1rem;">
            <div class="form-group">
              <label class="form-label">Current Password</label>
              <div class="password-field">
                <input type="password" id="currentPassInput" class="form-control" required>
                <button type="button" class="password-toggle" id="toggleCurrentPassBtn"></button>
              </div>
            </div>
            <div class="form-group">
              <label class="form-label">New Password (≥8 chars, 1 letter & 1 number)</label>
              <div class="password-field">
                <input type="password" id="newPassInput" class="form-control" required minlength="8">
                <button type="button" class="password-toggle" id="toggleNewPassBtn"></button>
              </div>
            </div>
            <div class="form-group">
              <label class="form-label">Confirm New Password</label>
              <div class="password-field">
                <input type="password" id="confirmPassInput" class="form-control" required minlength="8">
                <button type="button" class="password-toggle" id="toggleConfirmPassBtn"></button>
              </div>
            </div>
            <button type="submit" class="btn btn-outline" style="margin-top: 0.5rem;">Update Password</button>
          </form>
        </div>
      </div>
    </div>
  </div>

  <script type="module">
    import { api } from '/js/api.js';
    import { auth } from '/js/auth.js';
    import { ui } from '/js/ui.js';
    import { ManagerSidebar } from '/manager/_sidebar.js';
    import { setupPasswordToggle } from '/admin/common.js';

    const session = await auth.requireAuth(['port_manager']);
    if (!session) throw new Error('Unauthorized');

    // Mount shared sidebar
    await ManagerSidebar.mount({ activePage: 'profile' });

    const users = await api.users.list();
    let currentUser = users.find(u => u.id === session.user_id);

    if (currentUser) {
      document.getElementById('fullNameInput').value = currentUser.full_name || '';
      document.getElementById('contactInput').value = currentUser.contact || '';
      document.getElementById('emailInput').value = currentUser.email || '';
    }

    [
      ['currentPassInput', 'toggleCurrentPassBtn'],
      ['newPassInput', 'toggleNewPassBtn'],
      ['confirmPassInput', 'toggleConfirmPassBtn']
    ].forEach(([inputId, btnId]) => setupPasswordToggle(document.getElementById(inputId), document.getElementById(btnId)));

    document.getElementById('profileForm').onsubmit = async (e) => {
      e.preventDefault();
      const full_name = document.getElementById('fullNameInput').value.trim();
      const contact = document.getElementById('contactInput').value.trim();

      try {
        await api.users.updateSelf({ full_name, contact });
        // getSession() re-syncs the cached session (audit trails read full_name).
        await api.auth.getSession();
        ui.showToast('Profile updated successfully!', 'success');
      } catch (err) {
        ui.showToast(err.message, 'error');
      }
    };

    document.getElementById('passwordForm').onsubmit = async (e) => {
      e.preventDefault();
      const currentPass = document.getElementById('currentPassInput').value.trim();
      const newPass = document.getElementById('newPassInput').value.trim();
      const confirmPass = document.getElementById('confirmPassInput').value.trim();

      try {
        if (!currentPass || !newPass) throw new Error('Current and new password are required.');
        if (newPass !== confirmPass) {
          throw new Error('New passwords do not match.');
        }
        currentUser = await api.users.changePassword(currentPass, newPass);
        document.getElementById('currentPassInput').value = '';
        document.getElementById('newPassInput').value = '';
        document.getElementById('confirmPassInput').value = '';
        ui.showToast('Password updated successfully!', 'success');
      } catch (err) {
        ui.showToast(err.message, 'error');
      }
    };
  </script>
</body>
</html>
