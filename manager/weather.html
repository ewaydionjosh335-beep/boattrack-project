<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Weather Monitoring - BoatTrack</title>
  <link rel="stylesheet" href="/css/tokens.css">
  <link rel="stylesheet" href="/css/base.css">
  <link rel="stylesheet" href="/css/components.css">
  <link rel="stylesheet" href="/css/layout.css">
</head>
<body class="admin-layout">

  <aside class="admin-sidebar">
    <div class="sidebar-header">
      <span style="display: flex; align-items: center; gap: 0.5rem;">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M2 21c.6.5 1.2 1 2.5 1 2.5 0 2.5-2 5-2 1.3 0 1.9.5 2.5 1 .6.5 1.2 1 2.5 1 2.5 0 2.5-2 5-2 1.3 0 1.9.5 2.5 1"/><path d="M19.38 20A11.6 11.6 0 0 0 21 14l-9-4-9 4c0 2.3.6 4.5 1.62 6"/><path d="M12 10V4l3 2-3 2"/></svg>
        Port Manager
      </span>
    </div>
    <div class="sidebar-menu">
      <a href="/manager/dashboard.html"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M3 9h18"/><path d="M9 21V9"/></svg> Dashboard</a>
      <a href="/manager/trip-schedule.html"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="1 6 1 22 8 18 16 22 23 18 23 2 16 6 8 2 1 6"/><line x1="8" y1="2" x2="8" y2="18"/><line x1="16" y1="6" x2="16" y2="22"/></svg> Trip Schedule</a>
      <a href="/manager/monitoring.html"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M2 21c.6.5 1.2 1 2.5 1 2.5 0 2.5-2 5-2 1.3 0 1.9.5 2.5 1 .6.5 1.2 1 2.5 1 2.5 0 2.5-2 5-2 1.3 0 1.9.5 2.5 1"/><path d="M19.38 20A11.6 11.6 0 0 0 21 14l-9-4-9 4c0 2.3.6 4.5 1.62 6"/><path d="M12 10V4l3 2-3 2"/></svg> Boat &amp; Trip Monitoring</a>
      <a href="/manager/risk-assessment.html"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg> Risk Assessment</a>
      <a href="/manager/payments.html"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="5" width="20" height="14" rx="2"/><line x1="2" y1="10" x2="22" y2="10"/></svg> Payment Records</a>
      <a href="/manager/departure-approval.html"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg> Departure Approval</a>
      <a href="/manager/weather.html" class="active"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 10h-1.26A8 8 0 1 0 9 20h9a5 5 0 0 0 0-10z"/></svg> Weather</a>
      <a href="/manager/profile.html"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg> Profile</a>
      <a href="#" id="logoutBtn" style="color: var(--danger);"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg> Logout</a>
    </div>
  </aside>

  <div class="admin-main">
    <header class="admin-header">
      <h2>Weather Monitoring</h2>
      <button id="refreshAllBtn" class="btn btn-outline">Refresh All</button>
    </header>

    <div class="admin-content">
      <div id="weatherGrid" class="grid" style="display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 1rem;">
        <p style="color: var(--text-muted);">Loading weather...</p>
      </div>
    </div>
  </div>

  <script type="module">
    import { api } from '/js/api.js';
    import { auth } from '/js/auth.js';
    import { ui } from '/js/ui.js';
    import { weatherService } from '/js/services/weatherService.js';

    const session = await auth.requireAuth(['port_manager']);
    if (!session) throw new Error('Unauthorized');

    const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
    const fmt = v => (v === undefined || v === null || v === '' ? '-' : v);

    const terminals = await api.terminals.list();

    async function render() {
      const grid = document.getElementById('weatherGrid');
      const cards = [];
      // Fetch all terminals together so one slow API call does not delay the rest.
      const records = await Promise.all(terminals.map(t => weatherService.fetchForTerminal(t)));
      terminals.forEach((t, i) => {
        const rec = records[i];
         cards.push(`
           <div class="card" style="padding: 1.5rem; display: flex; flex-direction: column;">
             <div style="display: flex; justify-content: space-between; align-items: flex-start; gap: 0.75rem; margin-bottom: 0.75rem; min-height: 3.25rem;">
               <h3 style="margin: 0; font-size: 1.15rem; color: var(--primary); flex: 1; min-width: 0; line-height: 1.4; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;">${esc(t.name)}</h3>
               <button class="btn btn-outline btn-sm refresh" data-term="${esc(t.id)}" style="padding: 0.5rem 1rem; font-size: 0.9rem; flex-shrink: 0; white-space: nowrap;">Refresh</button>
             </div>
             <p style="color: var(--text-muted); font-size: 0.95rem; margin-bottom: 0.75rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;">${esc(t.location || '')}</p>
             <p style="margin-bottom: 1rem; display: flex; align-items: center; gap: 0.5rem; white-space: nowrap; overflow: hidden;"><span class="badge badge-pending" style="padding: 0.3rem 0.75rem; font-size: 0.8rem; flex-shrink: 0;">${esc(rec.source)}</span> <small style="color: var(--text-muted); font-size: 0.85rem; overflow: hidden; text-overflow: ellipsis;">${new Date(rec.fetched_at).toLocaleString()}</small></p>
             <table style="width: 100%; font-size: 1rem; margin-top: 0.5rem;">
               <tbody>
                 <tr><td style="padding: 0.5rem 0;">Temperature</td><td style="text-align: right; padding: 0.5rem 0;"><strong style="font-size: 1.1rem;">${fmt(rec.temperature_c)}&deg;C</strong></td></tr>
                 <tr><td style="padding: 0.5rem 0;">Wind / Gust</td><td style="text-align: right; padding: 0.5rem 0;"><strong style="font-size: 1.1rem;">${fmt(rec.wind_speed_kmh)} / ${fmt(rec.wind_gust_kmh)} km/h</strong></td></tr>
                 <tr><td style="padding: 0.5rem 0;">Rain chance</td><td style="text-align: right; padding: 0.5rem 0;"><strong style="font-size: 1.1rem;">${fmt(rec.precipitation_probability)}%</strong></td></tr>
                 <tr><td style="padding: 0.5rem 0;">Visibility</td><td style="text-align: right; padding: 0.5rem 0;"><strong style="font-size: 1.1rem;">${fmt(rec.visibility_m)} m</strong></td></tr>
               </tbody>
             </table>
           </div>`);
      });
      grid.innerHTML = cards.join('') || '<p style="color: var(--text-muted);">No terminals found.</p>';

      grid.querySelectorAll('.refresh').forEach(b => b.onclick = async () => {
        const t = terminals.find(x => x.id === b.dataset.term);
        if (!t) return;
        b.disabled = true;
        try {
          localStorage.removeItem('weather_cache_' + t.id);
          const rec = await weatherService.fetchForTerminal(t);
          await api.weatherRecords.create(rec);
          ui.showToast('Weather refreshed for ' + t.name, 'success');
          render();
        } catch (err) {
          ui.showToast(err.message, 'error');
          b.disabled = false;
        }
      });
    }

    await render();

    document.getElementById('refreshAllBtn').onclick = async () => {
      const btn = document.getElementById('refreshAllBtn');
      btn.disabled = true;
      try {
        terminals.forEach(t => localStorage.removeItem('weather_cache_' + t.id));
        await render();
        ui.showToast('All weather data refreshed.', 'success');
      } catch (err) {
        ui.showToast(err.message, 'error');
      } finally {
        btn.disabled = false;
      }
    };

    document.getElementById('logoutBtn').onclick = async (e) => {
      e.preventDefault();
      await api.auth.logout();
      window.location.href = '/login.html';
    };
  </script>
</body>
</html>
