<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Weather Monitoring - BoatTrack</title>
  <link rel="stylesheet" href="/css/tokens.css">
  <link rel="stylesheet" href="/css/base.css">
  <link rel="stylesheet" href="/css/components.css">
  <link rel="stylesheet" href="/css/layout.css">
</head>
<body class="admin-layout">

  <aside id="sidebarContainer"></aside>

  <div class="admin-main">
    <header class="admin-header">
      <h2>Weather Monitoring</h2>
      <button id="refreshAllBtn" class="btn btn-primary">Refresh</button>
    </header>

    <div class="admin-content">
      <div id="weatherGrid" class="grid" style="display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 1rem;">
        <p style="color: var(--text-muted);">Loading weather...</p>
      </div>
    </div>
  </div>

  <script type="module">
    import { api } from '/js/api.js';
    import { auth } from '/js/auth.js';
    import { ui } from '/js/ui.js';
    import { weatherService } from '/js/services/weatherService.js';
    import { ManagerSidebar } from '/manager/_sidebar.js';

    const session = await auth.requireAuth(['port_manager']);
    if (!session) throw new Error('Unauthorized');

    // Mount shared sidebar
    await ManagerSidebar.mount({ activePage: 'weather' });

    const esc = ui.escapeHtml;
    const fmt = v => (v === undefined || v === null || v === '' ? '-' : v);

    async function loadWeather(force = false) {
      const terminals = await api.terminals.list();
      const grid = document.getElementById('weatherGrid');
      grid.innerHTML = '';

      if (terminals.length === 0) {
        grid.innerHTML = '<p style="color: var(--text-muted); grid-column: 1/-1;">No terminals configured.</p>';
        return;
      }

      for (const term of terminals) {
        const card = document.createElement('div');
        card.className = 'card';
        card.style.cssText = 'padding: 1.25rem;';
        if (!term.lat || !term.lng) {
          card.innerHTML = `
            <h3 style="margin-bottom: 0.5rem;">${esc(term.name)}</h3>
            <p style="color: var(--danger);">Missing coordinates — cannot fetch weather.</p>
          `;
          grid.appendChild(card);
          continue;
        }

        card.innerHTML = `
          <h3 style="margin-bottom: 0.75rem;">${esc(term.name)}</h3>
          <p style="color: var(--text-muted); font-size: 0.85rem; margin-bottom: 0.75rem;">Lat: ${term.lat}, Lng: ${term.lng}</p>
          <div id="weather-${esc(term.id)}" style="font-size: 0.9rem; color: var(--text-muted);">Loading...</div>
        `;
        grid.appendChild(card);
      }

      // Initial load for all terminals
      for (const term of terminals) {
        if (!term.lat || !term.lng) continue;
        try {
          const rec = await weatherService.fetchForTerminal(term, null, { force });
          const container = document.getElementById(`weather-${term.id}`);
          if (container) container.innerHTML = formatWeather(rec);
        } catch (err) {
          const container = document.getElementById(`weather-${term.id}`);
          if (container) container.innerHTML = `<span style="color: var(--danger);">${esc(err.message)}</span>`;
        }
      }
    }

    function formatWeather(rec) {
      const hourly = rec.hourly || [];
      const now = new Date();
      let best = hourly[0];
      let bestDiff = Infinity;
      for (const h of hourly) {
        const diff = Math.abs(new Date(h.for_time).getTime() - now.getTime());
        if (diff < bestDiff) {
          bestDiff = diff;
          best = h;
        }
      }
      return `
        <div style="display: grid; grid-template-columns: repeat(2, 1fr); gap: 0.5rem; margin-bottom: 0.5rem;">
          <div><strong>Temp:</strong> ${fmt(best.temperature_c)}°C</div>
          <div><strong>Wind:</strong> ${fmt(best.wind_speed_kmh)} km/h</div>
          <div><strong>Gust:</strong> ${fmt(best.wind_gust_kmh)} km/h</div>
          <div><strong>Precip:</strong> ${fmt(best.precipitation_mm)} mm (${fmt(best.precipitation_probability)}%)</div>
          <div><strong>Vis:</strong> ${fmt(best.visibility_m)} m</div>
          <div><strong>Code:</strong> ${fmt(best.weather_code)}</div>
          <div><strong>For:</strong> ${new Date(best.for_time).toLocaleString()}</div>
          <div><strong>Source:</strong> ${esc(rec.source)}</div>
        </div>
      `;
    }

    document.getElementById('refreshAllBtn').onclick = async () => {
      const btn = document.getElementById('refreshAllBtn');
      btn.disabled = true;
      try {
        await loadWeather(true);
        ui.showToast('Weather data refreshed.', 'success');
      } catch (err) {
        ui.showToast(err.message, 'error');
      } finally {
        btn.disabled = false;
      }
    };

    loadWeather();
    ui.setupSync(loadWeather);
  </script>
</body>
</html>
