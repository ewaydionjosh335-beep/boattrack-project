<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Boat & Trip Monitoring - BoatTrack Port Manager</title>
  <link rel="stylesheet" href="/css/tokens.css">
  <link rel="stylesheet" href="/css/base.css">
  <link rel="stylesheet" href="/css/components.css">
  <link rel="stylesheet" href="/css/layout.css">
  <style>
    .boat-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 1.5rem; }
    .boat-card { background: white; border-radius: var(--radius-md); border: 1px solid var(--border); box-shadow: var(--shadow-sm); padding: 1.25rem; display: flex; flex-direction: column; gap: 1rem; }
    .progress-bar-container { background: #e2e8f0; border-radius: 999px; height: 16px; overflow: hidden; position: relative; margin-top: 0.25rem; }
    .progress-bar { height: 100%; transition: width 0.3s ease; }
    .boat-details { display: flex; flex-direction: column; gap: 1rem; }
    .boat-details[hidden] { display: none; }
  </style>
</head>
<body class="admin-layout">

  <aside id="sidebarContainer"></aside>

  <div class="admin-main">
    <header class="admin-header">
      <h2>Boat & Trip Monitoring</h2>
      <input type="text" id="searchBoatInput" class="form-control" placeholder="Search boats..." aria-label="Search boats" style="max-width: 250px;">
    </header>

    <div class="admin-content">
      <div id="boatGridContainer" class="boat-grid">
        <p style="color: var(--text-muted);">Loading verified boats and monitoring data...</p>
      </div>
    </div>
  </div>

  <!-- SUSPEND BOAT MODAL -->
  <div id="suspendModal" class="modal-backdrop" style="display: none;">
    <div class="modal">
      <div class="modal-header">
        <h3 style="color: var(--danger);">Suspend Boat</h3>
        <button type="button" class="modal-close" id="closeSuspendModalBtn" aria-label="Close">&times;</button>
      </div>
      <form id="suspendForm">
        <div class="modal-body">
          <input type="hidden" id="suspendBoatId">
          <p style="font-size: 0.9rem; margin-bottom: 1rem; color: var(--text-muted);">
            Suspending this boat will automatically set all its scheduled trips to <strong>Held</strong> with the reason "Boat suspended".
          </p>
          <div class="form-group">
            <label class="form-label">Suspension Reason</label>
            <textarea id="suspendReasonInput" class="form-control" rows="3" required placeholder="Enter suspension reason (e.g. Engine failure, Coast Guard order)..."></textarea>
          </div>
          <div id="suspendError" class="error-text"></div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-outline" id="cancelSuspendModalBtn">Cancel</button>
          <button type="submit" class="btn btn-danger">Confirm Suspension</button>
        </div>
      </form>
    </div>
  </div>

  <!-- BOAT DETAILS MODAL -->
  <div id="boatDetailsModal" class="modal-backdrop" style="display: none;">
    <div class="modal" style="max-width: 560px;">
      <div class="modal-header">
        <h3 id="boatDetailsTitle">Boat Details</h3>
        <button type="button" class="modal-close" id="closeBoatDetailsModalBtn" aria-label="Close">&times;</button>
      </div>
      <div class="modal-body" id="boatDetailsModalBody"></div>
    </div>
  </div>

  <script type="module">
    import { api } from '/js/api.js';
    import { auth } from '/js/auth.js';
    import { ui } from '/js/ui.js';
    import { loadService } from '/js/services/loadService.js';
    import { ManagerSidebar } from '/manager/_sidebar.js';

    const session = await auth.requireAuth(['port_manager']);
    if (!session) throw new Error('Unauthorized');

    // Mount shared sidebar
    await ManagerSidebar.mount({ activePage: 'monitoring' });

    const esc = ui.escapeHtml;

    let allBoats = [];
    let allTrips = [];
    let allManifests = [];
    let allBookings = [];
    let allUsers = [];
    let allPassengers = [];
    let allRoutes = [];
    let allTerminals = [];
    let allInspections = [];

    async function loadData() {
      allBoats = await api.boats.list();
      allTrips = await api.trips.list();
      allManifests = await api.manifests.list();
      allBookings = await api.bookings.list();
      allUsers = await api.users.list();
      allPassengers = await api.passengers.list();
      allRoutes = await api.routes.list();
      allTerminals = await api.terminals.list();
      allInspections = await api.inspections.list();

      // Filter for verified boats only
      const verifiedBoats = allBoats.filter(b => b.registration_status === 'Verified');

      // Search filter
      const searchInput = document.getElementById('searchBoatInput');
      const searchTerm = searchInput.value.toLowerCase().trim();
      const displayBoats = searchTerm
        ? verifiedBoats.filter(b => b.name.toLowerCase().includes(searchTerm))
        : verifiedBoats;

      // Build boat cards
      const container = document.getElementById('boatGridContainer');
      if (displayBoats.length === 0) {
        container.innerHTML = '<p style="color: var(--text-muted); grid-column: 1/-1;">No verified boats found.</p>';
        return;
      }

      container.innerHTML = displayBoats.map(boat => {
        // Trips for this boat
        const boatTrips = allTrips.filter(t => t.boat_id === boat.id);
        const activeTrips = boatTrips.filter(t => t.trip_status === 'Scheduled' || t.trip_status === 'Held' || t.trip_status === 'Departed');
        const heldTrips = boatTrips.filter(t => t.trip_status === 'Held');
        const departedTrips = boatTrips.filter(t => t.trip_status === 'Departed');
        const arrivedTrips = boatTrips.filter(t => t.trip_status === 'Arrived');

        // Load calculations for active trips
        let totalManifestPax = 0;
        let peakTripPax = 0;
        let peakTripLoad = 0;

        activeTrips.forEach(t => {
          const load = loadService.computeTripLoad({
            manifests: allManifests,
            passengers: allPassengers,
            bookings: allBookings,
            tripId: t.id
          });

          totalManifestPax += load.passenger_count;
          peakTripPax = Math.max(peakTripPax, load.passenger_count);
          peakTripLoad = Math.max(peakTripLoad, load.total_load_kg);
        });

        const maxLoad = Number(boat.max_load_kg);
        const hasCapacity = Number.isFinite(maxLoad) && maxLoad > 0;
        if (!hasCapacity) {
          console.warn(`Boat ${boat.name} (${boat.id}) has invalid max_load_kg: ${boat.max_load_kg}. Load percentage will be inaccurate.`);
        }
        const maxLoadDisplay = hasCapacity ? `${maxLoad} kg` : 'Unknown';
        const loadPercent = hasCapacity ? Math.min(100, (peakTripLoad / maxLoad) * 100) : 0;

        let barColor = 'var(--success)';
        let statusText = 'Safe Load';
        if (!hasCapacity) {
          // No capacity on file: never cry "exceeded" against an unknown limit.
          barColor = 'var(--text-muted)';
          statusText = 'Unknown capacity';
        } else if (peakTripLoad > maxLoad || peakTripPax > boat.passenger_capacity) {
          barColor = 'var(--danger)';
          statusText = 'Capacity/Load Exceeded!';
        } else if (loadPercent >= 80) {
          barColor = 'var(--warning)';
          statusText = 'High Load';
        }

        return `
          <div class="boat-card" id="boat-card-${boat.id}" role="button" tabindex="0" style="display: flex; flex-direction: column; height: 100%; cursor: pointer;"
               onclick="openBoatDetails('${boat.id}')"
               onkeydown="if (event.key === 'Enter' || event.key === ' ') { event.preventDefault(); openBoatDetails('${boat.id}'); }">
            <div style="display: flex; justify-content: space-between; align-items: start; flex-shrink: 0;">
              <div>
                <h3 style="margin-bottom: 0.25rem;">${esc(boat.name)}</h3>
                <span style="font-size: 0.85rem; color: var(--text-muted);">${esc(boat.boat_type)} | Max Cap: ${boat.passenger_capacity} Pax | Max Load: ${esc(maxLoadDisplay)}</span>
              </div>
              <span class="badge" style="background: ${esc(boat.boat_status === 'Active' ? 'var(--success)' : 'var(--danger)')}; color: white; padding: 0.3rem 0.75rem; font-size: 0.8rem;">${esc(boat.boat_status)}</span>
            </div>

            <div id="boat-details-${boat.id}" class="boat-details" hidden>
              <div style="display: flex; gap: 1rem; flex-wrap: wrap; font-size: 0.85rem; color: var(--text-main);">
                <div style="background: #f8fafc; padding: 0.5rem 0.75rem; border-radius: var(--radius-sm);">
                  <div style="color: var(--text-muted); font-size: 0.75rem;">Total Manifest Pax</div>
                  <div style="font-weight: 600;">${totalManifestPax}</div>
                </div>
                <div style="background: #f8fafc; padding: 0.5rem 0.75rem; border-radius: var(--radius-sm);">
                  <div style="color: var(--text-muted); font-size: 0.75rem;">Peak Trip Pax</div>
                  <div style="font-weight: 600;">${peakTripPax} / ${boat.passenger_capacity}</div>
                </div>
                <div style="background: #f8fafc; padding: 0.5rem 0.75rem; border-radius: var(--radius-sm);">
                  <div style="color: var(--text-muted); font-size: 0.75rem;">Peak Trip Load</div>
                  <div style="font-weight: 600;">${Number(peakTripLoad).toFixed(1)} / ${esc(maxLoadDisplay)}</div>
                </div>
                <div style="background: #f8fafc; padding: 0.5rem 0.75rem; border-radius: var(--radius-sm);">
                  <div style="color: var(--text-muted); font-size: 0.75rem;">Load %</div>
                  <div style="font-weight: 600; color: ${barColor};">${loadPercent.toFixed(0)}%</div>
                </div>
              </div>

              <div class="progress-bar-container">
                <div class="progress-bar" style="width: ${loadPercent}%; background: ${barColor};"></div>
              </div>
              <div style="font-size: 0.8rem; color: ${barColor}; font-weight: 600;">${statusText}</div>

              <div style="border-top: 1px solid var(--border); padding-top: 0.75rem; display: flex; flex-direction: column; gap: 0.5rem;">
                ${activeTrips.length > 0 ? `
                  <div style="display: flex; justify-content: space-between; align-items: center; font-size: 0.9rem;">
                    <strong>Active Trips (${activeTrips.length})</strong>
                    ${heldTrips.length > 0 ? `<span class="badge badge-held">${heldTrips.length} Held</span>` : ''}
                  </div>
                  ${activeTrips.map(t => {
                    const route = allRoutes.find(r => r.id === t.route_id) || {};
                    const origin = allTerminals.find(trm => trm.id === route.origin_terminal_id)?.name || 'Origin';
                    const dest = allTerminals.find(trm => trm.id === route.destination_terminal_id)?.name || 'Destination';
                    const time = new Date(t.departure_time).toLocaleString([], { dateStyle: 'short', timeStyle: 'short' });
                    let badgeClass = 'badge-scheduled';
                    if (t.trip_status === 'Held') badgeClass = 'badge-held';
                    else if (t.trip_status === 'Departed') badgeClass = 'badge-departed';
                    return `
                      <div style="font-size: 0.8rem; padding: 0.375rem; background: #f8fafc; border-radius: var(--radius-sm); display: flex; justify-content: space-between; align-items: center;">
                        <span>${esc(origin)} &rarr; ${esc(dest)} &middot; ${time}</span>
                        <span class="badge ${badgeClass}" style="font-size: 0.7rem; padding: 0.2rem 0.5rem;">${esc(t.trip_status)}${t.trip_status === 'Held' && t.held_reason ? ': ' + esc(t.held_reason) : ''}</span>
                      </div>
                    `;
                  }).join('')}
                ` : '<p style="font-size: 0.85rem; color: var(--text-muted);">No active trips for this boat.</p>'}
              </div>
            </div>

            <div style="display: flex; gap: 0.5rem; padding-top: 0.75rem; border-top: 1px solid var(--border); margin-top: auto;">
              ${boat.boat_status === 'Active' ? `
                <button class="btn btn-danger btn-sm" onclick="event.stopPropagation(); openSuspendModal('${boat.id}')">Suspend</button>
              ` : `
                <button class="btn btn-success btn-sm" onclick="event.stopPropagation(); reactivateBoat('${boat.id}')">Reactivate</button>
              `}
            </div>
          </div>
        `;
      }).join('');

      // Bind search
      searchInput.oninput = () => loadData();
    }

    // Details + suspend dialogs share the app-wide modal helper so Escape,
    // focus trap and focus restore behave like every other dialog.
    const boatDetailsModal = document.getElementById('boatDetailsModal');
    const boatDetailsDialog = ui.modal(boatDetailsModal);
    document.getElementById('closeBoatDetailsModalBtn').onclick = () => boatDetailsDialog.close();

    window.openBoatDetails = (id) => {
      const source = document.getElementById(`boat-details-${id}`);
      if (!source) return;
      document.getElementById('boatDetailsTitle').textContent =
        document.getElementById(`boat-card-${id}`)?.querySelector('h3')?.textContent || 'Boat Details';

      const copy = source.cloneNode(true);
      copy.removeAttribute('id');
      copy.removeAttribute('hidden');
      const body = document.getElementById('boatDetailsModalBody');
      body.innerHTML = '';
      body.appendChild(copy);
      boatDetailsDialog.open();
    };

    const suspendModal = document.getElementById('suspendModal');
    const suspendDialog = ui.modal(suspendModal);
    document.getElementById('closeSuspendModalBtn').onclick = () => suspendDialog.close();
    document.getElementById('cancelSuspendModalBtn').onclick = () => suspendDialog.close();

    function openSuspendModal(id) {
      document.getElementById('suspendBoatId').value = id;
      document.getElementById('suspendReasonInput').value = '';
      document.getElementById('suspendError').textContent = '';
      suspendDialog.open();
    }
    // Module scope is invisible to inline onclick handlers — expose explicitly,
    // like reactivateBoat below.
    window.openSuspendModal = openSuspendModal;

    document.getElementById('suspendForm').onsubmit = async (e) => {
      e.preventDefault();
      const id = document.getElementById('suspendBoatId').value;
      const reason = document.getElementById('suspendReasonInput').value.trim();
      const errBox = document.getElementById('suspendError');
      errBox.textContent = '';

      try {
        if (!reason) throw new Error('A suspension reason is required.');
        await api.boats.updateStatus(id, 'Suspended', reason);
        ui.showToast('Boat suspended and scheduled trips placed on hold.', 'success');
        suspendDialog.close();
        await loadData();
      } catch (err) {
        errBox.textContent = err.message;
      }
    };

    window.reactivateBoat = async (id) => {
      ui.confirm('Are you sure you want to reactivate this boat? Note: Trips held by this suspension will be auto-released; manually held trips remain held for review.', async () => {
        try {
          await api.boats.updateStatus(id, 'Active');
          ui.showToast('Boat reactivated successfully.', 'success');
          await loadData();
        } catch (err) {
          ui.showToast(err.message, 'error');
        }
      });
    };

    loadData();
    ui.setupSync(loadData);
  </script>
</body>
</html>
