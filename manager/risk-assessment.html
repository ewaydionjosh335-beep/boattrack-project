<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Risk Assessment - BoatTrack Port Manager</title>
  <link rel="stylesheet" href="/css/tokens.css">
  <link rel="stylesheet" href="/css/base.css">
  <link rel="stylesheet" href="/css/components.css">
  <link rel="stylesheet" href="/css/layout.css">
</head>
<body class="admin-layout">

  <aside id="sidebarContainer"></aside>

  <div class="admin-main">
    <header class="admin-header">
      <h2>Risk Assessment & AI Risk Scan</h2>
    </header>

    <div class="admin-content">
      <div id="tripsRiskContainer" style="display: flex; flex-direction: column; gap: 1rem;">
        <p style="color: var(--text-muted);">Loading scheduled trips...</p>
      </div>

      <div class="card" style="margin-top: 1.5rem;">
        <h3>Recent Risk Scans</h3>
        <p style="color: var(--text-muted); font-size: 0.9rem; margin-bottom: 1rem;">Audit trail of the last 10 scans, including trips that were later held or departed.</p>
        <div class="table-container">
          <table>
            <thead>
              <tr>
                <th>Scanned At</th>
                <th>Vessel</th>
                <th>Trip Route</th>
                <th>Result</th>
                <th>Scanned By</th>
              </tr>
            </thead>
            <tbody id="recentScansBody">
              <tr><td colspan="5" class="table-message">Loading scans...</td></tr>
            </tbody>
          </table>
        </div>
      </div>

      <!-- RISK SCAN MODAL -->
      <div id="riskScanModal" class="modal-backdrop" style="display: none;">
        <div class="modal modal-lg">
          <div class="modal-header">
            <h3>Risk Scan Result</h3>
            <button type="button" class="modal-close" id="closeRiskModalBtn" aria-label="Close">&times;</button>
          </div>
          <div class="modal-body" id="riskModalBody">
            <p style="color: var(--text-muted);">Loading scan result...</p>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script type="module">
    import { api } from '/js/api.js';
    import { auth } from '/js/auth.js';
    import { ui } from '/js/ui.js';
    import { weatherService } from '/js/services/weatherService.js';
    import { riskAiService } from '/js/services/riskAiService.js';
    import { loadService } from '/js/services/loadService.js';
    import { ManagerSidebar } from '/manager/_sidebar.js';

    const session = await auth.requireAuth(['port_manager']);
    if (!session) throw new Error('Unauthorized');

    // Mount shared sidebar
    await ManagerSidebar.mount({ activePage: 'risk-assessment' });

    const esc = ui.escapeHtml;

    // Modal handlers
    const riskScanModal = document.getElementById('riskScanModal');
    let scanJustPerformed = false;
    // Shared helper provides Escape, backdrop close, focus trap and focus restore.
    const riskScanDialog = ui.modal(riskScanModal, {
      onClose: () => {
        if (scanJustPerformed) {
          scanJustPerformed = false;
          loadRiskData();
        }
      }
    });
    document.getElementById('closeRiskModalBtn').onclick = () => riskScanDialog.close();

    async function loadRiskData() {
      const trips = await api.trips.list();
      const boats = await api.boats.list();
      const manifests = await api.manifests.list();
      const bookings = await api.bookings.list();
      const passengers = await api.passengers.list();
      const terminals = await api.terminals.list();
      const routes = await api.routes.list();
      const scans = await api.riskScans.list();

      // Held trips still need a scan: they can be released and depart later.
      const scheduledTrips = trips.filter(t => t.trip_status === 'Scheduled' || t.trip_status === 'Held');
      const container = document.getElementById('tripsRiskContainer');

      container.innerHTML = scheduledTrips.map(trip => {
        const boat = boats.find(b => b.id === trip.boat_id) || {};
        const route = routes.find(r => r.id === trip.route_id) || {};
        const origin = terminals.find(t => t.id === route.origin_terminal_id)?.name || 'Origin';
        const dest = terminals.find(t => t.id === route.destination_terminal_id)?.name || 'Destination';
        const time = new Date(trip.departure_time).toLocaleString([], { dateStyle: 'short', timeStyle: 'short' });
        const ms = manifests.filter(m => m.trip_id === trip.id);

        return `
          <div class="card" style="display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 1.5rem; padding: 1.5rem; margin-bottom: 1rem;">
            <div style="flex: 1; min-width: 280px;">
              <h3 style="margin-bottom: 0.5rem; font-size: 1.15rem; color: var(--primary);">${esc(boat.name || 'Vessel')}</h3>
              <p style="font-size: 1rem; color: var(--text-muted); margin-bottom: 0.5rem;">${esc(origin)} &rarr; ${esc(dest)} &middot; Departure: ${time}</p>
              <p style="font-size: 0.95rem; margin-top: 0.25rem;">Status: <span class="badge badge-${esc(String(trip.trip_status).toLowerCase())}" style="padding: 0.3rem 0.75rem; font-size: 0.8rem;">${esc(trip.trip_status)}</span> &middot; Manifest: <strong>${ms.length} / ${boat.passenger_capacity || 0}</strong> pax &middot; Max Load: <strong>${boat.max_load_kg || 0} kg</strong></p>
            </div>
            <div>
              <button data-trip="${trip.id}" class="btn btn-primary scan-btn">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7Z"/><circle cx="12" cy="12" r="3"/></svg>
                Run Risk Scan
              </button>
            </div>
          </div>
        `;
      }).join('');

      if (scheduledTrips.length === 0) {
        container.innerHTML = '<p style="color: var(--text-muted);">No scheduled or held trips available for risk assessment.</p>';
      }

      // Bind scan buttons
      document.querySelectorAll('.scan-btn').forEach(btn => btn.addEventListener('click', async e => {
        // The click can land on the button's <svg>/<path>, so read the dataset from the button.
        const tripId = btn.dataset.trip;
        const trip = trips.find(t => t.id === tripId);
        if (!trip) { ui.showToast('Trip not found.', 'error'); return; }
        const boat = boats.find(b => b.id === trip.boat_id);
        const route = routes.find(r => r.id === trip.route_id);
        const term = route ? terminals.find(t => t.id === route.origin_terminal_id) : null;
        if (!boat || !route || !term) {
          ui.showToast('Trip is missing boat, route, or origin terminal data.', 'error');
          return;
        }
        if (!term.lat || !term.lng) {
          ui.showToast(`Origin terminal "${term.name}" is missing coordinates. Set them in Terminals before scanning.`, 'error');
          return;
        }
        const origin = term.name || 'Origin';
        const dest = terminals.find(t => t.id === route.destination_terminal_id)?.name || 'Destination';

        ui.showToast('Fetching weather forecast and computing load totals...', 'info');
        btn.disabled = true;

        try {
          const rec = await weatherService.fetchForTerminal(term, trip.departure_time);
          // Reuse an existing weather record for this terminal/time to avoid spam; only create when data is new.
          const existing = (await api.weatherRecords.list()).find(w => w.terminal_id === rec.terminal_id && w.for_time === rec.for_time);
          const weatherRecord = existing || await api.weatherRecords.create(rec);

          const load = loadService.computeTripLoad({
            manifests, passengers, bookings, tripId: trip.id
          });

          const forecast = {
            wind_speed_kmh: rec.wind_speed_kmh,
            wind_gust_kmh: rec.wind_gust_kmh,
            precipitation_probability: rec.precipitation_probability,
            weather_code: rec.weather_code,
            visibility_m: rec.visibility_m
          };
          const totals = {
            total_load_kg: load.total_load_kg,
            max_load_kg: boat.max_load_kg,
            passenger_count: load.passenger_count,
            passenger_capacity: boat.passenger_capacity,
            total_passenger_weight_kg: load.passenger_weight_kg,
            total_baggage_kg: load.baggage_weight_kg,
            total_cargo_kg: load.cargo_weight_kg
          };

          const r = riskAiService.classify({ forecast, totals });
          const payload = { forecast, totals };

          await api.riskScans.create({
            trip_id: tripId,
            boat_id: boat.id,
            weather_record_id: weatherRecord.id,
            passenger_count: load.passenger_count,
            passenger_capacity: boat.passenger_capacity,
            total_passenger_weight_kg: load.passenger_weight_kg,
            total_baggage_kg: load.baggage_weight_kg,
            total_cargo_kg: load.cargo_weight_kg,
            total_load_kg: load.total_load_kg,
            max_load_kg: boat.max_load_kg,
            classification: r.classification,
            explanation: r.explanation,
            ai_payload: payload,
            source: r.source,
            scanned_by: session.full_name,
            scanned_at: new Date().toISOString(),
            relayed_at: null,
            relayed_by: null
          });

          let badgeColor = 'var(--success)';
          if (r.classification === 'Caution') badgeColor = 'var(--warning)';
          else if (r.classification === 'Not Advisable') badgeColor = 'var(--danger)';

          document.getElementById('riskModalBody').innerHTML = `
          <div style="display: flex; align-items: center; justify-content: space-between; margin-bottom: 1rem; flex-wrap: wrap; gap: 0.5rem;">
            <h4 style="margin: 0; color: var(--primary);">Vessel: ${esc(boat.name)} <span style="font-weight: normal; font-size: 0.85rem; color: var(--text-muted);">(${esc(origin)} &rarr; ${esc(dest)})</span></h4>
            <span style="background: ${badgeColor}; color: white; padding: 0.5rem 1rem; border-radius: 999px; font-weight: 600; font-size: 1rem;">${esc(r.classification)}</span>
          </div>
          <div style="font-size: 0.95rem; color: var(--text-main); margin-bottom: 1rem; line-height: 1.6;">${esc(r.explanation)}</div>
          <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 0.75rem; margin-bottom: 1rem;">
            <div style="background: #f8fafc; padding: 0.75rem; border-radius: var(--radius-sm);">
              <div style="color: var(--text-muted); font-size: 0.8rem;">Load / Capacity</div>
              <div style="font-weight: 600;">${Number(totals.total_load_kg).toFixed(1)} / ${totals.max_load_kg} kg</div>
            </div>
            <div style="background: #f8fafc; padding: 0.75rem; border-radius: var(--radius-sm);">
              <div style="color: var(--text-muted); font-size: 0.8rem;">Passengers</div>
              <div style="font-weight: 600;">${totals.passenger_count} / ${totals.passenger_capacity}</div>
            </div>
            <div style="background: #f8fafc; padding: 0.75rem; border-radius: var(--radius-sm);">
              <div style="color: var(--text-muted); font-size: 0.8rem;">Wind / Gust</div>
              <div style="font-weight: 600;">${Number(forecast.wind_speed_kmh).toFixed(1)} / ${Number(forecast.wind_gust_kmh).toFixed(1)} km/h</div>
            </div>
            <div style="background: #f8fafc; padding: 0.75rem; border-radius: var(--radius-sm);">
              <div style="color: var(--text-muted); font-size: 0.8rem;">Precip. Probability</div>
              <div style="font-weight: 600;">${forecast.precipitation_probability}%</div>
            </div>
            <div style="background: #f8fafc; padding: 0.75rem; border-radius: var(--radius-sm);">
              <div style="color: var(--text-muted); font-size: 0.8rem;">Visibility</div>
              <div style="font-weight: 600;">${Number(forecast.visibility_m).toFixed(0)} m</div>
            </div>
            <div style="background: #f8fafc; padding: 0.75rem; border-radius: var(--radius-sm);">
              <div style="color: var(--text-muted); font-size: 0.8rem;">Source</div>
              <div style="font-weight: 600;">${esc(r.source)}</div>
            </div>
          </div>
          <p style="font-size: 0.8rem; color: var(--text-muted);">Scanned by: ${esc(session.full_name)} &middot; ${new Date().toLocaleString()}</p>
        `;

          scanJustPerformed = true;
          riskScanDialog.open();
        } catch (err) {
          ui.showToast(err.message || 'Risk scan failed. Please try again.', 'error');
        } finally {
          btn.disabled = false;
        }
      }));

      // Render recent scans
      const recentBody = document.getElementById('recentScansBody');
      const recentScans = [...scans].sort((a, b) => new Date(b.scanned_at) - new Date(a.scanned_at)).slice(0, 10);
      if (recentScans.length === 0) {
        recentBody.innerHTML = '<tr><td colspan="5" class="table-message">No risk scans recorded yet.</td></tr>';
      } else {
        recentBody.innerHTML = recentScans.map(scan => {
          const trip = trips.find(t => t.id === scan.trip_id) || {};
          const boat = boats.find(b => b.id === scan.boat_id) || { name: 'Unknown' };
          const route = routes.find(r => r.id === trip.route_id) || {};
          const origin = terminals.find(t => t.id === route.origin_terminal_id)?.name || 'Origin';
          const dest = terminals.find(t => t.id === route.destination_terminal_id)?.name || 'Destination';
          let badgeColor = 'var(--success)';
          if (scan.classification === 'Caution') badgeColor = 'var(--warning)';
          else if (scan.classification === 'Not Advisable') badgeColor = 'var(--danger)';

          return `
            <tr>
              <td>${new Date(scan.scanned_at).toLocaleString([], { dateStyle: 'short', timeStyle: 'short' })}</td>
              <td><strong>${esc(boat.name)}</strong></td>
              <td>${esc(origin)} &rarr; ${esc(dest)}</td>
              <td><span class="badge" style="background: ${badgeColor}; color: white; padding: 0.3rem 0.75rem; font-size: 0.8rem;">${esc(scan.classification)}</span></td>
              <td>${esc(scan.scanned_by || '-')}</td>
            </tr>
          `;
        }).join('');
      }
    }

    loadRiskData();
    ui.setupSync(loadRiskData);
  </script>
</body>
</html>
