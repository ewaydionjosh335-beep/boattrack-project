<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Trip Schedule - BoatTrack Port Manager</title>
  <link rel="stylesheet" href="/css/tokens.css">
  <link rel="stylesheet" href="/css/base.css">
  <link rel="stylesheet" href="/css/components.css">
  <link rel="stylesheet" href="/css/layout.css">
</head>
<body class="admin-layout">

  <aside class="admin-sidebar">
    <div class="sidebar-header">
      <span style="display: flex; align-items: center; gap: 0.5rem;">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M2 21c.6.5 1.2 1 2.5 1 2.5 0 2.5-2 5-2 1.3 0 1.9.5 2.5 1 .6.5 1.2 1 2.5 1 2.5 0 2.5-2 5-2 1.3 0 1.9.5 2.5 1"/><path d="M19.38 20A11.6 11.6 0 0 0 21 14l-9-4-9 4c0 2.3.6 4.5 1.62 6"/><path d="M12 10V4l3 2-3 2"/></svg>
        Port Manager
      </span>
    </div>
    <div class="sidebar-menu">
      <a href="/manager/dashboard.html"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M3 9h18"/><path d="M9 21V9"/></svg> Dashboard</a>
      <a href="/manager/trip-schedule.html" class="active"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="1 6 1 22 8 18 16 22 23 18 23 2 16 6 8 2 1 6"/><line x1="8" y1="2" x2="8" y2="18"/><line x1="16" y1="6" x2="16" y2="22"/></svg> Trip Schedule</a>
      <a href="/manager/monitoring.html"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M2 21c.6.5 1.2 1 2.5 1 2.5 0 2.5-2 5-2 1.3 0 1.9.5 2.5 1 .6.5 1.2 1 2.5 1 2.5 0 2.5-2 5-2 1.3 0 1.9.5 2.5 1"/><path d="M19.38 20A11.6 11.6 0 0 0 21 14l-9-4-9 4c0 2.3.6 4.5 1.62 6"/><path d="M12 10V4l3 2-3 2"/></svg> Boat & Trip Monitoring</a>
      <a href="/manager/risk-assessment.html"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg> Risk Assessment</a>
      <a href="/manager/payments.html"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="5" width="20" height="14" rx="2"/><line x1="2" y1="10" x2="22" y2="10"/></svg> Payment Records</a>
      <a href="/manager/departure-approval.html"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg> Departure Approval</a>
      <a href="/manager/sos-alerts.html"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="7.86 2 16.14 2 22 7.86 22 16.14 16.14 22 7.86 22 2 16.14 2 7.86 7.86 7.86"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg> SOS Alerts</a>
      <a href="/manager/weather.html"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 10h-1.26A8 8 0 1 0 9 20h9a5 5 0 0 0 0-10z"/></svg> Weather</a>
      <a href="/manager/profile.html"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg> Profile</a>
      <a href="#" id="logoutBtn" style="color: var(--danger);"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg> Logout</a>
    </div>
  </aside>

  <div class="admin-main">
    <header class="admin-header">
      <h2>Trip Schedule Management</h2>
      <div style="display: flex; gap: 0.75rem;">
        <button id="clusterViewToggleBtn" class="btn btn-outline">Cluster View: Off</button>
        <button id="openCreateModalBtn" class="btn btn-primary">Create New Trip</button>
      </div>
    </header>

    <div class="admin-content">
      <div class="card" style="margin-bottom: 1.5rem;">
        <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 1rem;">
          <div>
            <label class="form-label" style="font-size: 0.8rem;">Date Filter</label>
            <input type="date" id="filterDate" class="form-control">
          </div>
          <div>
            <label class="form-label" style="font-size: 0.8rem;">Route Filter</label>
            <select id="filterRoute" class="form-control">
              <option value="">All Routes</option>
            </select>
          </div>
          <div>
            <label class="form-label" style="font-size: 0.8rem;">Boat Filter</label>
            <select id="filterBoat" class="form-control">
              <option value="">All Boats</option>
            </select>
          </div>
          <div>
            <label class="form-label" style="font-size: 0.8rem;">Cluster Filter</label>
            <select id="filterCluster" class="form-control">
              <option value="">All Clusters</option>
            </select>
          </div>
          <div>
            <label class="form-label" style="font-size: 0.8rem;">Status Filter</label>
            <select id="filterStatus" class="form-control">
              <option value="">All Statuses</option>
              <option value="Scheduled">Scheduled</option>
              <option value="Held">Held</option>
              <option value="Departed">Departed</option>
              <option value="Arrived">Arrived</option>
            </select>
          </div>
        </div>
      </div>

      <div id="scheduleContainer">
        <!-- Rendered dynamically -->
      </div>
    </div>
  </div>

  <!-- CREATE / EDIT TRIP MODAL -->
  <div id="tripModal" class="modal-backdrop" style="display: none;">
    <div class="modal">
      <div class="modal-header">
        <h3 id="modalTitle">Create Trip</h3>
        <button class="btn btn-outline btn-sm" id="closeModalBtn">&times;</button>
      </div>
      <form id="tripForm">
        <div class="modal-body">
          <input type="hidden" id="editTripId">
          <div class="form-group">
            <label class="form-label">Route</label>
            <select id="modalRoute" class="form-control" required></select>
          </div>
          <div class="form-group">
            <label class="form-label">Boat (Verified & Active)</label>
            <select id="modalBoat" class="form-control" required></select>
            <div id="boatWarning" class="error-text" style="color: var(--warning);"></div>
          </div>
          <div class="form-group">
            <label class="form-label">Departure Date & Time</label>
            <input type="datetime-local" id="modalDeparture" class="form-control" required>
          </div>
          <div class="form-group">
            <label class="form-label">Required Passengers (≥1)</label>
            <input type="number" id="modalRequiredPax" class="form-control" min="1" value="15" required>
            <div id="paxCapacityWarning" class="error-text" style="color: var(--warning);"></div>
          </div>
          <div id="modalError" class="error-text"></div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-outline" id="cancelModalBtn">Cancel</button>
          <button type="submit" class="btn btn-primary">Save Trip</button>
        </div>
      </form>
    </div>
  </div>

  <!-- HOLD REASON MODAL -->
  <div id="holdModal" class="modal-backdrop" style="display: none;">
    <div class="modal">
      <div class="modal-header">
        <h3>Hold Trip</h3>
        <button class="btn btn-outline btn-sm" id="closeHoldModalBtn">&times;</button>
      </div>
      <form id="holdForm">
        <div class="modal-body">
          <input type="hidden" id="holdTripId">
          <div class="form-group">
            <label class="form-label">Reason for Holding Trip</label>
            <textarea id="holdReasonInput" class="form-control" rows="3" required placeholder="Enter detailed reason (e.g., weather conditions, safety inspection)..."></textarea>
          </div>
          <div id="holdModalError" class="error-text"></div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-outline" id="cancelHoldModalBtn">Cancel</button>
          <button type="submit" class="btn btn-danger">Confirm Hold</button>
        </div>
      </form>
    </div>
  </div>

  <script type="module">
    import { api } from '/js/api.js';
    import { auth } from '/js/auth.js';
    import { ui } from '/js/ui.js';

    const session = await auth.requireAuth(['port_manager']);
    if (!session) throw new Error('Unauthorized');

    let allTrips = [];
    let allBoats = [];
    let allRoutes = [];
    let allTerminals = [];
    let allUsers = [];
    let allManifests = [];
    let isClusterView = false;

    async function loadData() {
      allTrips = await api.trips.list();
      allBoats = await api.boats.list();
      allRoutes = await api.routes.list();
      allTerminals = await api.terminals.list();
      allUsers = await api.users.list();
      allManifests = await api.manifests.list();

      populateFilterDropdowns();
      renderSchedule();
    }

    function populateFilterDropdowns() {
      const modalRouteVal = document.getElementById('modalRoute').value;
      const modalBoatVal = document.getElementById('modalBoat').value;

      // Routes filter
      const routeSelect = document.getElementById('filterRoute');
      const currentFilterRoute = routeSelect.value;
      routeSelect.innerHTML = '<option value="">All Routes</option>' + allRoutes.map(r => {
        const origin = allTerminals.find(t => t.id === r.origin_terminal_id)?.name || 'Origin';
        const dest = allTerminals.find(t => t.id === r.destination_terminal_id)?.name || 'Dest';
        return `<option value="${r.id}">${origin} → ${dest}</option>`;
      }).join('');
      if (currentFilterRoute) routeSelect.value = currentFilterRoute;

      // Boats filter
      const boatSelect = document.getElementById('filterBoat');
      const currentFilterBoat = boatSelect.value;
      boatSelect.innerHTML = '<option value="">All Boats</option>' + allBoats.map(b => `<option value="${b.id}">${b.name}</option>`).join('');
      if (currentFilterBoat) boatSelect.value = currentFilterBoat;

      // Clusters filter
      const clusters = [...new Set(allUsers.filter(u => u.cluster).map(u => u.cluster))];
      const clusterSelect = document.getElementById('filterCluster');
      const currentFilterCluster = clusterSelect.value;
      clusterSelect.innerHTML = '<option value="">All Clusters</option>' + clusters.map(c => `<option value="${c}">${c}</option>`).join('');
      if (currentFilterCluster) clusterSelect.value = currentFilterCluster;

      // Modal route & boat dropdowns
      document.getElementById('modalRoute').innerHTML = '<option value="">-- Select Route --</option>' + allRoutes.map(r => {
        const origin = allTerminals.find(t => t.id === r.origin_terminal_id)?.name || 'Origin';
        const dest = allTerminals.find(t => t.id === r.destination_terminal_id)?.name || 'Dest';
        return `<option value="${r.id}">${origin} → ${dest} (₱${r.fare})</option>`;
      }).join('');
      if (modalRouteVal) document.getElementById('modalRoute').value = modalRouteVal;

      const verifiedActiveBoats = allBoats.filter(b => b.registration_status === 'Verified' && b.boat_status === 'Active');
      document.getElementById('modalBoat').innerHTML = '<option value="">-- Select Boat --</option>' + verifiedActiveBoats.map(b => {
        const oper = allUsers.find(u => u.id === b.operator_id) || {};
        const cl = oper.cluster ? ` [${oper.cluster}]` : '';
        return `<option value="${b.id}">${b.name} (${b.boat_type}, Cap: ${b.passenger_capacity}, Max: ${b.max_load_kg}kg)${cl}</option>`;
      }).join('');
      if (modalBoatVal) document.getElementById('modalBoat').value = modalBoatVal;
    }

    function renderSchedule() {
      const dateVal = document.getElementById('filterDate').value;
      const routeVal = document.getElementById('filterRoute').value;
      const boatVal = document.getElementById('filterBoat').value;
      const clusterVal = document.getElementById('filterCluster').value;
      const statusVal = document.getElementById('filterStatus').value;

      const filtered = allTrips.filter(t => {
        if (dateVal && !t.departure_time.startsWith(dateVal)) return false;
        if (routeVal && t.route_id !== routeVal) return false;
        if (boatVal && t.boat_id !== boatVal) return false;
        if (statusVal && t.trip_status !== statusVal) return false;

        if (clusterVal) {
          const boat = allBoats.find(b => b.id === t.boat_id);
          const oper = boat ? allUsers.find(u => u.id === boat.operator_id) : null;
          if (!oper || oper.cluster !== clusterVal) return false;
        }
        return true;
      });

      const container = document.getElementById('scheduleContainer');

      if (filtered.length === 0) {
        container.innerHTML = '<div class="card" style="text-align: center; padding: 3rem; color: var(--text-muted);">No trips found matching the selected filters.</div>';
        return;
      }

      if (isClusterView) {
        // Group by Cluster
        const clusterMap = {};
        filtered.forEach(t => {
          const boat = allBoats.find(b => b.id === t.boat_id) || {};
          const oper = boat.operator_id ? allUsers.find(u => u.id === boat.operator_id) : null;
          const clName = oper && oper.cluster ? oper.cluster : 'Unassigned Cluster';
          if (!clusterMap[clName]) clusterMap[clName] = [];
          clusterMap[clName].push(t);
        });

        container.innerHTML = Object.keys(clusterMap).map(cluster => `
          <div class="card" style="margin-bottom: 1.5rem;">
            <h3 style="margin-bottom: 1rem; color: var(--teal); border-bottom: 2px solid var(--border); padding-bottom: 0.5rem;">Cluster: ${cluster}</h3>
            ${renderTripTableHtml(clusterMap[cluster])}
          </div>
        `).join('');
      } else {
        container.innerHTML = `
          <div class="table-container">
            ${renderTripTableHtml(filtered)}
          </div>
        `;
      }
    }

    function renderTripTableHtml(tripsList) {
      return `
        <table>
          <thead>
            <tr>
              <th>Boat & Operator</th>
              <th>Route</th>
              <th>Departure Time</th>
              <th>Pax (Booked / Req)</th>
              <th>Status / Reason</th>
              <th>Actions</th>
            </tr>
          </thead>
          <tbody>
            ${tripsList.map(t => {
              const boat = allBoats.find(b => b.id === t.boat_id) || { name: 'Unknown Boat' };
              const oper = boat.operator_id ? allUsers.find(u => u.id === boat.operator_id) : null;
              const route = allRoutes.find(r => r.id === t.route_id) || {};
              const origin = allTerminals.find(term => term.id === route.origin_terminal_id)?.name || 'Origin';
              const dest = allTerminals.find(term => term.id === route.destination_terminal_id)?.name || 'Destination';
              const timeStr = new Date(t.departure_time).toLocaleString([], { dateStyle: 'short', timeStyle: 'short' });
              const mCount = allManifests.filter(m => m.trip_id === t.id).length;

              let badgeClass = 'badge-scheduled';
              if (t.trip_status === 'Held') badgeClass = 'badge-held';
              else if (t.trip_status === 'Departed') badgeClass = 'badge-departed';
              else if (t.trip_status === 'Arrived') badgeClass = 'badge-arrived';

               const canEditOrHold = t.trip_status === 'Scheduled' || t.trip_status === 'Held';
               const canMarkDeparted = t.trip_status === 'Scheduled' || t.trip_status === 'Held';
               const canMarkArrived = t.trip_status === 'Departed';
               const canDelete = mCount === 0;

               return `
                 <tr>
                   <td>
                     <strong>${boat.name}</strong><br>
                     <span style="font-size: 0.8rem; color: var(--text-muted);">${oper ? oper.full_name + (oper.cluster ? ' (' + oper.cluster + ')' : '') : 'No Operator'}</span>
                   </td>
                   <td>${origin} → ${dest}</td>
                   <td>${timeStr}</td>
                   <td>${mCount} / ${t.required_passengers}</td>
                   <td>
                     <span class="badge ${badgeClass}">${t.trip_status}</span>
                     ${t.trip_status === 'Held' && t.held_reason ? `<br><span style="font-size: 0.75rem; color: var(--danger);">Reason: ${t.held_reason}</span>` : ''}
                   </td>
                   <td>
                     <div class="table-actions">
                       ${canEditOrHold ? `<button class="btn btn-outline btn-sm" onclick="window.editTrip('${t.id}')">Edit</button>` : ''}
                       ${t.trip_status === 'Scheduled' ? `<button class="btn btn-outline btn-sm" style="color:var(--warning); border-color:var(--warning);" onclick="window.openHoldModal('${t.id}')">Hold</button>` : ''}
                       ${t.trip_status === 'Held' ? `<button class="btn btn-outline btn-sm" style="color:var(--success); border-color:var(--success);" onclick="window.releaseTrip('${t.id}')">Release</button>` : ''}
                       ${canMarkDeparted ? `<button class="btn btn-outline btn-sm" style="color:var(--primary); border-color:var(--primary);" onclick="window.markDeparted('${t.id}')">Mark Departed</button>` : ''}
                       ${canMarkArrived ? `<button class="btn btn-outline btn-sm" style="color:var(--success); border-color:var(--success);" onclick="window.markArrived('${t.id}')">Mark Arrived</button>` : ''}
                       ${canDelete ? `<button class="btn btn-danger btn-sm" onclick="window.deleteTrip('${t.id}')">Delete</button>` : `<span style="font-size:0.75rem; color:var(--text-muted);" title="Cannot delete trip with manifest entries">Manifest locked</span>`}
                     </div>
                   </td>
                 </tr>
               `;
            }).join('')}
          </tbody>
        </table>
      `;
    }

    // Filter event listeners
    document.getElementById('filterDate').oninput = renderSchedule;
    document.getElementById('filterRoute').onchange = renderSchedule;
    document.getElementById('filterBoat').onchange = renderSchedule;
    document.getElementById('filterCluster').onchange = renderSchedule;
    document.getElementById('filterStatus').onchange = renderSchedule;

    document.getElementById('clusterViewToggleBtn').onclick = () => {
      isClusterView = !isClusterView;
      const btn = document.getElementById('clusterViewToggleBtn');
      btn.textContent = `Cluster View: ${isClusterView ? 'On' : 'Off'}`;
      btn.className = isClusterView ? 'btn btn-primary' : 'btn btn-outline';
      renderSchedule();
    };

    // Create / Edit modal
    const tripModal = document.getElementById('tripModal');
    const closeTripModal = () => tripModal.style.display = 'none';
    document.getElementById('closeModalBtn').onclick = closeTripModal;
    document.getElementById('cancelModalBtn').onclick = closeTripModal;

    document.getElementById('openCreateModalBtn').onclick = () => {
      document.getElementById('modalTitle').textContent = 'Create New Trip';
      document.getElementById('editTripId').value = '';
      document.getElementById('modalRoute').value = '';
      document.getElementById('modalBoat').value = '';
      document.getElementById('modalDeparture').value = '';
      document.getElementById('modalRequiredPax').value = '15';
      document.getElementById('modalError').textContent = '';
      document.getElementById('boatWarning').textContent = '';
      document.getElementById('paxCapacityWarning').textContent = '';
      tripModal.style.display = 'flex';
    };

    document.getElementById('modalBoat').onchange = (e) => {
      const boatId = e.target.value;
      if (!boatId) return;
      const boat = allBoats.find(b => b.id === boatId);
      const reqPax = parseInt(document.getElementById('modalRequiredPax').value) || 0;
      if (boat && reqPax > boat.passenger_capacity) {
        document.getElementById('paxCapacityWarning').textContent = `Warning: Required passengers (${reqPax}) exceeds boat capacity (${boat.passenger_capacity}). Allowed, but check capacity.`;
      } else {
        document.getElementById('paxCapacityWarning').textContent = '';
      }
    };

    document.getElementById('modalRequiredPax').oninput = (e) => {
      const reqPax = parseInt(e.target.value) || 0;
      const boatId = document.getElementById('modalBoat').value;
      const boat = allBoats.find(b => b.id === boatId);
      if (boat && reqPax > boat.passenger_capacity) {
        document.getElementById('paxCapacityWarning').textContent = `Warning: Required passengers (${reqPax}) exceeds boat capacity (${boat.passenger_capacity}).`;
      } else {
        document.getElementById('paxCapacityWarning').textContent = '';
      }
    };

    window.editTrip = (id) => {
      const trip = allTrips.find(t => t.id === id);
      if (!trip) return;
      document.getElementById('modalTitle').textContent = 'Edit Trip';
      document.getElementById('editTripId').value = trip.id;
      document.getElementById('modalRoute').value = trip.route_id;
      document.getElementById('modalBoat').value = trip.boat_id;
      document.getElementById('modalDeparture').value = trip.departure_time.substring(0, 16);
      document.getElementById('modalRequiredPax').value = trip.required_passengers;
      document.getElementById('modalError').textContent = '';
      document.getElementById('boatWarning').textContent = '';

      // Check manifest entries for boat change block
      const mEntries = allManifests.filter(m => m.trip_id === id);
      const boatSelect = document.getElementById('modalBoat');
      if (mEntries.length > 0) {
        boatSelect.disabled = true;
        document.getElementById('boatWarning').textContent = 'Note: Boat change is blocked because manifest entries already exist for this trip.';
      } else {
        boatSelect.disabled = false;
        document.getElementById('boatWarning').textContent = '';
      }

      tripModal.style.display = 'flex';
    };

    document.getElementById('tripForm').onsubmit = async (e) => {
      e.preventDefault();
      const id = document.getElementById('editTripId').value;
      const route_id = document.getElementById('modalRoute').value;
      const boat_id = document.getElementById('modalBoat').value;
      const departure_time = document.getElementById('modalDeparture').value;
      const required_passengers = parseInt(document.getElementById('modalRequiredPax').value);
      const errBox = document.getElementById('modalError');
      errBox.textContent = '';

      try {
        if (id) {
          const updateData = { route_id, departure_time, required_passengers };
          const mEntries = allManifests.filter(m => m.trip_id === id);
          if (mEntries.length === 0) {
            updateData.boat_id = boat_id;
          }
          await api.trips.update(id, updateData);
          ui.showToast('Trip updated successfully.', 'success');
        } else {
          await api.trips.create({
            boat_id,
            route_id,
            departure_time,
            required_passengers,
            created_by: session.user_id
          });
          ui.showToast('Trip created successfully.', 'success');
        }
        closeTripModal();
        await loadData();
      } catch (err) {
        errBox.textContent = err.message;
      }
    };

    // Hold modal
    const holdModal = document.getElementById('holdModal');
    const closeHoldModal = () => holdModal.style.display = 'none';
    document.getElementById('closeHoldModalBtn').onclick = closeHoldModal;
    document.getElementById('cancelHoldModalBtn').onclick = closeHoldModal;

    window.openHoldModal = (id) => {
      document.getElementById('holdTripId').value = id;
      document.getElementById('holdReasonInput').value = '';
      document.getElementById('holdModalError').textContent = '';
      holdModal.style.display = 'flex';
    };

    document.getElementById('holdForm').onsubmit = async (e) => {
      e.preventDefault();
      const id = document.getElementById('holdTripId').value;
      const reason = document.getElementById('holdReasonInput').value.trim();
      const errBox = document.getElementById('holdModalError');
      errBox.textContent = '';

      try {
        if (!reason) throw new Error('A reason is required to hold a trip.');
        await api.trips.updateStatus(id, 'Held', reason);
        ui.showToast('Trip placed on hold.', 'success');
        closeHoldModal();
        await loadData();
      } catch (err) {
        errBox.textContent = err.message;
      }
    };

    window.releaseTrip = async (id) => {
      ui.confirm('Are you sure you want to release this trip back to Scheduled status?', async () => {
        try {
          await api.trips.updateStatus(id, 'Scheduled', null);
          ui.showToast('Trip released successfully.', 'success');
          await loadData();
        } catch (err) {
          ui.showToast(err.message, 'danger');
        }
      });
    };

    window.markDeparted = async (id) => {
      ui.confirm('Are you sure you want to mark this trip as Departed?', async () => {
        try {
          await api.trips.updateStatus(id, 'Departed');
          ui.showToast('Trip marked as Departed.', 'success');
          await loadData();
        } catch (err) {
          ui.showToast(err.message, 'danger');
        }
      });
    };

    window.markArrived = async (id) => {
      ui.confirm('Are you sure you want to mark this trip as Arrived?', async () => {
        try {
          await api.trips.updateStatus(id, 'Arrived');
          ui.showToast('Trip marked as Arrived.', 'success');
          await loadData();
        } catch (err) {
          ui.showToast(err.message, 'danger');
        }
      });
    };

    window.deleteTrip = async (id) => {
      const mEntries = allManifests.filter(m => m.trip_id === id);
      if (mEntries.length > 0) {
        ui.showToast('Cannot delete trip: manifest entries already exist.', 'danger');
        return;
      }
      ui.confirm('Are you sure you want to delete this trip?', async () => {
        let trips = api._get('trips') || [];
        trips = trips.filter(t => t.id !== id);
        api._set('trips', trips);
        ui.showToast('Trip deleted successfully.', 'success');
        await loadData();
      });
    };

    loadData();
    ui.setupSync(loadData);

    document.getElementById('logoutBtn').onclick = async (e) => {
      e.preventDefault();
      await api.auth.logout();
      window.location.href = '/login.html';
    };
  </script>
</body>
</html>
