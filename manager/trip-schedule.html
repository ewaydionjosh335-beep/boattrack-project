<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Trip Schedule - BoatTrack Port Manager</title>
  <link rel="stylesheet" href="/css/tokens.css">
  <link rel="stylesheet" href="/css/base.css">
  <link rel="stylesheet" href="/css/components.css">
  <link rel="stylesheet" href="/css/layout.css">
</head>
<body class="admin-layout">

  <div id="sidebarContainer"></div>

  <div class="admin-main">
    <header class="admin-header">
      <h2>Trip Schedule Management</h2>
      <div class="page-header-actions">
        <button id="clusterViewToggleBtn" class="btn btn-outline">Cluster View: Off</button>
        <button id="openCreateModalBtn" class="btn btn-primary">Create New Trip</button>
      </div>
    </header>

    <div class="admin-content">
      <div class="card filter-card">
        <div class="filter-row">
          <div class="form-group compact">
            <label class="form-label" for="filterDate">Date Filter</label>
            <input type="date" id="filterDate" class="form-control">
          </div>
          <div class="form-group compact">
            <label class="form-label" for="filterRoute">Route Filter</label>
            <select id="filterRoute" class="form-control">
              <option value="">All Routes</option>
            </select>
          </div>
          <div class="form-group compact">
            <label class="form-label" for="filterBoat">Boat Filter</label>
            <select id="filterBoat" class="form-control">
              <option value="">All Boats</option>
            </select>
          </div>
          <div class="form-group compact">
            <label class="form-label" for="filterCluster">Cluster Filter</label>
            <select id="filterCluster" class="form-control">
              <option value="">All Clusters</option>
            </select>
          </div>
          <div class="form-group compact">
            <label class="form-label" for="filterStatus">Status Filter</label>
            <select id="filterStatus" class="form-control">
              <option value="">All Statuses</option>
              <option value="Scheduled">Scheduled</option>
              <option value="Held">Held</option>
              <option value="Departed">Departed</option>
              <option value="Arrived">Arrived</option>
            </select>
          </div>
        </div>
      </div>

      <div id="scheduleContainer">
        <!-- Rendered dynamically -->
      </div>
      <div id="paginationContainer"></div>
    </div>
  </div>

  <!-- CREATE / EDIT TRIP MODAL -->
  <div id="tripModal" class="modal-backdrop">
    <div class="modal">
      <div class="modal-header">
        <h3 id="modalTitle">Create Trip</h3>
        <button type="button" class="modal-close" id="closeModalBtn" aria-label="Close">&times;</button>
      </div>
      <form id="tripForm">
        <div class="modal-body">
          <input type="hidden" id="editTripId">
          <div class="form-group">
            <label class="form-label">Route</label>
            <select id="modalRoute" class="form-control" required></select>
          </div>
          <div class="form-group">
            <label class="form-label">Boat (Verified & Active)</label>
            <select id="modalBoat" class="form-control" required></select>
            <div id="boatWarning" class="form-warning"></div>
          </div>
          <div class="form-group">
            <label class="form-label">Departure Date & Time</label>
            <input type="datetime-local" id="modalDeparture" class="form-control" required>
          </div>
          <div class="form-group">
            <label class="form-label">Required Passengers (&ge;1)</label>
            <input type="number" id="modalRequiredPax" class="form-control" min="1" value="15" required>
            <div id="paxCapacityWarning" class="form-warning"></div>
          </div>
          <div id="modalError" class="error-text"></div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-outline" id="cancelModalBtn">Cancel</button>
          <button type="submit" class="btn btn-primary">Save Trip</button>
        </div>
      </form>
    </div>
  </div>

  <!-- HOLD REASON MODAL -->
  <div id="holdModal" class="modal-backdrop">
    <div class="modal">
      <div class="modal-header">
        <h3>Hold Trip</h3>
        <button type="button" class="modal-close" id="closeHoldModalBtn" aria-label="Close">&times;</button>
      </div>
      <form id="holdForm">
        <div class="modal-body">
          <input type="hidden" id="holdTripId">
          <div class="form-group">
            <label class="form-label">Reason for Holding Trip</label>
            <textarea id="holdReasonInput" class="form-control" rows="3" required placeholder="Enter detailed reason (e.g., weather conditions, safety inspection)..."></textarea>
          </div>
          <div id="holdModalError" class="error-text"></div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-outline" id="cancelHoldModalBtn">Cancel</button>
          <button type="submit" class="btn btn-danger">Confirm Hold</button>
        </div>
      </form>
    </div>
  </div>

  <script type="module">
    import { api } from '/js/api.js';
    import { auth } from '/js/auth.js';
    import { ui } from '/js/ui.js';
    import { ManagerSidebar } from '/manager/_sidebar.js';
    import { paginate, updatePagination, initPagination } from '/admin/common.js';
    import { loadService } from '/js/services/loadService.js';

    const session = await auth.requireAuth(['port_manager']);
    if (!session) throw new Error('Unauthorized');

    await ManagerSidebar.mount({ activePage: 'trip-schedule' });

    const esc = ui.escapeHtml;

    let allTrips = [];
    let allBoats = [];
    let allRoutes = [];
    let allTerminals = [];
    let allUsers = [];
    let allManifests = [];
    let allBookings = [];
    let allApprovals = [];
    let isClusterView = false;
    let currentPage = 1;
    const pageSize = 25;
    let boatParamApplied = false;

    async function loadData() {
      allTrips = await api.trips.list();
      allBoats = await api.boats.list();
      allRoutes = await api.routes.list();
      allTerminals = await api.terminals.list();
      allUsers = await api.users.list();
      allManifests = await api.manifests.list();
      allBookings = await api.bookings.list();
      allApprovals = await api.departureApprovals.list();

      populateFilterDropdowns();

      // Deep link from the dashboard: /manager/trip-schedule.html?boat=<id>.
      // Apply once so the 5s sync refresh does not stomp a manual filter change.
      // The date filter is cleared so held trips from earlier days stay visible
      // instead of landing on an empty "today" list.
      if (!boatParamApplied) {
        const boatParam = new URLSearchParams(window.location.search).get('boat');
        if (boatParam && allBoats.some(b => b.id === boatParam)) {
          document.getElementById('filterBoat').value = boatParam;
          document.getElementById('filterDate').value = '';
        }
        boatParamApplied = true;
      }

      renderSchedule();
    }

    function populateFilterDropdowns(editingTripBoatId = null) {
      const modalRouteVal = document.getElementById('modalRoute').value;
      const modalBoatVal = document.getElementById('modalBoat').value;

      // Routes filter
      const routeSelect = document.getElementById('filterRoute');
      const currentFilterRoute = routeSelect.value;
      routeSelect.innerHTML = '<option value="">All Routes</option>' + allRoutes.map(r => {
        const origin = allTerminals.find(t => t.id === r.origin_terminal_id)?.name || 'Origin';
        const dest = allTerminals.find(t => t.id === r.destination_terminal_id)?.name || 'Dest';
        return `<option value="${esc(r.id)}">${esc(origin)} &rarr; ${esc(dest)}</option>`;
      }).join('');
      if (currentFilterRoute) routeSelect.value = currentFilterRoute;

      // Boats filter
      const boatSelect = document.getElementById('filterBoat');
      const currentFilterBoat = boatSelect.value;
      boatSelect.innerHTML = '<option value="">All Boats</option>' + allBoats.map(b => `<option value="${esc(b.id)}">${esc(b.name)}</option>`).join('');
      if (currentFilterBoat) boatSelect.value = currentFilterBoat;

      // Clusters filter - only clusters from operators of verified boats, plus "Unassigned Cluster"
      const verifiedBoatOperatorIds = allBoats
        .filter(b => b.registration_status === 'Verified')
        .map(b => b.operator_id)
        .filter(Boolean);
      const clusters = [...new Set(
        allUsers
          .filter(u => verifiedBoatOperatorIds.includes(u.id) && u.cluster)
          .map(u => u.cluster)
      )];
      const clusterSelect = document.getElementById('filterCluster');
      const currentFilterCluster = clusterSelect.value;
      clusterSelect.innerHTML = '<option value="">All Clusters</option>' + clusters.map(c => `<option value="${esc(c)}">${esc(c)}</option>`).join('') + '<option value="__unassigned__">Unassigned Cluster</option>';
      if (currentFilterCluster) clusterSelect.value = currentFilterCluster;

      // Modal route & boat dropdowns
      document.getElementById('modalRoute').innerHTML = '<option value="">-- Select Route --</option>' + allRoutes.map(r => {
        const origin = allTerminals.find(t => t.id === r.origin_terminal_id)?.name || 'Origin';
        const dest = allTerminals.find(t => t.id === r.destination_terminal_id)?.name || 'Dest';
        return `<option value="${esc(r.id)}">${esc(origin)} &rarr; ${esc(dest)} (&#8369;${esc(r.fare)})</option>`;
      }).join('');
      if (modalRouteVal) document.getElementById('modalRoute').value = modalRouteVal;

      // Include the editing trip's boat even if suspended, so the dropdown value stays valid
      const verifiedActiveBoats = allBoats.filter(b => b.registration_status === 'Verified' && b.boat_status === 'Active');
      let modalBoatOptions = verifiedActiveBoats.map(b => {
        const oper = allUsers.find(u => u.id === b.operator_id) || {};
        const cl = oper.cluster ? ` [${oper.cluster}]` : '';
        return `<option value="${esc(b.id)}">${esc(b.name)} (${esc(b.boat_type)}, Cap: ${b.passenger_capacity}, Max: ${b.max_load_kg}kg)${esc(cl)}</option>`;
      }).join('');
      if (editingTripBoatId) {
        const editingBoat = allBoats.find(b => b.id === editingTripBoatId);
        if (editingBoat && !verifiedActiveBoats.some(b => b.id === editingTripBoatId)) {
          const oper = allUsers.find(u => u.id === editingBoat.operator_id) || {};
          const cl = oper.cluster ? ` [${oper.cluster}]` : '';
          modalBoatOptions = `<option value="${esc(editingBoat.id)}">${esc(editingBoat.name)} (${esc(editingBoat.boat_type)}, Cap: ${editingBoat.passenger_capacity}, Max: ${editingBoat.max_load_kg}kg)${esc(cl)}</option>` + modalBoatOptions;
        }
      }
      document.getElementById('modalBoat').innerHTML = '<option value="">-- Select Boat --</option>' + modalBoatOptions;
      if (modalBoatVal) document.getElementById('modalBoat').value = modalBoatVal;
    }

    function renderSchedule() {
      const dateVal = document.getElementById('filterDate').value;
      const routeVal = document.getElementById('filterRoute').value;
      const boatVal = document.getElementById('filterBoat').value;
      const clusterVal = document.getElementById('filterCluster').value;
      const statusVal = document.getElementById('filterStatus').value;

      const filtered = allTrips.filter(t => {
        if (dateVal && (!t.departure_time || ui.localDateStr(t.departure_time) !== dateVal)) return false;
        if (routeVal && t.route_id !== routeVal) return false;
        if (boatVal && t.boat_id !== boatVal) return false;
        if (statusVal && t.trip_status !== statusVal) return false;

        if (clusterVal) {
          const boat = allBoats.find(b => b.id === t.boat_id);
          const oper = boat ? allUsers.find(u => u.id === boat.operator_id) : null;
          const tripCluster = oper?.cluster;
          if (clusterVal === '__unassigned__') {
            if (tripCluster) return false; // Has a cluster, but we want unassigned
          } else if (tripCluster !== clusterVal) {
            return false; // Cluster doesn't match
          }
        }
        return true;
      });

      const container = document.getElementById('scheduleContainer');
      const paginationContainer = document.getElementById('paginationContainer');

      // Apply pagination
      const pagination = paginate(filtered, currentPage, pageSize);
      let pagedTrips = pagination.items;

      if (pagedTrips.length === 0 && currentPage > 1) {
        // Page out of range, go to last page
        currentPage = pagination.totalPages;
        const newPagination = paginate(filtered, currentPage, pageSize);
        Object.assign(pagination, newPagination);
        pagedTrips = pagination.items;
      }

      if (pagedTrips.length === 0) {
        container.innerHTML = '<div class="card table-empty"><svg class="table-empty-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg><p class="table-empty-text">No trips found matching the selected filters.</p><div class="table-empty-action"><button type="button" class="btn btn-outline btn-sm" onclick="window.clearFilters()">Clear Filters</button></div></div>';
        paginationContainer.innerHTML = '';
        return;
      }

      if (isClusterView) {
        // Group by Cluster
        const clusterMap = {};
        pagedTrips.forEach(t => {
          const boat = allBoats.find(b => b.id === t.boat_id) || {};
          const oper = boat.operator_id ? allUsers.find(u => u.id === boat.operator_id) : null;
          const clName = oper && oper.cluster ? oper.cluster : 'Unassigned Cluster';
          if (!clusterMap[clName]) clusterMap[clName] = [];
          clusterMap[clName].push(t);
        });

        container.innerHTML = Object.keys(clusterMap).map(cluster => `
          <div class="card mb-2">
            <h3 class="text-teal mb-1" style="border-bottom: 2px solid var(--border); padding-bottom: 0.5rem;">Cluster: ${esc(cluster)}</h3>
            ${renderTripTableHtml(clusterMap[cluster])}
          </div>
        `).join('');
      } else {
        container.innerHTML = `
          <div class="table-container">
            ${renderTripTableHtml(pagedTrips)}
          </div>
        `;
      }

      // Update pagination controls
      updatePagination("#paginationContainer", pagination);
    }

    function renderTripTableHtml(tripsList) {
      return `
        <table>
          <thead>
            <tr>
              <th>Boat & Operator</th>
              <th>Route</th>
              <th>Departure Time</th>
              <th class="text-center">Pax (Booked / Req)</th>
              <th>Status / Reason</th>
              <th>Actions</th>
            </tr>
          </thead>
          <tbody>
            ${tripsList.map(t => {
              const boat = allBoats.find(b => b.id === t.boat_id) || { name: 'Unknown Boat' };
              const oper = boat.operator_id ? allUsers.find(u => u.id === boat.operator_id) : null;
              const route = allRoutes.find(r => r.id === t.route_id) || {};
              const origin = allTerminals.find(term => term.id === route.origin_terminal_id)?.name || 'Origin';
              const dest = allTerminals.find(term => term.id === route.destination_terminal_id)?.name || 'Destination';
              const timeStr = new Date(t.departure_time).toLocaleString([], { dateStyle: 'short', timeStyle: 'short' });
              const mCount = allManifests.filter(m => m.trip_id === t.id).length;
              const bookedPax = loadService.bookedPax(allManifests, allBookings, t.id);

              let badgeClass = 'badge-scheduled';
              if (t.trip_status === 'Held') badgeClass = 'badge-held';
              else if (t.trip_status === 'Departed') badgeClass = 'badge-departed';
              else if (t.trip_status === 'Arrived') badgeClass = 'badge-arrived';

              const canEditOrHold = t.trip_status === 'Scheduled' || t.trip_status === 'Held';
              // Departure needs a coast guard approval for the current schedule revision.
              const latestApproval = allApprovals
                .filter(a => a.trip_id === t.id)
                .sort((a, b) => new Date(b.recorded_at) - new Date(a.recorded_at))[0];
              const approvalCurrent = !!latestApproval && latestApproval.decision === 'Approved'
                && (latestApproval.trip_revision || 0) === (t.approval_revision || 0);
              const approvalExpired = !!latestApproval && latestApproval.decision === 'Approved' && !approvalCurrent;
              // Suspension blocks release and departure until the boat is reactivated.
              const boatSuspended = !!boat.boat_status && boat.boat_status !== 'Active';
              const canMarkDeparted = t.trip_status === 'Scheduled' && approvalCurrent && !boatSuspended;
              const canMarkArrived = t.trip_status === 'Departed';
              // A trip with records must not be deleted: it would orphan bookings and approvals.
              const bCount = allBookings.filter(b => b.trip_id === t.id).length;
              const hasApproval = allApprovals.some(a => a.trip_id === t.id);
              const recordBlock = mCount > 0
                ? `${mCount} manifest entr${mCount === 1 ? 'y' : 'ies'}`
                : bCount > 0
                  ? `${bCount} booking${bCount === 1 ? '' : 's'}`
                  : hasApproval ? 'departure approval record' : '';
              const canDelete = !recordBlock && (t.trip_status === 'Scheduled' || t.trip_status === 'Held');

              // Edit is blocked when manifests/bookings exist (boat/route changes would orphan them),
              // when the boat is suspended, or when the departure time has passed: api.trips.update
              // re-validates the departure time and would always reject, so don't offer an Edit
              // that cannot succeed. Hold / Release / Delete stay available for past trips.
              // An existing approval no longer blocks edits: saving bumps approval_revision and the
              // old clearance shows as "Approval expired". Approval still blocks delete.
              const departurePassed = !!t.departure_time && new Date(t.departure_time).getTime() < Date.now();
              const editBlock = mCount > 0 || bCount > 0 || boatSuspended || departurePassed;
              const editReason = boatSuspended
                ? `Cannot edit: boat is ${boat.boat_status}`
                : departurePassed
                  ? 'Cannot edit: departure time has passed'
                  : mCount > 0
                    ? `Cannot edit: ${mCount} manifest entr${mCount === 1 ? 'y' : 'ies'} exist`
                    : `Cannot edit: ${bCount} booking${bCount === 1 ? '' : 's'} exist`;

              // Departure state lives in the Status column; the Actions column only carries actions.
              const approvalUrl = `/manager/departure-approval.html?trip=${t.id}`;
              const showApprovalLink = !canMarkDeparted && t.trip_status === 'Scheduled' && !boatSuspended;
              const approvalStatus = !showApprovalLink
                ? null
                : approvalExpired
                  ? { label: 'Approval expired', badge: 'badge-danger' }
                  : latestApproval?.decision === 'Held'
                    ? (t.trip_status === 'Held'
                        ? { label: 'Held by Coast Guard', badge: 'badge-danger' }
                        : { label: 'Previously held', badge: 'badge-warning' })
                    : { label: 'Awaiting approval', badge: 'badge-warning' };
              const lockNote = canDelete ? '' : recordBlock ? `Blocked: ${recordBlock}` : 'Locked';

              return `
                <tr>
                  <td>
                    <strong>${esc(boat.name)}</strong><br>
                    <span class="text-sm text-muted">${esc(oper ? oper.full_name + (oper.cluster ? ' (' + oper.cluster + ')' : '') : 'No Operator')}</span>
                  </td>
                  <td>${esc(origin)} &rarr; ${esc(dest)}</td>
                  <td>${timeStr}</td>
                  <td class="text-center">${bookedPax} / ${t.required_passengers}</td>
                  <td>
                    <span class="badge ${badgeClass}">${esc(t.trip_status)}</span>
                    ${approvalStatus ? `<br><span class="badge ${approvalStatus.badge}" style="margin-top: 0.35rem;">${esc(approvalStatus.label)}</span>` : ''}
                    ${t.trip_status === 'Held' && t.held_reason ? `<br><span class="text-xs text-danger">Reason: ${esc(t.held_reason)}</span>` : ''}
                    ${boatSuspended ? `<br><span class="text-xs text-danger">Boat ${esc(boat.boat_status)} — release and departure blocked</span>` : ''}
                    ${lockNote ? `<br><span class="text-xs text-muted" title="Editing and deleting are disabled while this trip has records">${esc(lockNote)}</span>` : ''}
                  </td>
                  <td>
                    <div class="table-actions">
                      ${canEditOrHold
                        ? `<span class="text-xs">${!editBlock ? `<button class="btn btn-outline btn-sm" onclick="window.editTrip('${t.id}')">Edit</button>` : `<span class="badge badge-warning" title="${esc(editReason)}">Edit blocked</span>`}</span>
                           ${t.trip_status === 'Scheduled' ? `<button class="btn btn-outline-warning btn-sm" onclick="window.openHoldModal('${t.id}')">Hold</button>` : ''}
                           ${t.trip_status === 'Held' && !boatSuspended ? `<button class="btn btn-outline-success btn-sm" onclick="window.releaseTrip('${t.id}')">Release</button>` : ''}`
                        : ''}
                      ${canMarkDeparted
                        ? `<button class="btn btn-outline-primary btn-sm" onclick="window.markDeparted('${t.id}')">Mark Departed</button>`
                        : showApprovalLink
                          ? `<a href="${approvalUrl}" class="btn btn-outline-primary btn-sm" title="Open departure approval">View Approval</a>`
                          : ''}
                      ${canMarkArrived ? `<button class="btn btn-outline-success btn-sm" onclick="window.markArrived('${t.id}')">Mark Arrived</button>` : ''}
                      ${canDelete
                        ? `<button class="btn btn-danger btn-sm" onclick="window.deleteTrip('${t.id}')">Delete</button>`
                        : ''}
                    </div>
                  </td>
                </tr>
              `;
            }).join('')}
          </tbody>
        </table>
      `;
    }

    // Filter event listeners
    window.clearFilters = () => {
      ['filterDate', 'filterRoute', 'filterBoat', 'filterCluster', 'filterStatus']
        .forEach(id => { document.getElementById(id).value = ''; });
      currentPage = 1;
      isClusterView = false;
      const btn = document.getElementById('clusterViewToggleBtn');
      if (btn) {
        btn.textContent = 'Cluster View: Off';
        btn.className = 'btn btn-outline';
      }
      renderSchedule();
    };

    document.getElementById('filterDate').oninput = () => { currentPage = 1; renderSchedule(); };
    document.getElementById('filterRoute').onchange = () => { currentPage = 1; renderSchedule(); };
    document.getElementById('filterBoat').onchange = () => { currentPage = 1; renderSchedule(); };
    document.getElementById('filterCluster').onchange = () => { currentPage = 1; renderSchedule(); };
    document.getElementById('filterStatus').onchange = () => { currentPage = 1; renderSchedule(); };

    document.getElementById('clusterViewToggleBtn').onclick = () => {
      isClusterView = !isClusterView;
      const btn = document.getElementById('clusterViewToggleBtn');
      btn.textContent = `Cluster View: ${isClusterView ? 'On' : 'Off'}`;
      btn.className = isClusterView ? 'btn btn-primary' : 'btn btn-outline';
      currentPage = 1;
      renderSchedule();
    };

    // Create / Edit modal
    const tripModal = document.getElementById('tripModal');
    // Shared modal helper wires Escape, backdrop close, focus trap and focus restore.
    const tripDialog = ui.modal(tripModal);
    document.getElementById('closeModalBtn').onclick = () => tripDialog.close();
    document.getElementById('cancelModalBtn').onclick = () => tripDialog.close();

    document.getElementById('openCreateModalBtn').onclick = () => {
      document.getElementById('modalTitle').textContent = 'Create New Trip';
      document.getElementById('editTripId').value = '';
      document.getElementById('modalRoute').value = '';
      document.getElementById('modalBoat').value = '';
      document.getElementById('modalBoat').disabled = false;
      document.getElementById('modalRoute').disabled = false;
      document.getElementById('modalDeparture').value = '';
      document.getElementById('modalRequiredPax').value = '15';
      document.getElementById('modalError').textContent = '';
      document.getElementById('boatWarning').textContent = '';
      document.getElementById('paxCapacityWarning').textContent = '';
      validateModalCapacity();
      tripDialog.open();
    };

    // Single source of truth for the capacity warning + Save enabled state.
    function validateModalCapacity() {
      const boatId = document.getElementById('modalBoat').value;
      const boat = allBoats.find(b => b.id === boatId);
      const reqPax = parseInt(document.getElementById('modalRequiredPax').value) || 0;
      const warn = document.getElementById('paxCapacityWarning');
      const saveBtn = document.querySelector('#tripForm button[type="submit"]');
      if (boatId && boat && reqPax > boat.passenger_capacity) {
        warn.textContent = `Error: Required passengers (${reqPax}) exceeds boat capacity (${boat.passenger_capacity}). This is not allowed.`;
        if (saveBtn) saveBtn.disabled = true;
      } else {
        warn.textContent = '';
        if (saveBtn) saveBtn.disabled = false;
      }
    }

    document.getElementById('modalBoat').onchange = validateModalCapacity;
    document.getElementById('modalRequiredPax').oninput = validateModalCapacity;

    window.editTrip = (id) => {
      const trip = allTrips.find(t => t.id === id);
      if (!trip) return;
      // Ensure the current boat is in the dropdown (in case it's suspended)
      populateFilterDropdowns(trip.boat_id);
      document.getElementById('modalTitle').textContent = 'Edit Trip';
      document.getElementById('editTripId').value = trip.id;
      document.getElementById('modalRoute').value = trip.route_id;
      document.getElementById('modalBoat').value = trip.boat_id;
      document.getElementById('modalDeparture').value = trip.departure_time.substring(0, 16);
      document.getElementById('modalRequiredPax').value = trip.required_passengers;
      document.getElementById('modalError').textContent = '';
      document.getElementById('boatWarning').textContent = '';
      document.getElementById('paxCapacityWarning').textContent = '';

      // Manifest entries pin both boat and route: moving the trip would strand
      // passengers on a route they did not book.
      const mEntries = allManifests.filter(m => m.trip_id === id);
      const boatSelect = document.getElementById('modalBoat');
      const routeSelect = document.getElementById('modalRoute');
      if (mEntries.length > 0) {
        boatSelect.disabled = true;
        routeSelect.disabled = true;
        document.getElementById('boatWarning').textContent = 'Note: Boat and route changes are blocked because manifest entries already exist for this trip.';
      } else {
        boatSelect.disabled = false;
        routeSelect.disabled = false;
        document.getElementById('boatWarning').textContent = '';
      }

      validateModalCapacity();
      tripDialog.open();
    };

    document.getElementById('tripForm').onsubmit = async (e) => {
      e.preventDefault();
      const id = document.getElementById('editTripId').value;
      const route_id = document.getElementById('modalRoute').value;
      const boat_id = document.getElementById('modalBoat').value;
      const departure_time = document.getElementById('modalDeparture').value;
      const required_passengers = parseInt(document.getElementById('modalRequiredPax').value);
      const errBox = document.getElementById('modalError');
      errBox.textContent = '';

      try {
        if (id) {
          // Re-fetch manifests at submit time to close the race window: a concurrent
          // manifest creation must not allow a boat/route change on a pinned trip.
          const currentManifests = await api.manifests.list();
          const mEntries = currentManifests.filter(m => m.trip_id === id);
          const updateData = { departure_time, required_passengers };
          if (mEntries.length === 0) {
            updateData.boat_id = boat_id;
            updateData.route_id = route_id;
          }
          await api.trips.update(id, updateData);
          ui.showToast('Trip updated successfully.', 'success');
        } else {
          await api.trips.create({
            boat_id,
            route_id,
            departure_time,
            required_passengers,
            created_by: session.user_id
          });
          ui.showToast('Trip created successfully.', 'success');
        }
        tripDialog.close();
        await loadData();
      } catch (err) {
        errBox.textContent = err.message;
      }
    };

    // Hold modal
    const holdModal = document.getElementById('holdModal');
    const holdDialog = ui.modal(holdModal);
    document.getElementById('closeHoldModalBtn').onclick = () => holdDialog.close();
    document.getElementById('cancelHoldModalBtn').onclick = () => holdDialog.close();

    window.openHoldModal = (id) => {
      document.getElementById('holdTripId').value = id;
      document.getElementById('holdReasonInput').value = '';
      document.getElementById('holdModalError').textContent = '';
      holdDialog.open();
    };

    document.getElementById('holdForm').onsubmit = async (e) => {
      e.preventDefault();
      const id = document.getElementById('holdTripId').value;
      const reason = document.getElementById('holdReasonInput').value.trim();
      const errBox = document.getElementById('holdModalError');
      errBox.textContent = '';

      try {
        if (!reason) throw new Error('A reason is required to hold a trip.');
        await api.trips.updateStatus(id, 'Held', reason);
        ui.showToast('Trip placed on hold.', 'success');
        holdDialog.close();
        await loadData();
      } catch (err) {
        errBox.textContent = err.message;
      }
    };

    window.releaseTrip = async (id) => {
      ui.confirm('Are you sure you want to release this trip back to Scheduled status?', async () => {
        try {
          await api.trips.updateStatus(id, 'Scheduled', null);
          ui.showToast('Trip released successfully.', 'success');
          await loadData();
        } catch (err) {
          ui.showToast(err.message, 'error');
        }
      });
    };

    window.markDeparted = async (id) => {
      ui.confirm('Are you sure you want to mark this trip as Departed?', async () => {
        try {
          await api.trips.markDeparted(id);
          ui.showToast('Trip marked as Departed.', 'success');
          await loadData();
        } catch (err) {
          ui.showToast(err.message, 'error');
        }
      });
    };

    window.markArrived = async (id) => {
      ui.confirm('Are you sure you want to mark this trip as Arrived?', async () => {
        try {
          await api.trips.markArrived(id);
          ui.showToast('Trip marked as Arrived.', 'success');
          await loadData();
        } catch (err) {
          ui.showToast(err.message, 'error');
        }
      });
    };

    window.deleteTrip = async (id) => {
      const mCount = allManifests.filter(m => m.trip_id === id).length;
      const bCount = allBookings.filter(b => b.trip_id === id).length;
      const approvals = allApprovals.filter(a => a.trip_id === id).length;
      if (mCount || bCount || approvals) {
        ui.showToast(`Cannot delete: ${mCount} manifest entr${mCount === 1 ? 'y' : 'ies'}, ${bCount} booking(s), and ${approvals} approval record(s) are linked to this trip.`, 'error');
        return;
      }
      ui.confirm('Are you sure you want to delete this trip?', async () => {
        try {
          await api.trips.delete(id);
          ui.showToast('Trip deleted successfully.', 'success');
          await loadData();
        } catch (err) {
          ui.showToast(err.message, 'error');
        }
      });
    };

    // Date filter defaults to today (PHT); clearing the input still shows all dates.
    document.getElementById('filterDate').value = ui.localDateStr();

    loadData();
    ui.setupSync(loadData);

    // Initialize pagination
    initPagination('#paginationContainer', (page) => {
      currentPage = page;
      renderSchedule();
    });
  </script>
</body>
</html>
