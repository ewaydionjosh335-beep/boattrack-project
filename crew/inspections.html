<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Vessel Safety Inspections - BoatTrack Crew</title>
  <link rel="stylesheet" href="/css/tokens.css">
  <link rel="stylesheet" href="/css/base.css">
  <link rel="stylesheet" href="/css/components.css">
  <link rel="stylesheet" href="/css/layout.css">
  <style>
    .portal-layout { display: flex; min-height: 100vh; background-color: var(--bg-main); }
    .portal-sidebar { width: 240px; background: var(--bg-sidebar); color: white; display: flex; flex-direction: column; position: fixed; top: 0; bottom: 0; left: 0; z-index: 200; }
    .portal-main { flex: 1; margin-left: 240px; display: flex; flex-direction: column; min-width: 0; }
    .portal-header { background: white; padding: 1rem 1.5rem; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; position: sticky; top: 0; z-index: 100; }
    .portal-content { padding: 1.5rem; flex: 1; }
    
    .bottom-tab-bar { display: none; position: fixed; bottom: 0; left: 0; right: 0; background: white; border-top: 1px solid var(--border); height: 60px; z-index: 1000; justify-content: space-around; align-items: center; }
    .bottom-tab-bar a { display: flex; flex-direction: column; align-items: center; justify-content: center; color: var(--text-muted); text-decoration: none; font-size: 0.65rem; font-weight: 500; gap: 2px; flex: 1; height: 100%; }
    .bottom-tab-bar a.active, .bottom-tab-bar a:hover { color: var(--teal); }

    @media (max-width: 992px) {
      .portal-sidebar { display: none !important; }
      .portal-main { margin-left: 0 !important; padding-bottom: 70px !important; }
      .bottom-tab-bar { display: flex !important; }
    }
  </style>
</head>
<body class="portal-layout">

  <!-- Desktop Sidebar -->
  <aside class="portal-sidebar">
    <div style="padding: 1.5rem; font-family: var(--font-display); font-weight: 700; font-size: 1.1rem; border-bottom: 1px solid var(--border-dark); display: flex; align-items: center; gap: 0.5rem; white-space: nowrap;">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M2 21c.6.5 1.2 1 2.5 1 2.5 0 2.5-2 5-2 1.3 0 1.9.5 2.5 1 .6.5 1.2 1 2.5 1 2.5 0 2.5-2 5-2 1.3 0 1.9.5 2.5 1"/><path d="M19.38 20A11.6 11.6 0 0 0 21 14l-9-4-9 4c0 2.3.6 4.5 1.62 6"/></svg>
      Crew Portal
    </div>
    <div style="padding: 1rem 0; overflow-y: auto;">
      <a href="/crew/dashboard.html" style="display: flex; align-items: center; gap: 0.75rem; padding: 0.75rem 1.5rem; color: #adb5bd; text-decoration: none; font-weight: 500;"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M3 9h18"/><path d="M9 21V9"/></svg> Dashboard</a>
      <a href="/crew/my-trips.html" style="display: flex; align-items: center; gap: 0.75rem; padding: 0.75rem 1.5rem; color: #adb5bd; text-decoration: none; font-weight: 500;"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="1 6 1 22 8 18 16 22 23 18 23 2 16 6 8 2 1 6"/></svg> My Trips</a>
      <a href="/crew/inspections.html" class="active" style="display: flex; align-items: center; gap: 0.75rem; padding: 0.75rem 1.5rem; color: white; text-decoration: none; font-weight: 500; background: rgba(255,255,255,0.05);"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/></svg> Inspections</a>
      <a href="/crew/sos.html" style="display: flex; align-items: center; gap: 0.75rem; padding: 0.75rem 1.5rem; color: #adb5bd; text-decoration: none; font-weight: 500;"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg> SOS Emergency</a>
      <a href="/crew/profile.html" style="display: flex; align-items: center; gap: 0.75rem; padding: 0.75rem 1.5rem; color: #adb5bd; text-decoration: none; font-weight: 500;"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg> Profile</a>
      <a href="#" id="logoutBtn" style="display: flex; align-items: center; gap: 0.75rem; padding: 0.75rem 1.5rem; color: var(--danger); text-decoration: none; font-weight: 500;"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg> Logout</a>
    </div>
  </aside>

  <!-- Main Content Area -->
  <div class="portal-main">
    <header class="portal-header">
      <h2 style="font-size: 1.25rem; font-weight: 700; color: var(--primary);">Vessel Safety Inspections</h2>
      <span id="userName" style="font-weight: 600; font-size: 0.9rem;"></span>
    </header>

    <div class="portal-content">
      <!-- SELECT TRIP -->
      <div class="card" style="margin-bottom: 1.5rem;">
        <div class="form-group" style="margin-bottom: 0;">
          <label class="form-label">Select Trip for Inspection</label>
          <select id="tripSelect" class="form-control"></select>
        </div>
      </div>

      <!-- INSPECTION FORMS & HISTORY CONTAINER -->
      <div id="inspectionContainer">
        <div class="card" style="text-align: center; padding: 3rem;">
          <p style="color: var(--text-muted);">Please select a trip above to perform or view inspections.</p>
        </div>
      </div>
    </div>
  </div>

  <!-- Mobile Bottom Tab Bar -->
  <nav class="bottom-tab-bar">
    <a href="/crew/dashboard.html">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M3 9h18"/><path d="M9 21V9"/></svg>
      Dashboard
    </a>
    <a href="/crew/my-trips.html">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="1 6 1 22 8 18 16 22 23 18 23 2 16 6 8 2 1 6"/></svg>
      My Trips
    </a>
    <a href="/crew/inspections.html" class="active">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/></svg>
      Inspections
    </a>
    <a href="/crew/sos.html">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>
      SOS
    </a>
    <a href="/crew/profile.html">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
      Profile
    </a>
  </nav>

  <script type="module">
    import { api } from '/js/api.js';
    import { seedDatabase } from '/js/seed.js';
    import { auth } from '/js/auth.js';
    import { ui } from '/js/ui.js';

    await seedDatabase();
    const session = await auth.requireAuth(['crew']);
    if (!session) throw new Error('Unauthorized');

    const users = await api.users.list();
    const user = users.find(u => u.id === session.user_id);
    if (user) {
      document.getElementById('userName').textContent = user.full_name;
    }

    let crewMember = null;
    let boats = [];
    let assignedBoat = null;
    let allTrips = [];
    let allRoutes = [];
    let allTerminals = [];
    let allManifests = [];
    let allInspections = [];

    const urlParams = new URLSearchParams(window.location.search);
    const initialTripId = urlParams.get('trip_id');

    async function init() {
      try {
        crewMember = await api.crewMembers.getByUser(session.user_id);
        boats = await api.boats.list();
        assignedBoat = (crewMember ? boats.find(b => b.id === crewMember.boat_id) : null) || boats[0];

        allTrips = await api.trips.list();
        allRoutes = await api.routes.list();
        allTerminals = await api.terminals.list();
        allManifests = await api.manifests.list();
        allInspections = await api.inspections.list();

        // Match the My Trips page: only this crew member's assigned vessel, with a
        // fallback to all trips so the dropdown is never empty when the vessel has none.
        let boatTrips = assignedBoat ? allTrips.filter(t => t.boat_id === assignedBoat.id) : [];
        if (boatTrips.length === 0) boatTrips = [...allTrips];
        if (initialTripId && !boatTrips.some(t => t.id === initialTripId)) {
          const targetTrip = allTrips.find(t => t.id === initialTripId);
          if (targetTrip) boatTrips.push(targetTrip);
        }

        const select = document.getElementById('tripSelect');
        if (boatTrips.length === 0) {
          select.innerHTML = '<option value="">-- No trips available --</option>';
          document.getElementById('inspectionContainer').innerHTML = '<div class="card" style="text-align: center; padding: 3rem;"><p style="color: var(--text-muted);">No trips available for inspection.</p></div>';
          return;
        }

        select.innerHTML = '<option value="">-- Choose Trip --</option>' + boatTrips.map(t => {
          const boat = boats.find(b => b.id === t.boat_id) || {};
          const route = allRoutes.find(r => r.id === t.route_id) || {};
          const origin = allTerminals.find(term => term.id === route.origin_terminal_id)?.name || 'Origin';
          const dest = allTerminals.find(term => term.id === route.destination_terminal_id)?.name || 'Destination';
          const timeStr = new Date(t.departure_time).toLocaleString([], { dateStyle: 'short', timeStyle: 'short' });
          return `<option value="${t.id}" ${initialTripId === t.id ? 'selected' : ''}>${boat.name || 'Boat'} | ${timeStr} → ${dest} (${t.trip_status})</option>`;
        }).join('');

        const targetId = initialTripId || (boatTrips.length > 0 ? boatTrips[0].id : null);
        if (targetId) {
          select.value = targetId;
          renderInspectionView(targetId);
        }

        select.onchange = (e) => {
          const tripId = e.target.value;
          if (tripId) {
            window.history.replaceState({}, '', `?trip_id=${tripId}`);
            renderInspectionView(tripId);
          } else {
            document.getElementById('inspectionContainer').innerHTML = '<div class="card" style="text-align: center; padding: 3rem;"><p style="color: var(--text-muted);">Please select a trip above.</p></div>';
          }
        };
      } catch (err) {
        console.error('Inspection init error:', err);
        document.getElementById('inspectionContainer').innerHTML = `<div class="card" style="text-align: center; padding: 3rem;"><p style="color: var(--danger);">Error loading inspections: ${err.message}</p></div>`;
      }
    }

    function renderInspectionView(tripId) {
      const trip = allTrips.find(t => t.id === tripId);
      if (!trip) return;

      const route = allRoutes.find(r => r.id === trip.route_id) || {};
      const origin = allTerminals.find(term => term.id === route.origin_terminal_id)?.name || 'Origin';
      const dest = allTerminals.find(term => term.id === route.destination_terminal_id)?.name || 'Destination';
      
      const tripManifests = allManifests.filter(m => m.trip_id === tripId);
      const manifestCount = tripManifests.length;

      const tripInspections = allInspections.filter(i => i.trip_id === tripId);
      const preInspecs = tripInspections.filter(i => i.inspection_type === 'Pre-departure');
      const postInspecs = tripInspections.filter(i => i.inspection_type === 'Post-arrival');

      const isScheduledOrHeld = trip.trip_status === 'Scheduled' || trip.trip_status === 'Held';
      const isDeparted = trip.trip_status === 'Departed';
      const isArrived = trip.trip_status === 'Arrived';

      const container = document.getElementById('inspectionContainer');
      container.innerHTML = `
        <!-- TRIP SUMMARY -->
        <div class="card" style="margin-bottom: 1.5rem;">
          <h3>Trip Inspection Overview</h3>
          <p style="color: var(--text-muted); font-size: 0.9rem; margin-top: 0.25rem;">
            Route: <strong>${origin} → ${dest}</strong> | Status: <span class="badge badge-${trip.trip_status.toLowerCase()}">${trip.trip_status}</span> | Manifest Count: <strong>${manifestCount} passengers</strong>
          </p>
        </div>

        <!-- PRE-DEPARTURE INSPECTION -->
        <div class="card" style="margin-bottom: 1.5rem;">
          <h3>Pre-Departure Safety Inspection</h3>
          <p style="color: var(--text-muted); font-size: 0.85rem; margin-bottom: 1rem;">
            ${isScheduledOrHeld ? 'Available for Scheduled or Held trips prior to departure. You may re-inspect before departure; previous submissions are kept as history.' : 'Pre-departure inspection is locked because the trip has already departed or arrived.'}
          </p>

          ${isScheduledOrHeld ? `
            <form id="preInspForm" style="display: flex; flex-direction: column; gap: 1rem;">
              <div class="table-container">
                <table>
                  <thead>
                    <tr>
                      <th>Checklist Item</th>
                      <th>Result (Pass/Fail)</th>
                      <th>Notes / Remarks</th>
                    </tr>
                  </thead>
                  <tbody>
                    <tr>
                      <td><strong>Life jackets</strong></td>
                      <td>
                        <select class="form-control item-result" data-item="Life jackets" required>
                          <option value="Pass">Pass</option>
                          <option value="Fail">Fail</option>
                        </select>
                      </td>
                      <td><input type="text" class="form-control item-note" placeholder="Optional note (required on Fail)"></td>
                    </tr>
                    <tr>
                      <td><strong>Engine</strong></td>
                      <td>
                        <select class="form-control item-result" data-item="Engine" required>
                          <option value="Pass">Pass</option>
                          <option value="Fail">Fail</option>
                        </select>
                      </td>
                      <td><input type="text" class="form-control item-note" placeholder="Optional note (required on Fail)"></td>
                    </tr>
                    <tr>
                      <td><strong>Fuel</strong></td>
                      <td>
                        <select class="form-control item-result" data-item="Fuel" required>
                          <option value="Pass">Pass</option>
                          <option value="Fail">Fail</option>
                        </select>
                      </td>
                      <td><input type="text" class="form-control item-note" placeholder="Optional note (required on Fail)"></td>
                    </tr>
                    <tr>
                      <td><strong>Hull</strong></td>
                      <td>
                        <select class="form-control item-result" data-item="Hull" required>
                          <option value="Pass">Pass</option>
                          <option value="Fail">Fail</option>
                        </select>
                      </td>
                      <td><input type="text" class="form-control item-note" placeholder="Optional note (required on Fail)"></td>
                    </tr>
                    <tr>
                      <td>
                        <strong>Passenger count</strong><br>
                        <small style="color: var(--text-muted);">Manifest Count: <strong>${manifestCount}</strong></small>
                      </td>
                      <td>
                        <div style="display: flex; flex-direction: column; gap: 0.375rem;">
                          <input type="number" id="countedPaxInput" class="form-control" placeholder="Counted pax" value="${manifestCount}" required min="0">
                          <select class="form-control item-result" data-item="Passenger count" required>
                            <option value="Pass">Pass</option>
                            <option value="Fail">Fail</option>
                          </select>
                        </div>
                      </td>
                      <td>
                        <input type="text" class="form-control item-note" placeholder="Note on count">
                        <div id="paxMismatchWarning" style="font-size: 0.8rem; color: var(--danger); margin-top: 0.25rem; display: none;">Warning: Counted passengers differ from manifest count (${manifestCount})!</div>
                      </td>
                    </tr>
                  </tbody>
                </table>
              </div>
              <div class="form-group">
                <label class="form-label">General Inspection Remarks</label>
                <textarea id="preRemarks" class="form-control" rows="2" placeholder="Overall notes..."></textarea>
              </div>
              <button type="submit" class="btn btn-primary">Submit Pre-Departure Inspection</button>
            </form>
          ` : ''}

          <!-- Pre-Departure History -->
          <div style="margin-top: 1.5rem;">
            <h4 style="font-size: 0.95rem; margin-bottom: 0.75rem;">Pre-Departure Inspection History</h4>
            ${preInspecs.length === 0 ? `<p style="font-size: 0.85rem; color: var(--text-muted);">No pre-departure inspections recorded yet.</p>` : `
              <div style="display: flex; flex-direction: column; gap: 0.75rem;">
                ${preInspecs.map((insp, idx) => `
                  <div style="background: #f8fafc; padding: 0.875rem; border-radius: var(--radius-sm); border: 1px solid var(--border);">
                    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 0.5rem;">
                      <span style="font-size: 0.85rem; color: var(--text-muted);">Inspection #${preInspecs.length - idx} | By: ${insp.inspected_by} at ${new Date(insp.inspected_at).toLocaleString()}</span>
                      <span class="badge ${insp.overall === 'Passed' ? 'badge-active' : 'badge-danger'}">${insp.overall}</span>
                    </div>
                    <div style="font-size: 0.85rem; margin-bottom: 0.375rem;">Counted Passengers: <strong>${insp.counted_passengers}</strong> (Manifest: ${insp.manifest_count})</div>
                    <div style="font-size: 0.85rem; color: var(--text-muted);">Remarks: ${insp.remarks || 'None'}</div>
                  </div>
                `).join('')}
              </div>
            `}
          </div>
        </div>

        <!-- POST-ARRIVAL INSPECTION -->
        <div class="card">
          <h3>Post-Arrival Safety Inspection</h3>
          <p style="color: var(--text-muted); font-size: 0.85rem; margin-bottom: 1rem;">
            ${isArrived ? (postInspecs.length > 0 ? 'Post-arrival inspection already submitted and locked read-only.' : 'Available only for Arrived trips. Once submitted, it is locked read-only.') : 'Available only after the trip status is set to Arrived.'}
          </p>

          ${isArrived && postInspecs.length === 0 ? `
            <form id="postInspForm" style="display: flex; flex-direction: column; gap: 1rem;">
              <div class="table-container">
                <table>
                  <thead>
                    <tr>
                      <th>Checklist Item</th>
                      <th>Result (Pass/Fail)</th>
                      <th>Notes / Remarks</th>
                    </tr>
                  </thead>
                  <tbody>
                    <tr>
                      <td><strong>Life jackets</strong></td>
                      <td>
                        <select class="form-control post-item-result" data-item="Life jackets" required>
                          <option value="Pass">Pass</option>
                          <option value="Fail">Fail</option>
                        </select>
                      </td>
                      <td><input type="text" class="form-control post-item-note" placeholder="Note"></td>
                    </tr>
                    <tr>
                      <td><strong>Engine</strong></td>
                      <td>
                        <select class="form-control post-item-result" data-item="Engine" required>
                          <option value="Pass">Pass</option>
                          <option value="Fail">Fail</option>
                        </select>
                      </td>
                      <td><input type="text" class="form-control post-item-note" placeholder="Note"></td>
                    </tr>
                    <tr>
                      <td><strong>Fuel</strong></td>
                      <td>
                        <select class="form-control post-item-result" data-item="Fuel" required>
                          <option value="Pass">Pass</option>
                          <option value="Fail">Fail</option>
                        </select>
                      </td>
                      <td><input type="text" class="form-control post-item-note" placeholder="Note"></td>
                    </tr>
                    <tr>
                      <td><strong>Hull</strong></td>
                      <td>
                        <select class="form-control post-item-result" data-item="Hull" required>
                          <option value="Pass">Pass</option>
                          <option value="Fail">Fail</option>
                        </select>
                      </td>
                      <td><input type="text" class="form-control post-item-note" placeholder="Note"></td>
                    </tr>
                    <tr>
                      <td>
                        <strong>Passenger count</strong><br>
                        <small style="color: var(--text-muted);">Manifest Count: <strong>${manifestCount}</strong></small>
                      </td>
                      <td>
                        <div style="display: flex; flex-direction: column; gap: 0.375rem;">
                          <input type="number" id="postCountedPaxInput" class="form-control" placeholder="Counted pax" value="${manifestCount}" required min="0">
                          <select class="form-control post-item-result" data-item="Passenger count" required>
                            <option value="Pass">Pass</option>
                            <option value="Fail">Fail</option>
                          </select>
                        </div>
                      </td>
                      <td><input type="text" class="form-control post-item-note" placeholder="Note"></td>
                    </tr>
                  </tbody>
                </table>
              </div>
              <div class="form-group">
                <label class="form-label">General Inspection Remarks</label>
                <textarea id="postRemarks" class="form-control" rows="2" placeholder="Overall notes..."></textarea>
              </div>
              <button type="submit" class="btn btn-primary">Submit Post-Arrival Inspection (Lock)</button>
            </form>
          ` : ''}

          <!-- Post-Arrival History / Locked View -->
          <div style="margin-top: 1.5rem;">
            <h4 style="font-size: 0.95rem; margin-bottom: 0.75rem;">Post-Arrival Inspection Record</h4>
            ${postInspecs.length === 0 ? '<p style="font-size: 0.85rem; color: var(--text-muted);">No post-arrival inspection recorded yet.</p>' : `
              <div style="display: flex; flex-direction: column; gap: 0.75rem;">
                ${postInspecs.map(insp => `
                  <div style="background: #f8fafc; padding: 0.875rem; border-radius: var(--radius-sm); border: 1px solid var(--border);">
                    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 0.5rem;">
                      <span style="font-size: 0.85rem; color: var(--text-muted);">Submitted By: ${insp.inspected_by} at ${new Date(insp.inspected_at).toLocaleString()} (Locked Read-Only)</span>
                      <span class="badge ${insp.overall === 'Passed' ? 'badge-active' : 'badge-danger'}">${insp.overall}</span>
                    </div>
                    <div style="font-size: 0.85rem; margin-bottom: 0.375rem;">Counted Passengers: <strong>${insp.counted_passengers}</strong> (Manifest: ${insp.manifest_count})</div>
                    <div style="font-size: 0.85rem; color: var(--text-muted);">Remarks: ${insp.remarks || 'None'}</div>
                  </div>
                `).join('')}
              </div>
            `}
          </div>
        </div>
      `;

      // Bind Pre-departure Form submission
      const preForm = document.getElementById('preInspForm');
      if (preForm) {
        const countedPaxInput = document.getElementById('countedPaxInput');
        const paxMismatchWarning = document.getElementById('paxMismatchWarning');

        countedPaxInput.oninput = () => {
          const val = parseInt(countedPaxInput.value) || 0;
          if (val !== manifestCount) {
            paxMismatchWarning.style.display = 'block';
          } else {
            paxMismatchWarning.style.display = 'none';
          }
        };

        preForm.onsubmit = async (e) => {
          e.preventDefault();
          const items = [];
          let hasFail = false;
          let noteMissing = false;

          document.querySelectorAll('.item-result').forEach(sel => {
            const item = sel.getAttribute('data-item');
            const result = sel.value;
            const noteInput = sel.closest('tr').querySelector('.item-note');
            const note = noteInput ? noteInput.value.trim() : '';

            if (result === 'Fail') {
              hasFail = true;
              if (!note) noteMissing = true;
            }
            items.push({ item, result, note });
          });

          if (noteMissing) {
            alert('A note/remark is required for any checklist item marked as Fail.');
            return;
          }

          const countedPax = parseInt(countedPaxInput.value) || 0;
          const overall = hasFail ? 'Failed' : 'Passed';
          const remarks = document.getElementById('preRemarks').value.trim();

          await api.inspections.create({
            trip_id: tripId,
            boat_id: assignedBoat ? assignedBoat.id : null,
            inspection_type: 'Pre-departure',
            items,
            counted_passengers: countedPax,
            manifest_count: manifestCount,
            overall,
            remarks,
            inspected_by: user ? user.full_name : 'Crew Member'
          });

          ui.showToast('Pre-departure inspection submitted successfully!', 'success');
          allInspections = await api.inspections.list();
          renderInspectionView(tripId);
        };
      }

      // Bind Post-arrival Form submission
      const postForm = document.getElementById('postInspForm');
      if (postForm) {
        postForm.onsubmit = async (e) => {
          e.preventDefault();
          const items = [];
          let hasFail = false;
          let noteMissing = false;

          document.querySelectorAll('.post-item-result').forEach(sel => {
            const item = sel.getAttribute('data-item');
            const result = sel.value;
            const noteInput = sel.closest('tr').querySelector('.post-item-note');
            const note = noteInput ? noteInput.value.trim() : '';

            if (result === 'Fail') {
              hasFail = true;
              if (!note) noteMissing = true;
            }
            items.push({ item, result, note });
          });

          if (noteMissing) {
            alert('A note/remark is required for any checklist item marked as Fail.');
            return;
          }

          const countedPax = parseInt(document.getElementById('postCountedPaxInput').value) || 0;
          const overall = hasFail ? 'Failed' : 'Passed';
          const remarks = document.getElementById('postRemarks').value.trim();

          await api.inspections.create({
            trip_id: tripId,
            boat_id: assignedBoat ? assignedBoat.id : null,
            inspection_type: 'Post-arrival',
            items,
            counted_passengers: countedPax,
            manifest_count: manifestCount,
            overall,
            remarks,
            inspected_by: user ? user.full_name : 'Crew Member'
          });

          ui.showToast('Post-arrival inspection submitted and locked!', 'success');
          allInspections = await api.inspections.list();
          renderInspectionView(tripId);
        };
      }
    }

    init();
    ui.setupSync(init);

    document.getElementById('logoutBtn').onclick = async (e) => {
      e.preventDefault();
      await api.auth.logout();
      window.location.href = '/login.html';
    };
  </script>
</body>
</html>
