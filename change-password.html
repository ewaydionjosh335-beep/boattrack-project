<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Change Password - BoatTrack</title>
  <link rel="stylesheet" href="/css/tokens.css">
  <link rel="stylesheet" href="/css/base.css">
  <link rel="stylesheet" href="/css/components.css">
  <link rel="stylesheet" href="/css/layout.css">
  <style>
    body {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      background-color: var(--bg-main);
    }
    .auth-card {
      width: 100%;
      max-width: 440px;
      padding: 2.5rem;
      background: white;
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      box-shadow: var(--shadow-md);
    }
  </style>
</head>
<body>
  <div class="auth-card">
    <div style="text-align: center; margin-bottom: 1.5rem;">
      <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="var(--teal)" stroke-width="2"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
      <h2 style="margin-top: 0.5rem; color: var(--primary);">Change Password Required</h2>
      <p style="color: var(--text-muted); font-size: 0.9rem; margin-top: 0.25rem;">Your account requires a password update before proceeding.</p>
    </div>

    <form id="changePasswordForm">
      <div class="form-group">
        <label class="form-label">Current Password</label>
        <input type="password" id="currentPass" class="form-control" required>
      </div>
      <div class="form-group">
        <label class="form-label">New Password (≥8 chars, 1 letter & 1 number)</label>
        <input type="password" id="newPass" class="form-control" required>
      </div>
      <div class="form-group">
        <label class="form-label">Confirm New Password</label>
        <input type="password" id="confirmPass" class="form-control" required>
      </div>
      <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: 1rem;">Update Password</button>
    </form>
  </div>

  <script type="module">
    import { api } from '/js/api.js';
    import { auth, hashPassword } from '/js/auth.js';
    import { ui } from '/js/ui.js';

    const session = await auth.requireAuth();
    if (!session) throw new Error('Unauthorized');

    const users = await api.users.list();
    const currentUser = users.find(u => u.id === session.user_id);

    document.getElementById('changePasswordForm').onsubmit = async (e) => {
      e.preventDefault();
      const currentPass = document.getElementById('currentPass').value;
      const newPass = document.getElementById('newPass').value;
      const confirmPass = document.getElementById('confirmPass').value;

      try {
        if (currentUser.password && currentPass !== currentUser.password) {
          throw new Error('Current password is incorrect.');
        }
        if (newPass.length < 8 || !/[a-zA-Z]/.test(newPass) || !/[0-9]/.test(newPass)) {
          throw new Error('New password must be at least 8 characters long and contain at least one letter and one number.');
        }
        if (newPass !== confirmPass) {
          throw new Error('New passwords do not match.');
        }

        const newHash = await hashPassword(newPass);
        await api.users.update(session.user_id, {
          password: newPass,
          password_hash: newHash,
          must_change_password: false
        });

        ui.showToast('Password updated successfully!', 'success');
        
        const ROLE_HOMES = {
          administrator: '/admin/dashboard.html',
          port_manager: '/manager/dashboard.html',
          receptionist: '/receptionist/dashboard.html',
          boat_owner: '/owner/dashboard.html',
          boat_operator: '/operator/dashboard.html',
          passenger: '/passenger/dashboard.html',
          crew: '/crew/dashboard.html'
        };
        setTimeout(() => {
          window.location.href = ROLE_HOMES[session.role] || '/index.html';
        }, 1000);
      } catch (err) {
        ui.showToast(err.message, 'danger');
      }
    };
  </script>
</body>
</html>
