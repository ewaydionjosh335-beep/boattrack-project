<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Boats - BoatTrack Operator</title>
  <link rel="stylesheet" href="/css/tokens.css">
  <link rel="stylesheet" href="/css/base.css">
  <link rel="stylesheet" href="/css/components.css">
  <link rel="stylesheet" href="/css/layout.css">
</head>
<body class="admin-layout">

  <aside class="admin-sidebar">
    <div class="sidebar-header">
      <span style="display: flex; align-items: center; gap: 0.5rem;">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M2 21c.6.5 1.2 1 2.5 1 2.5 0 2.5-2 5-2 1.3 0 1.9.5 2.5 1 .6.5 1.2 1 2.5 1 2.5 0 2.5-2 5-2 1.3 0 1.9.5 2.5 1"/><path d="M19.38 20A11.6 11.6 0 0 0 21 14l-9-4-9 4c0 2.3.6 4.5 1.62 6"/><path d="M12 10V4l3 2-3 2"/></svg>
        Boat Operator
      </span>
    </div>
    <div class="sidebar-menu">
      <a href="/operator/dashboard.html"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M3 9h18"/><path d="M9 21V9"/></svg> Dashboard</a>
      <a href="/operator/my-boats.html" class="active"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M2 21c.6.5 1.2 1 2.5 1 2.5 0 2.5-2 5-2 1.3 0 1.9.5 2.5 1 .6.5 1.2 1 2.5 1 2.5 0 2.5-2 5-2 1.3 0 1.9.5 2.5 1"/><path d="M19.38 20A11.6 11.6 0 0 0 21 14l-9-4-9 4c0 2.3.6 4.5 1.62 6"/><path d="M12 10V4l3 2-3 2"/></svg> My Boats</a>
      <a href="/operator/crew-applications.html"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg> Crew Applications</a>
      <a href="/operator/crew-list.html"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"/><rect x="8" y="2" width="8" height="4" rx="1" ry="1"/></svg> Crew List</a>
      <a href="/operator/crew-attendance.html"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg> Attendance</a>
      <a href="/operator/trips.html"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="1 6 1 22 8 18 16 22 23 18 23 2 16 6 8 2 1 6"/><line x1="8" y1="2" x2="8" y2="18"/><line x1="16" y1="6" x2="16" y2="22"/></svg> Trips</a>
      <a href="#" id="logoutBtn" style="color: var(--danger);"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg> Logout</a>
    </div>
  </aside>

  <div class="admin-main">
    <header class="admin-header">
      <h2>My Assigned Boats</h2>
    </header>

    <div class="admin-content">
      <div id="boatsContainer" style="display: grid; gap: 1.5rem;"></div>
    </div>
  </div>

  <script type="module">
    import { api } from '/js/api.js';
    import { auth } from '/js/auth.js';

    const session = await auth.requireAuth(['boat_operator']);
    
    const allBoats = await api.boats.list();
    const myVerifiedBoats = allBoats.filter(b => b.operator_id === session.user_id && b.registration_status === 'Verified');
    
    const allCrew = await api.crewMembers.list();
    
    const container = document.getElementById('boatsContainer');
    if (myVerifiedBoats.length === 0) {
        container.innerHTML = '<div class="card" style="text-align: center; color: var(--text-muted);">No verified boats currently assigned to you.</div>';
    } else {
        myVerifiedBoats.forEach(boat => {
            const boatCrew = allCrew.filter(c => c.boat_id === boat.id && c.status === 'Active');
            
            const card = document.createElement('div');
            card.className = 'card';
            card.innerHTML = `
                <h3 style="margin-bottom: 0.75rem; color: var(--primary);">${boat.name}</h3>
                <p><strong>Type:</strong> <span class="badge" style="background:#e2e8f0; color:#334155;">${boat.boat_type}</span></p>
                <p><strong>Capacity:</strong> ${boat.passenger_capacity} Passengers, ${boat.cargo_capacity}kg Cargo (Max Load: ${boat.max_load_kg}kg)</p>
                <h4 style="margin-top: 1rem; margin-bottom: 0.5rem; font-size: 1rem;">Current Active Crew</h4>
                <ul style="padding-left: 1.25rem;">
                    ${boatCrew.length > 0 ? boatCrew.map(c => `<li>${c.full_name} (${c.role})</li>`).join('') : '<li style="color: var(--text-muted);">No active crew assigned</li>'}
                </ul>
            `;
            container.appendChild(card);
        });
    }

    document.getElementById('logoutBtn').onclick = async (e) => {
      e.preventDefault();
      await api.auth.logout();
      window.location.href = '/login.html';
    };
  </script>
</body>
</html>
