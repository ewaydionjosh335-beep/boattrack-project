<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Crew Applications - BoatTrack Operator</title>
  <link rel="stylesheet" href="/css/tokens.css">
  <link rel="stylesheet" href="/css/base.css">
  <link rel="stylesheet" href="/css/components.css">
  <link rel="stylesheet" href="/css/layout.css">
</head>
<body class="admin-layout">

  <aside class="admin-sidebar">
    <div class="sidebar-header">
      <span style="display: flex; align-items: center; gap: 0.5rem;">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M2 21c.6.5 1.2 1 2.5 1 2.5 0 2.5-2 5-2 1.3 0 1.9.5 2.5 1 .6.5 1.2 1 2.5 1 2.5 0 2.5-2 5-2 1.3 0 1.9.5 2.5 1"/><path d="M19.38 20A11.6 11.6 0 0 0 21 14l-9-4-9 4c0 2.3.6 4.5 1.62 6"/><path d="M12 10V4l3 2-3 2"/></svg>
        Boat Operator
      </span>
    </div>
    <div class="sidebar-menu">
      <a href="/operator/dashboard.html"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M3 9h18"/><path d="M9 21V9"/></svg> Dashboard</a>
      <a href="/operator/my-boats.html"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M2 21c.6.5 1.2 1 2.5 1 2.5 0 2.5-2 5-2 1.3 0 1.9.5 2.5 1 .6.5 1.2 1 2.5 1 2.5 0 2.5-2 5-2 1.3 0 1.9.5 2.5 1"/><path d="M19.38 20A11.6 11.6 0 0 0 21 14l-9-4-9 4c0 2.3.6 4.5 1.62 6"/><path d="M12 10V4l3 2-3 2"/></svg> My Boats</a>
      <a href="/operator/crew-applications.html" class="active"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg> Crew Applications</a>
      <a href="/operator/crew-list.html"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"/><rect x="8" y="2" width="8" height="4" rx="1" ry="1"/></svg> Crew List</a>
      <a href="/operator/crew-attendance.html"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg> Attendance</a>
      <a href="/operator/trips.html"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="1 6 1 22 8 18 16 22 23 18 23 2 16 6 8 2 1 6"/><line x1="8" y1="2" x2="8" y2="18"/><line x1="16" y1="6" x2="16" y2="22"/></svg> Trips</a>
      <a href="#" id="logoutBtn" style="color: var(--danger);"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg> Logout</a>
    </div>
  </aside>

  <div class="admin-main">
    <header class="admin-header">
      <h2>Crew Applications</h2>
      <button class="btn btn-primary" id="newAppBtn">Add New Application</button>
    </header>

    <div class="admin-content">
      <div class="card" style="margin-bottom: 1.5rem;">
        <div style="display: flex; gap: 1rem;">
          <input type="text" id="searchInput" class="form-control" placeholder="Search applicant...">
          <select id="boatFilter" class="form-control" style="width: auto;"><option value="">All Boats</option></select>
        </div>
      </div>
      
      <div class="table-container">
        <table>
          <thead>
            <tr>
              <th>Applicant Name</th>
              <th>Contact</th>
              <th>Boat</th>
              <th>Stage</th>
              <th>Actions</th>
            </tr>
          </thead>
          <tbody id="appTableBody">
            <tr><td colspan="5" style="text-align: center;">Loading applications...</td></tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>

  <div id="newAppModal" class="modal-backdrop" style="display:none;">
    <div class="modal">
        <div class="modal-header"><h3>New Application</h3></div>
        <form id="newAppForm">
          <div class="modal-body">
              <div class="form-group"><label class="form-label">Boat</label><select id="appBoat" class="form-control" required></select></div>
              <div class="form-group"><label class="form-label">Name</label><input type="text" id="appName" class="form-control" required></div>
              <div class="form-group"><label class="form-label">Mobile (09XXXXXXXXX)</label><input type="text" id="appMobile" class="form-control" required></div>
          </div>
          <div class="modal-footer">
              <button type="button" class="btn btn-outline" onclick="document.getElementById('newAppModal').style.display='none'">Cancel</button>
              <button type="submit" class="btn btn-primary">Create</button>
          </div>
        </form>
    </div>
  </div>

  <script type="module">
    import { api } from '/js/api.js';
    import { auth } from '/js/auth.js';
    import { ui } from '/js/ui.js';

    const session = await auth.requireAuth(['boat_operator']);
    let apps = [];
    let myBoats = [];

    async function loadData() {
        const allBoats = await api.boats.list();
        myBoats = allBoats.filter(b => b.operator_id === session.user_id && b.registration_status === 'Verified');
        const myBoatIds = myBoats.map(b => b.id);
        
        const allApps = await api.crewApplications.list();
        apps = allApps.filter(a => myBoatIds.includes(a.boat_id));
        
        const boatFilter = document.getElementById('boatFilter');
        boatFilter.innerHTML = '<option value="">All Boats</option>' + myBoats.map(b => `<option value="${b.id}">${b.name}</option>`).join('');
        
        const appBoat = document.getElementById('appBoat');
        appBoat.innerHTML = '<option value="">-- Select Boat --</option>' + myBoats.map(b => `<option value="${b.id}">${b.name}</option>`).join('');

        render();
    }
    
    function render() {
        const tbody = document.getElementById('appTableBody');
        const searchTerm = document.getElementById('searchInput').value.toLowerCase();
        const boatId = document.getElementById('boatFilter').value;
        
        let filteredApps = apps.filter(a => 
            (a.full_name.toLowerCase().includes(searchTerm) || (a.contact && a.contact.includes(searchTerm))) &&
            (boatId === "" || a.boat_id === boatId)
        );

        if (filteredApps.length === 0) {
            tbody.innerHTML = '<tr><td colspan="5" style="text-align: center;">No crew applications found.</td></tr>';
            return;
        }

        const stages = ['Requested', 'Form Pending', 'Operator Review', 'Pending Admin Verification', 'Accepted'];

        tbody.innerHTML = filteredApps.map(a => {
            const boat = myBoats.find(b => b.id === a.boat_id) || { name: 'N/A' };
            const canAdvance = a.stage !== 'Accepted' && a.stage !== 'Rejected' && a.stage !== 'Pending Admin Verification';
            return `
                <tr>
                    <td><strong>${a.full_name}</strong></td>
                    <td>${a.contact || 'N/A'}</td>
                    <td>${boat.name}</td>
                    <td><span class="badge badge-pending">${a.stage}</span></td>
                    <td>
                      <div class="table-actions">
                        ${a.stage === 'Operator Review' ? `<button class="btn btn-sm btn-primary" onclick="window.submitToAdmin('${a.id}')">Submit to Admin</button>` : 
                          canAdvance ? `<button class="btn btn-sm btn-primary" onclick="window.advance('${a.id}')">Advance Stage</button>` : 
                          `<span style="font-size:0.85rem; color:var(--text-muted);">${a.stage}</span>`}
                      </div>
                    </td>
                </tr>
            `;
        }).join('');
    }

    document.getElementById('newAppBtn').onclick = () => document.getElementById('newAppModal').style.display = 'flex';
    
    document.getElementById('newAppForm').onsubmit = async (e) => {
        e.preventDefault();
        await api.crewApplications.create({
            boat_id: document.getElementById('appBoat').value,
            full_name: document.getElementById('appName').value.trim(),
            contact: document.getElementById('appMobile').value.trim(),
            stage: 'Requested'
        });
        document.getElementById('newAppModal').style.display = 'none';
        ui.showToast('Crew application created successfully.', 'success');
        await loadData();
    };

    document.getElementById('searchInput').oninput = render;
    document.getElementById('boatFilter').onchange = render;

    window.advance = async (id) => {
        const app = apps.find(a => a.id === id);
        const stages = ['Requested', 'Form Pending', 'Operator Review', 'Pending Admin Verification', 'Accepted'];
        const idx = stages.indexOf(app.stage);
        if (idx !== -1 && idx < stages.length - 1) {
            const nextStage = stages[idx + 1];
            await api.crewApplications.decide(id, nextStage);
            ui.showToast(`Application advanced to ${nextStage}.`, 'success');
            await loadData();
        }
    };

    window.submitToAdmin = async (id) => {
        await api.crewApplications.decide(id, 'Pending Admin Verification');
        ui.showToast('Application submitted to Administrator for verification.', 'success');
        await loadData();
    };

    document.getElementById('logoutBtn').onclick = async (e) => {
      e.preventDefault();
      await api.auth.logout();
      window.location.href = '/login.html';
    };
    
    loadData();
  </script>
</body>
</html>
