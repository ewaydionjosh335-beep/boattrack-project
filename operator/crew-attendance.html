<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Crew Attendance - BoatTrack Operator</title>
  <link rel="stylesheet" href="/css/tokens.css">
  <link rel="stylesheet" href="/css/base.css">
  <link rel="stylesheet" href="/css/components.css">
  <link rel="stylesheet" href="/css/layout.css">
</head>
<body class="admin-layout">

  <aside class="admin-sidebar">
    <div class="sidebar-header">
      <span style="display: flex; align-items: center; gap: 0.5rem;">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M2 21c.6.5 1.2 1 2.5 1 2.5 0 2.5-2 5-2 1.3 0 1.9.5 2.5 1 .6.5 1.2 1 2.5 1 2.5 0 2.5-2 5-2 1.3 0 1.9.5 2.5 1"/><path d="M19.38 20A11.6 11.6 0 0 0 21 14l-9-4-9 4c0 2.3.6 4.5 1.62 6"/><path d="M12 10V4l3 2-3 2"/></svg>
        Boat Operator
      </span>
    </div>
    <div class="sidebar-menu">
      <a href="/operator/dashboard.html"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M3 9h18"/><path d="M9 21V9"/></svg> Dashboard</a>
      <a href="/operator/my-boats.html"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M2 21c.6.5 1.2 1 2.5 1 2.5 0 2.5-2 5-2 1.3 0 1.9.5 2.5 1 .6.5 1.2 1 2.5 1 2.5 0 2.5-2 5-2 1.3 0 1.9.5 2.5 1"/><path d="M19.38 20A11.6 11.6 0 0 0 21 14l-9-4-9 4c0 2.3.6 4.5 1.62 6"/><path d="M12 10V4l3 2-3 2"/></svg> My Boats</a>
      <a href="/operator/crew-applications.html"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg> Crew Applications</a>
      <a href="/operator/crew-list.html"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"/><rect x="8" y="2" width="8" height="4" rx="1" ry="1"/></svg> Crew List</a>
      <a href="/operator/crew-attendance.html" class="active"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg> Attendance</a>
      <a href="/operator/trips.html"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="1 6 1 22 8 18 16 22 23 18 23 2 16 6 8 2 1 6"/><line x1="8" y1="2" x2="8" y2="18"/><line x1="16" y1="6" x2="16" y2="22"/></svg> Trips</a>
      <a href="#" id="logoutBtn" style="color: var(--danger);"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg> Logout</a>
    </div>
  </aside>

  <div class="admin-main">
    <header class="admin-header">
      <h2>Crew Attendance</h2>
      <input type="date" id="datePicker" class="form-control" style="width: auto;">
    </header>

    <div class="admin-content">
      <div class="table-container">
        <table>
          <thead>
            <tr>
              <th>Name</th>
              <th>Boat</th>
              <th>Time In</th>
              <th>Time Out</th>
              <th>Status</th>
              <th>Actions</th>
            </tr>
          </thead>
          <tbody id="attendanceTableBody">
            <tr><td colspan="6" style="text-align: center;">Loading attendance...</td></tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>

  <script type="module">
    import { api } from '/js/api.js';
    import { auth } from '/js/auth.js';
    import { ui } from '/js/ui.js';

    const session = await auth.requireAuth(['boat_operator']);
    const datePicker = document.getElementById('datePicker');
    datePicker.valueAsDate = new Date();
    
    async function loadData() {
        const date = datePicker.value;
        const allBoats = await api.boats.list();
        const myBoats = allBoats.filter(b => b.operator_id === session.user_id);
        const myBoatIds = myBoats.map(b => b.id);
        
        const allCrew = await api.crewMembers.list();
        const myCrew = allCrew.filter(c => myBoatIds.includes(c.boat_id) && c.status === 'Active');
        
        const allAttendance = await api.crewAttendance.list();
        
        const tbody = document.getElementById('attendanceTableBody');
        if (myCrew.length === 0) {
            tbody.innerHTML = '<tr><td colspan="6" style="text-align: center;">No active crew members found.</td></tr>';
            return;
        }

        tbody.innerHTML = myCrew.map(c => {
            const att = allAttendance.find(a => a.crew_member_id === c.id && a.date === date) || {};
            return `
                <tr>
                    <td><strong>${c.full_name}</strong></td>
                    <td>${myBoats.find(b=>b.id===c.boat_id)?.name || 'N/A'}</td>
                    <td><input type="time" value="${att.time_in || ''}" class="form-control" style="max-width: 140px;" onchange="window.updateAtt('${att.id || ''}', '${c.id}', '${date}', 'time_in', this.value)"></td>
                    <td><input type="time" value="${att.time_out || ''}" class="form-control" style="max-width: 140px;" onchange="window.updateAtt('${att.id || ''}', '${c.id}', '${date}', 'time_out', this.value)"></td>
                    <td><span class="badge ${att.status ? 'badge-active' : ''}">${att.status || 'Not yet in'}</span></td>
                    <td>
                      <div class="table-actions">
                        ${!att.time_in ? `<button class="btn btn-sm btn-primary" onclick="window.stamp('${c.id}', '${date}', 'time_in')">Time In</button>` : 
                              !att.time_out ? `<button class="btn btn-sm btn-accent" onclick="window.stamp('${c.id}', '${date}', 'time_out')">Time Out</button>` : '<span style="font-size:0.85rem; color:var(--text-muted);">Completed</span>'}
                      </div>
                    </td>
                </tr>
            `;
        }).join('');
    }

    window.stamp = async (crew_member_id, date, field) => {
        const time = new Date().toLocaleTimeString('en-GB', { hour: '2-digit', minute: '2-digit' });
        await api.crewAttendance.create({ crew_member_id, date, [field]: time, status: field === 'time_in' ? 'Timed in' : 'Completed' });
        ui.showToast(`Crew member ${field === 'time_in' ? 'timed in' : 'timed out'}.`, 'success');
        await loadData();
    };

    window.updateAtt = async (id, crew_member_id, date, field, value) => {
        if (id) await api.crewAttendance.update(id, { [field]: value });
        else await api.crewAttendance.create({ crew_member_id, date, [field]: value });
        ui.showToast('Attendance updated.', 'success');
        await loadData();
    };

    datePicker.onchange = loadData;

    document.getElementById('logoutBtn').onclick = async (e) => {
      e.preventDefault();
      await api.auth.logout();
      window.location.href = '/login.html';
    };
    
    loadData();
  </script>
</body>
</html>
