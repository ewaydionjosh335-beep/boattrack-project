<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Crew Verification - BoatTrack Admin</title>
    <link rel="stylesheet" href="/css/tokens.css" />
    <link rel="stylesheet" href="/css/base.css" />
    <link rel="stylesheet" href="/css/components.css" />
    <link rel="stylesheet" href="/css/layout.css" />
  </head>
  <body class="admin-layout">
    <!-- SIDEBAR -->
    <div id="sidebarContainer"></div>

    <!-- MAIN -->
    <div class="admin-main">
      <header class="admin-header">
        <h2>Crew Verification & Account Provisioning</h2>
        <div class="header-filters">
          <input
            type="text"
            id="searchInput"
            class="form-control filter-input"
            placeholder="Search name or contact..."
          />
          <select id="stageFilter" class="form-control filter-input">
            <option value="">All Stages</option>
            <option value="Pending Admin Verification" selected>
              Pending Admin Verification
            </option>
            <option value="Accepted">Accepted & Verified</option>
            <option value="Rejected">Rejected</option>
          </select>
        </div>
      </header>

      <div class="admin-content">
        <div class="table-container">
          <table>
            <thead>
              <tr>
                <th>Applicant Name</th>
                <th>Contact</th>
                <th>Boat</th>
                <th>Stage</th>
                <th>Submitted Date</th>
                <th>Actions</th>
              </tr>
            </thead>
            <tbody id="crewAppTableBody">
              <tr>
                <td colspan="6" class="table-message">
                  Loading crew applications...
                </td>
              </tr>
            </tbody>
          </table>
        </div>
        <div id="paginationContainer"></div>
      </div>
    </div>

    <!-- VERIFICATION MODAL -->
    <div id="verifyCrewModal" class="modal-backdrop">
      <div class="modal">
        <div class="modal-header">
          <h3 id="modalTitle">Verify &amp; Provision Crew Account</h3>
          <button type="button" class="modal-close" id="closeCrewModalBtn" aria-label="Close">&times;</button>
        </div>
        <form id="verifyCrewForm">
          <div class="modal-body">
            <input type="hidden" id="modalAppId" />
            <p
              id="modalAppInfo"
              style="
                margin-bottom: 1rem;
                color: var(--text-muted);
                font-size: 0.9rem;
              "
            ></p>

            <div class="form-group">
              <label class="form-label"
                >Crew Email (Login ID)
                <span class="generated-badge">Generated</span></label
              >
              <input
                type="email"
                id="crewEmail"
                class="form-control"
                required
              />
            </div>
            <div class="form-group">
              <label class="form-label"
                >Username
                <span class="generated-badge">Generated</span></label
              >
              <input
                type="text"
                id="crewUsername"
                class="form-control"
                required
              />
            </div>
            <div class="form-group">
              <label class="form-label">Assigned Role</label>
              <select id="crewRole" class="form-control">
                <option value="Crew" selected>Crew</option>
                <option value="Captain">Captain</option>
                <option value="Deckhand">Deckhand</option>
              </select>
            </div>
            <div class="form-group">
              <label class="form-label"
                >Initial Password
                <span class="generated-badge">Generated</span></label
              >
              <div class="password-field-row">
                <div class="password-field">
                  <input
                    type="password"
                    id="crewPassword"
                    class="form-control"
                    minlength="8"
                    autocomplete="new-password"
                    required
                  />
                  <button
                    type="button"
                    class="password-toggle"
                    id="crewPassToggle"
                    aria-label="Show password"
                  >
                    <svg
                      width="18"
                      height="18"
                      viewBox="0 0 24 24"
                      fill="none"
                      stroke="currentColor"
                      stroke-width="2"
                      aria-hidden="true"
                    >
                      <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z" />
                      <circle cx="12" cy="12" r="3" />
                    </svg>
                  </button>
                </div>
                <button
                  type="button"
                  class="btn btn-outline btn-sm"
                  id="copyPasswordBtn"
                  aria-label="Copy temporary password"
                >
                  <svg
                    width="14"
                    height="14"
                    viewBox="0 0 24 24"
                    fill="none"
                    stroke="currentColor"
                    stroke-width="2"
                    aria-hidden="true"
                  >
                    <rect x="9" y="9" width="13" height="13" rx="2" />
                    <path
                      d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"
                    />
                  </svg>
                  Copy
                </button>
              </div>
              <div id="passwordValidation" class="validation-message hidden"></div>
              <small class="form-hint"
                >Share this temporary password with the crew member; they will
                be required to change it on first login.</small
              >
            </div>
          </div>
          <div class="modal-footer">
            <button
              type="button"
              class="btn btn-outline"
              id="cancelCrewModalBtn"
            >
              Cancel
            </button>
            <button type="submit" class="btn btn-primary">
              Verify & Create Account
            </button>
          </div>
        </form>
      </div>
    </div>

    <script type="module">
      import { api } from "/js/api.js";
      import { auth } from "/js/auth.js";
      import { ui } from "/js/ui.js";
      import { AdminSidebar } from "/admin/_sidebar.js";
      import { initAdminPage } from "/admin/init.js";
      import { refreshSosBadge } from "/js/utils/sosBadge.js";
      import {
        paginate,
        renderPagination,
        updatePagination,
        initPagination,
        createTableFilter,
        filterTable,
        setupTableFilters,
        handleApiError,
        handleApiSuccess,
        setupPasswordToggle,
        generateTempPassword,
      } from "/admin/common.js";

      const session = await initAdminPage({ activePage: "crew-verification" });

      let apps = [];
      let boats = [];
      let currentPage = 1;
      const pageSize = 25;

      // Create standardized filter function
      const crewFilter = createTableFilter({
        searchFields: ["full_name", "contact"],
        exactFilters: [
          { field: "stage", value: "stageFilter" },
        ],
      });

      async function loadData() {
        apps = await api.crewApplications.list();
        boats = await api.boats.list();
        render();
        await refreshSosBadge();
      }

      function render() {
        const tbody = document.getElementById("crewAppTableBody");
        const filters = {
          search: document.getElementById("searchInput").value,
          stageFilter: document.getElementById("stageFilter").value,
        };

        const filtered = filterTable(apps, filters, crewFilter);

        const pagination = paginate(filtered, currentPage, pageSize);

        if (pagination.items.length === 0) {
          tbody.innerHTML =
            '<tr><td colspan="6" class="table-message">No crew applications found.</td></tr>';
        } else {
          tbody.innerHTML = pagination.items
            .map((a) => {
              const boat = boats.find((b) => b.id === a.boat_id) || {
                name: "N/A",
              };
              const canVerify = a.stage === "Pending Admin Verification";
              const canReset = a.stage === "Rejected";
              return `
            <tr>
              <td><strong>${ui.escapeHtml(a.full_name)}</strong></td>
              <td>${ui.escapeHtml(a.contact || "N/A")}</td>
              <td>${ui.escapeHtml(boat.name)}</td>
              <td><span class="badge badge-pending">${ui.escapeHtml(a.stage)}</span></td>
              <td>${new Date(a.created_at).toLocaleDateString()}</td>
              <td>
                <div class="table-actions">
                  ${
                    canVerify
                      ? `
                    <button class="btn btn-primary btn-sm" data-action="verify" data-id="${a.id}">Verify & Provision</button>
                    <button class="btn btn-danger btn-sm" data-action="reject" data-id="${a.id}">Reject</button>
                  `
                      : `
                    <span style="font-size:0.85rem; color:var(--text-muted);">${ui.escapeHtml(a.stage)}</span>
                    ${canReset ? `<button class="btn btn-sm btn-outline" data-action="reset" data-id="${a.id}">Reset to Pending</button>` : ""}
                  `
                  }
                </div>
              </td>
            </tr>
          `;
            })
            .join("");
        }

        // Update pagination controls in-place
        updatePagination("#paginationContainer", pagination);
      }

      initPagination("#paginationContainer", (page) => {
        currentPage = page;
        render();
      });

      // Use standardized filter event setup
      setupTableFilters({
        searchInput: document.getElementById("searchInput"),
        filterSelects: [document.getElementById("stageFilter")],
        renderTable: render,
      });

      const modal = document.getElementById("verifyCrewModal");
      const { open: openModal, close: closeModal } = ui.modal(modal);
      const crewPassInput = document.getElementById("crewPassword");
      const crewPassValidation = document.getElementById("passwordValidation");
      const crewPassToggle = document.getElementById("crewPassToggle");

      document.getElementById("cancelCrewModalBtn").onclick = closeModal;
      document.getElementById("closeCrewModalBtn").onclick = closeModal;

      const openVerifyModal = async (id) => {
        const app = apps.find((a) => a.id === id);
        if (!app) return;
        if (app.stage !== "Pending Admin Verification") {
          handleApiError(new Error("Application is not awaiting admin verification."), { toast: true });
          return;
        }
        const boat = boats.find((b) => b.id === app.boat_id) || { name: "N/A" };

        document.getElementById("modalAppId").value = app.id;
        document.getElementById("modalAppInfo").textContent =
          `Reviewing application for ${app.full_name} on vessel "${boat.name}". Approving will create an active crew account and assign them to this vessel.`;

        // Generate collision-resistant credentials; the API re-checks uniqueness on submit.
        const uniqueEmail = await api.users.generateUniqueEmail(app.full_name);
        document.getElementById("crewEmail").value = uniqueEmail;
        const uniqueUsername = await api.users.generateUniqueUsername(
          app.full_name,
        );
        document.getElementById("crewUsername").value = uniqueUsername;
        crewPassInput.value = generateTempPassword();
        crewPassInput.type = "password";
        crewPassValidation.textContent = "";
        crewPassValidation.classList.add("hidden");
        crewPassValidation.classList.remove("ok", "error");

        openModal();
      };

      // Real-time password validation for crew modal
      function crewPasswordIssue(value) {
        if (value.length < 8) return "Password must be at least 8 characters.";
        if (
          !/[a-zA-Z]/.test(value) ||
          !/[0-9]/.test(value) ||
          !/[!@#$%^&*]/.test(value)
        ) {
          return "Password must be 8+ chars with a letter, a number, and a symbol.";
        }
        return "";
      }

      function validateCrewPassword() {
        const val = crewPassInput.value;
        crewPassValidation.classList.toggle("hidden", !val);
        if (!val) return;
        const issue = crewPasswordIssue(val);
        crewPassValidation.textContent = issue;
        crewPassValidation.classList.toggle("ok", !issue);
        crewPassValidation.classList.toggle("error", !!issue);
      }
      crewPassInput.addEventListener("input", validateCrewPassword);
      setupPasswordToggle(crewPassInput, crewPassToggle);

      document.getElementById("copyPasswordBtn").onclick = async () => {
        try {
          await navigator.clipboard.writeText(crewPassInput.value);
          handleApiSuccess("Temporary password copied.");
        } catch (err) {
          handleApiError(err, {
            fallbackMessage: "Could not copy the password.",
          });
        }
      };

      document.getElementById("verifyCrewForm").onsubmit = async (e) => {
        e.preventDefault();
        const id = document.getElementById("modalAppId").value;
        const email = document.getElementById("crewEmail").value.trim();
        const username = document.getElementById("crewUsername").value.trim();
        const role = document.getElementById("crewRole").value;
        const password = document.getElementById("crewPassword").value;
        const passIssue = crewPasswordIssue(password);
        if (passIssue) {
          handleApiError(new Error(passIssue), { toast: true });
          return;
        }

        const submitBtn = document
          .getElementById("verifyCrewForm")
          .querySelector('button[type="submit"]');
        const originalText = submitBtn.textContent;
        submitBtn.disabled = true;
        submitBtn.textContent = "Checking availability...";

        try {
          const app = apps.find((a) => a.id === id);
          const applicantUserId = app?.applicant_user_id || null;
          const existingUsers = await api.users.list();
          if (
            existingUsers.some(
              (u) => u.id !== applicantUserId && u.email === email,
            )
          ) {
            throw new Error("Email is already in use.");
          }
          if (
            existingUsers.some(
              (u) => u.id !== applicantUserId && u.username === username,
            )
          ) {
            throw new Error("Username is already in use.");
          }

          submitBtn.textContent = "Provisioning...";
          await api.crewApplications.verifyAndProvision(id, {
            email,
            username,
            role,
            password,
          });
          closeModal();
          handleApiSuccess("Crew verified and account successfully provisioned!");
          await loadData();
        } catch (err) {
          handleApiError(err);
        } finally {
          submitBtn.disabled = false;
          submitBtn.textContent = originalText;
        }
      };

      const rejectApp = async (id) => {
        ui.confirm(
          "Are you sure you want to reject this crew application?",
          async () => {
            try {
              await api.crewApplications.decide(id, "Rejected");
              handleApiSuccess("Crew application rejected.", { toast: true });
              await loadData();
            } catch (err) {
              handleApiError(err);
            }
          },
        );
      };

      const resetApp = async (id) => {
        ui.confirm(
          "Reset this application to Pending Admin Verification?",
          async () => {
            try {
              await api.crewApplications.update(
                id,
                { stage: "Pending Admin Verification", decided_at: null },
              );
              handleApiSuccess("Crew application reset to pending verification.", { toast: true });
              await loadData();
            } catch (err) {
              handleApiError(err);
            }
          },
        );
      };

      document.getElementById("crewAppTableBody").onclick = (e) => {
        const btn = e.target.closest("button[data-action]");
        if (!btn) return;
        if (btn.dataset.action === "verify")
          openVerifyModal(btn.dataset.id);
        else if (btn.dataset.action === "reject")
          rejectApp(btn.dataset.id);
        else if (btn.dataset.action === "reset")
          resetApp(btn.dataset.id);
      };

      loadData();
    </script>
  </body>
</html>
