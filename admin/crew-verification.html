<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Crew Verification - BoatTrack Admin</title>
    <link rel="stylesheet" href="/css/tokens.css" />
    <link rel="stylesheet" href="/css/base.css" />
    <link rel="stylesheet" href="/css/components.css" />
    <link rel="stylesheet" href="/css/layout.css" />
  </head>
  <body class="admin-layout">
    <!-- SIDEBAR -->
    <div id="sidebarContainer"></div>

    <!-- MAIN -->
    <div class="admin-main">
      <header class="admin-header">
        <h2>Crew Verification & Account Provisioning</h2>
        <div style="display: flex; gap: 1rem; align-items: center">
          <input
            type="text"
            id="searchInput"
            class="form-control"
            placeholder="Search name or contact..."
            style="width: 250px"
          />
          <select id="stageFilter" class="form-control" style="width: 220px">
            <option value="">All Stages</option>
            <option value="Pending Admin Verification" selected>
              Pending Admin Verification
            </option>
            <option value="Accepted">Accepted & Verified</option>
            <option value="Rejected">Rejected</option>
          </select>
        </div>
      </header>

      <div class="admin-content">
        <div class="table-container">
          <table>
            <thead>
              <tr>
                <th>Applicant Name</th>
                <th>Contact</th>
                <th>Boat</th>
                <th>Stage</th>
                <th>Submitted Date</th>
                <th>Actions</th>
              </tr>
            </thead>
            <tbody id="crewAppTableBody">
              <tr>
                <td colspan="6" style="text-align: center">
                  Loading crew applications...
                </td>
              </tr>
            </tbody>
          </table>
        </div>
        <div id="paginationContainer" style="margin-top: 1rem"></div>
      </div>
    </div>

    <!-- VERIFICATION MODAL -->
    <div id="verifyCrewModal" class="modal-backdrop" style="display: none">
      <div class="modal" style="max-width: 500px">
        <div class="modal-header">
          <h3 id="modalTitle">Verify & Provision Crew Account</h3>
        </div>
        <form id="verifyCrewForm">
          <div class="modal-body">
            <input type="hidden" id="modalAppId" />
            <p
              id="modalAppInfo"
              style="
                margin-bottom: 1rem;
                color: var(--text-muted);
                font-size: 0.9rem;
              "
            ></p>

            <div class="form-group">
              <label class="form-label">Crew Email (Login ID)</label>
              <input
                type="email"
                id="crewEmail"
                class="form-control"
                required
              />
            </div>
            <div class="form-group">
              <label class="form-label">Username</label>
              <input
                type="text"
                id="crewUsername"
                class="form-control"
                required
              />
            </div>
            <div class="form-group">
              <label class="form-label">Assigned Role</label>
              <select id="crewRole" class="form-control">
                <option value="Crew" selected>Crew</option>
                <option value="Captain">Captain</option>
                <option value="Deckhand">Deckhand</option>
              </select>
            </div>
            <div class="form-group">
              <label class="form-label">Initial Password <span style="color: var(--danger); font-weight: bold;">*</span></label>
              <input
                type="text"
                id="crewPassword"
                class="form-control"
                minlength="8"
                autocomplete="new-password"
                required
              />
              <div id="passwordValidation" style="font-size: 0.75rem; margin-top: 0.35rem; display: none;"></div>
              <small style="color: var(--text-muted)"
                >Share this temporary password with the crew member; they will
                be required to change it on first login.</small
              >
            </div>
          </div>
          <div class="modal-footer">
            <button
              type="button"
              class="btn btn-outline"
              id="cancelCrewModalBtn"
            >
              Cancel
            </button>
            <button type="submit" class="btn btn-primary">
              Verify & Create Account
            </button>
          </div>
        </form>
      </div>
    </div>

    <script type="module">
      import { api } from "/js/api.js";
      import { auth } from "/js/auth.js";
      import { ui } from "/js/ui.js";
      import { AdminSidebar } from "/admin/_sidebar.js";
      import { initAdminPage } from "/admin/init.js";
      import { ensureCSRFToken } from "/js/api.js";
      import { refreshSosBadge } from "/js/utils/sosBadge.js";
      import {
        paginate,
        renderPagination,
        updatePagination,
        initPagination,
        createTableFilter,
        filterTable,
        setupTableFilters,
        handleApiError,
        handleApiSuccess,
      } from "/admin/common.js";

      const session = await initAdminPage({ activePage: "crew-verification" });
      const csrfToken = ensureCSRFToken();

      let apps = [];
      let boats = [];
      let currentPage = 1;
      const pageSize = 25;

      // Create standardized filter function
      const crewFilter = createTableFilter({
        searchFields: ["full_name", "contact"],
        exactFilters: [
          { field: "stage", value: "stageFilter" },
        ],
      });

      async function loadData() {
        apps = await api.crewApplications.list();
        boats = await api.boats.list();
        render();
        await refreshSosBadge();
      }

      function render() {
        const tbody = document.getElementById("crewAppTableBody");
        const filters = {
          search: document.getElementById("searchInput").value,
          stageFilter: document.getElementById("stageFilter").value,
        };

        const filtered = filterTable(apps, filters, crewFilter);

        const pagination = paginate(filtered, currentPage, pageSize);

        if (pagination.items.length === 0) {
          tbody.innerHTML =
            '<tr><td colspan="6" style="text-align: center;">No crew applications found.</td></tr>';
        } else {
          tbody.innerHTML = pagination.items
            .map((a) => {
              const boat = boats.find((b) => b.id === a.boat_id) || {
                name: "N/A",
              };
              const canVerify = a.stage === "Pending Admin Verification";
              return `
            <tr>
              <td><strong>${ui.escapeHtml(a.full_name)}</strong></td>
              <td>${ui.escapeHtml(a.contact || "N/A")}</td>
              <td>${ui.escapeHtml(boat.name)}</td>
              <td><span class="badge badge-pending">${ui.escapeHtml(a.stage)}</span></td>
              <td>${new Date(a.created_at).toLocaleDateString()}</td>
              <td>
                <div class="table-actions">
                  ${
                    canVerify
                      ? `
                    <button class="btn btn-sm btn-primary" data-action="verify" data-id="${a.id}">Verify & Provision</button>
                    <button class="btn btn-sm btn-outline" style="color: var(--danger); border-color: var(--danger);" data-action="reject" data-id="${a.id}">Reject</button>
                  `
                      : `<span style="font-size:0.85rem; color:var(--text-muted);">${ui.escapeHtml(a.stage)}</span>`
                  }
                </div>
              </td>
            </tr>
          `;
            })
            .join("");
        }

        // Update pagination controls in-place
        updatePagination("#paginationContainer", pagination);
      }

      initPagination("#paginationContainer", (page) => {
        currentPage = page;
        render();
      });

      // Use standardized filter event setup
      setupTableFilters({
        searchInput: document.getElementById("searchInput"),
        filterSelects: [document.getElementById("stageFilter")],
        renderTable: render,
      });

      const modal = document.getElementById("verifyCrewModal");
      const { open: openModal, close: closeModal } = ui.modal(modal);

      // Strong-ish temporary password; the crew member must change it on first login.
      function generateTempPassword() {
        const upper = "ABCDEFGHJKLMNPQRSTUVWXYZ";
        const lower = "abcdefghijkmnopqrstuvwxyz";
        const digits = "23456789";
        const symbols = "!@#$%^&*";
        const all = upper + lower + digits + symbols;
        const bytes = crypto.getRandomValues(new Uint8Array(16));
        let p = Array.from(bytes, (b) => all[b % all.length]).join("");
        if (!/[A-Z]/.test(p)) p = upper[0] + p.slice(1);
        if (!/[a-z]/.test(p)) p = lower[0] + p.slice(1);
        if (!/[0-9]/.test(p)) p = digits[0] + p.slice(1);
        if (!/[!@#$%^&*]/.test(p)) p = symbols[0] + p.slice(1);
        return p;
      }
      document.getElementById("cancelCrewModalBtn").onclick = closeModal;

      const openVerifyModal = async (id) => {
        const app = apps.find((a) => a.id === id);
        if (!app) return;
        if (app.stage !== "Pending Admin Verification") {
          handleApiError("Application is not awaiting admin verification.", { toast: true });
          return;
        }
        const boat = boats.find((b) => b.id === app.boat_id) || { name: "N/A" };

        document.getElementById("modalAppId").value = app.id;
        document.getElementById("modalAppInfo").textContent =
          `Reviewing application for ${app.full_name} on vessel "${boat.name}". Approving will create an active crew account and assign them to this vessel.`;

        // Generate unique email using atomic API call to avoid race conditions
        const uniqueEmail = await api.users.generateUniqueEmail(app.full_name);
        document.getElementById("crewEmail").value = uniqueEmail;
        const uniqueUsername = await api.users.generateUniqueUsername(
          app.full_name,
        );
        document.getElementById("crewUsername").value = uniqueUsername;
        document.getElementById("crewPassword").value = generateTempPassword();
        document.getElementById("passwordValidation").style.display = "none";

        openModal();
      };

      // Real-time password validation for crew modal
      const crewPassInput = document.getElementById("crewPassword");
      const crewPassValidation = document.getElementById("passwordValidation");
      function validateCrewPassword() {
        const val = crewPassInput.value;
        crewPassValidation.style.display = val ? "block" : "none";
        if (!val) return;
        let ok = true;
        let msg = "";
        if (val.length < 8) {
          ok = false;
          msg = "Password must be at least 8 characters.";
        } else if (!/[a-zA-Z]/.test(val) || !/[0-9]/.test(val)) {
          ok = false;
          msg = "Password must be 8+ chars with a letter and a number.";
        }
        crewPassValidation.textContent = msg;
        crewPassValidation.style.color = ok ? "var(--success)" : "var(--danger)";
      }
      crewPassInput.addEventListener("input", validateCrewPassword);

      document.getElementById("verifyCrewForm").onsubmit = async (e) => {
        e.preventDefault();
        const id = document.getElementById("modalAppId").value;
        const email = document.getElementById("crewEmail").value.trim();
        const username = document.getElementById("crewUsername").value.trim();
        const role = document.getElementById("crewRole").value;
        const password = document.getElementById("crewPassword").value;
        if (
          password.length < 8 ||
          !/[a-zA-Z]/.test(password) ||
          !/[0-9]/.test(password)
        ) {
          handleApiError("Initial password must be at least 8 characters and contain a letter and a number.", { toast: true });
          return;
        }

        const submitBtn = document
          .getElementById("verifyCrewForm")
          .querySelector('button[type="submit"]');
        const originalText = submitBtn.textContent;
        submitBtn.disabled = true;
        submitBtn.textContent = "Provisioning...";

        try {
          await api.crewApplications.verifyAndProvision(id, {
            email,
            username,
            role,
            password,
          }, csrfToken);
          closeModal();
          handleApiSuccess("Crew verified and account successfully provisioned!");
          await loadData();
        } catch (err) {
          handleApiError(err);
        } finally {
          submitBtn.disabled = false;
          submitBtn.textContent = originalText;
        }
      };

      const rejectApp = async (id) => {
        ui.confirm(
          "Are you sure you want to reject this crew application?",
          async () => {
            try {
              await api.crewApplications.decide(id, "Rejected", csrfToken);
              handleApiSuccess("Crew application rejected.", { toast: true });
              await loadData();
            } catch (err) {
              handleApiError(err);
            }
          },
        );
      };

      document.getElementById("crewAppTableBody").onclick = (e) => {
        const btn = e.target.closest("button[data-action]");
        if (!btn) return;
        if (btn.dataset.action === "verify")
          openVerifyModal(btn.dataset.id);
        else if (btn.dataset.action === "reject")
          rejectApp(btn.dataset.id);
      };

      loadData();
    </script>
  </body>
</html>
