<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Approved Bookings - BoatTrack Admin</title>
    <link rel="stylesheet" href="/css/tokens.css" />
    <link rel="stylesheet" href="/css/base.css" />
    <link rel="stylesheet" href="/css/components.css" />
    <link rel="stylesheet" href="/css/layout.css" />
  </head>
  <body class="admin-layout">
    <!-- SIDEBAR -->
    <div id="sidebarContainer"></div>

    <!-- MAIN -->
    <div class="admin-main">
      <header class="admin-header">
        <h2>Approved Booking & E-Ticket Records</h2>
        <button id="exportCsvBtn" class="btn btn-primary">
          Export CSV
        </button>
      </header>

      <div class="admin-content">
        <div class="card filter-card">
          <div class="filter-row">
            <input
              type="text"
              id="searchInput"
              class="form-control"
              placeholder="Search passenger..."
            />
            <select id="typeFilter" class="form-control">
              <option value="">All Types</option>
              <option value="Passenger">Passenger</option>
              <option value="Cargo">Cargo</option>
            </select>
            <div>
              <label for="dateFilter" class="sr-only">Date</label>
              <input type="date" id="dateFilter" class="form-control" />
            </div>
          </div>
        </div>

        <div class="table-container">
          <table>
            <thead>
              <tr>
                <th>Passenger</th>
                <th>Type</th>
                <th>Pax Count / Cargo Wt</th>
                <th>E-Ticket / Ref</th>
                <th>Status</th>
                <th>Created At</th>
              </tr>
            </thead>
            <tbody id="bookingsTableBody">
              <tr>
                <td colspan="6" class="table-message">
                  Loading bookings...
                </td>
              </tr>
            </tbody>
          </table>
        </div>
        <div id="paginationContainer"></div>
      </div>
    </div>

    <script type="module">
      import { api } from "/js/api.js";
      import { auth } from "/js/auth.js";
      import { ui } from "/js/ui.js";
      import { AdminSidebar } from "/admin/_sidebar.js";
      import { initAdminPage } from "/admin/init.js";
      import {
        exportToCSV,
        uiLocalDateStr,
        paginate,
        renderPagination,
        updatePagination,
        initPagination,
        createTableFilter,
        filterTable,
        setupTableFilters,
        handleApiError,
        handleApiSuccess,
        setupButtonLoading,
      } from "/admin/common.js";
      import { refreshSosBadge } from "/js/utils/sosBadge.js";

      const session = await initAdminPage({ activePage: "bookings" });

      let allBookings = [];
      let allPassengers = [];
      let allEtickets = [];
      let allPayments = [];

      async function loadData() {
        allBookings = await api.bookings.list();
        allPassengers = await api.passengers.list();
        allEtickets = await api.etickets.list();
        allPayments = await api.payments.list();
        renderTable();
        await refreshSosBadge();
      }

      // Compare against the PHT operational date shown in the table.
      const toDateKey = (value) => uiLocalDateStr(value);

      let currentPage = 1;
      const pageSize = 25;

      // Create standardized filter function
      const bookingFilter = createTableFilter({
        searchFields: [], // Custom search logic needed (searches passenger name + booking ID)
        exactFilters: [
          { field: "booking_type", value: "typeFilter" },
        ],
      });

      function getFilteredBookings() {
        const search = document
          .getElementById("searchInput")
          .value.toLowerCase();
        const typeFilter = document.getElementById("typeFilter").value;
        const dateFilter = document.getElementById("dateFilter").value;

        // First apply standard filters
        const filters = { search: "", typeFilter };
        let filtered = filterTable(allBookings, filters, (item, f) => {
          if (!api.bookings.isApproved(item)) return false;
          if (f.typeFilter && item.booking_type !== f.typeFilter) return false;
          if (dateFilter && toDateKey(item.created_at) !== dateFilter)
            return false;
          return true;
        });

        // Then apply custom search (passenger name + booking ID)
        if (search) {
          filtered = filtered.filter((b) => {
            const psg = allPassengers.find((p) => p.id === b.passenger_id) || {
              full_name: "",
            };
            return (
              psg.full_name.toLowerCase().includes(search) ||
              b.id.toLowerCase().includes(search)
            );
          });
        }

        return filtered;
      }

      // Pick the highest-priority payment for a booking: Paid > Refunded > Pending > Failed.
      function getPaymentStatus(bookingId) {
        const statusPriority = { Paid: 4, Refunded: 3, Pending: 2, Failed: 1 };
        return allPayments
          .filter((p) => p.booking_id === bookingId)
          .reduce((best, p) => {
            const priority = statusPriority[p.status] || 0;
            const bestPriority = best ? statusPriority[best.status] || 0 : -1;
            return priority > bestPriority ? p : best;
          }, null);
      }

      function renderTable() {
        const filtered = getFilteredBookings();
        const pagination = paginate(filtered, currentPage, pageSize);

        const tbody = document.getElementById("bookingsTableBody");
        if (pagination.items.length === 0) {
          tbody.innerHTML =
            '<tr><td colspan="6" class="table-message">No approved bookings found.</td></tr>';
        } else {
          tbody.innerHTML = pagination.items
            .map((b) => {
              const psg = allPassengers.find(
                (p) => p.id === b.passenger_id,
              ) || { full_name: "Unknown" };
              const etk = allEtickets.find((e) => e.booking_id === b.id) || {
                ticket_no: "None",
                gcash_ref: "N/A",
              };
              // Prefer the highest-priority payment; a later failed retry must not hide it.
              const pay = getPaymentStatus(b.id);
              const payStatus = pay ? pay.status : "Pending";
              const gcashRef =
                pay && pay.reference_no
                  ? pay.reference_no
                  : etk.gcash_ref || "N/A";

              return `
            <tr>
              <td><strong>${ui.escapeHtml(psg.full_name)}</strong><br><small class="text-muted text-xs">${ui.escapeHtml(b.id)}</small></td>
              <td><span class="badge badge-neutral">${ui.escapeHtml(b.booking_type)}</span></td>
              <td>${b.booking_type === "Passenger" ? `${ui.escapeHtml(b.passenger_count)} pax` : `${ui.escapeHtml(b.cargo_weight_kg)} kg`}</td>
              <td>
                <div class="ticket-info">
                  <div class="ticket-no">E-Ticket: <strong>${ui.escapeHtml(etk.ticket_no)}</strong></div>
                  <div class="ticket-ref">Ref: ${ui.escapeHtml(gcashRef)}</div>
                </div>
              </td>
              <td>
                <div class="badge-group">
                  <span class="badge badge-active">Approved</span>
                  <span class="badge ${payStatus === "Paid" ? "badge-active" : "badge-pending"}">Pay: ${ui.escapeHtml(payStatus)}</span>
                </div>
              </td>
              <td>${uiLocalDateStr(b.created_at)}</td>
            </tr>
          `;
            })
            .join("");
        }

        // Update pagination controls in-place
        updatePagination("#paginationContainer", pagination);
      }

      initPagination("#paginationContainer", (page) => {
        currentPage = page;
        renderTable();
      });

      // Use standardized filter event setup (with custom renderTable)
      setupTableFilters({
        searchInput: document.getElementById("searchInput"),
        filterSelects: [
          document.getElementById("typeFilter"),
          document.getElementById("dateFilter"),
        ],
        renderTable: renderTable,
      });

      document.getElementById("exportCsvBtn").onclick = async () => {
        const btn = document.getElementById("exportCsvBtn");
        const approved = getFilteredBookings();
        if (!approved.length) {
          ui.showToast("No approved bookings to export.", "warning");
          return;
        }
        const resetBtn = setupButtonLoading(btn, "Exporting...");
        // Yield a task so the spinner paints before the synchronous CSV build.
        await new Promise((resolve) => setTimeout(resolve, 0));
        try {
          const rows = approved.map((b) => {
            const psg = allPassengers.find((p) => p.id === b.passenger_id) || {};
            const etk = allEtickets.find((e) => e.booking_id === b.id) || {};
            // Match the table: use the same highest-priority payment record.
            const pay = getPaymentStatus(b.id);
            return {
              booking_id: b.id,
              passenger_name: psg.full_name || "Unknown",
              booking_type: b.booking_type,
              passenger_count: b.passenger_count,
              cargo_weight_kg: b.cargo_weight_kg,
              ticket_no: etk.ticket_no || "",
              gcash_ref: (pay && pay.reference_no) || etk.gcash_ref || "",
              status: b.status,
              created_at: b.created_at,
            };
          });
          exportToCSV("approved_bookings.csv", rows);
        } finally {
          resetBtn();
        }
      };

      loadData();
    </script>
  </body>
</html>
