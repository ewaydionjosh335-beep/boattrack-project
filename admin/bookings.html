<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Approved Bookings - BoatTrack Admin</title>
    <link rel="stylesheet" href="/css/tokens.css" />
    <link rel="stylesheet" href="/css/base.css" />
    <link rel="stylesheet" href="/css/components.css" />
    <link rel="stylesheet" href="/css/layout.css" />
  </head>
  <body class="admin-layout">
    <!-- SIDEBAR -->
    <div id="sidebarContainer"></div>

    <!-- MAIN -->
    <div class="admin-main">
      <header class="admin-header">
        <h2>Approved Booking & E-Ticket Records</h2>
        <button id="exportCsvBtn" class="btn btn-primary btn-sm">
          Export CSV
        </button>
      </header>

      <div class="admin-content">
        <div class="card" style="margin-bottom: 1.5rem">
          <div
            style="
              display: grid;
              grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
              gap: 1rem;
            "
          >
            <input
              type="text"
              id="searchInput"
              class="form-control"
              placeholder="Search passenger..."
            />
            <select id="typeFilter" class="form-control">
              <option value="">All Types</option>
              <option value="Passenger">Passenger</option>
              <option value="Cargo">Cargo</option>
            </select>
            <input type="date" id="dateFilter" class="form-control" />
          </div>
        </div>

        <div class="table-container">
          <table>
            <thead>
              <tr>
                <th>Passenger</th>
                <th>Type</th>
                <th>Pax Count / Cargo Wt</th>
                <th>E-Ticket / Ref</th>
                <th>Status</th>
                <th>Created At</th>
              </tr>
            </thead>
            <tbody id="bookingsTableBody">
              <tr>
                <td colspan="6" style="text-align: center">
                  Loading bookings...
                </td>
              </tr>
            </tbody>
          </table>
        </div>
        <div id="paginationContainer" style="margin-top: 1rem"></div>
      </div>
    </div>

    <script type="module">
      import { api } from "/js/api.js";
      import { auth } from "/js/auth.js";
      import { ui } from "/js/ui.js";
      import { AdminSidebar } from "/admin/_sidebar.js";
      import { initAdminPage } from "/admin/init.js";
      import {
        exportToCSV,
        uiLocalDateStr,
        paginate,
        renderPagination,
        updatePagination,
        initPagination,
        createTableFilter,
        filterTable,
        setupTableFilters,
        handleApiError,
        handleApiSuccess,
      } from "/admin/common.js";
      import { refreshSosBadge } from "/js/utils/sosBadge.js";

      const session = await initAdminPage({ activePage: "bookings" });

      let allBookings = [];
      let allPassengers = [];
      let allEtickets = [];
      let allPayments = [];

      async function loadData() {
        allBookings = await api.bookings.list();
        allPassengers = await api.passengers.list();
        allEtickets = await api.etickets.list();
        allPayments = await api.payments.list();
        renderTable();
        await refreshSosBadge();
      }

      // Parse UTC ISO string to local date key (PHT = UTC+8) - use shared function
      const toLocalDateKey = (value) => uiLocalDateStr(value);

      let currentPage = 1;
      const pageSize = 25;

      // Create standardized filter function
      const bookingFilter = createTableFilter({
        searchFields: [], // Custom search logic needed (searches passenger name + booking ID)
        exactFilters: [
          { field: "booking_type", value: "typeFilter" },
        ],
      });

      function getFilteredBookings() {
        const search = document
          .getElementById("searchInput")
          .value.toLowerCase();
        const typeFilter = document.getElementById("typeFilter").value;
        const dateFilter = document.getElementById("dateFilter").value;

        // First apply standard filters
        const filters = { search: "", typeFilter };
        let filtered = filterTable(allBookings, filters, (item, f) => {
          if (!api.bookings.isApproved(item)) return false;
          if (f.typeFilter && item.booking_type !== f.typeFilter) return false;
          if (dateFilter && toLocalDateKey(item.created_at) !== dateFilter)
            return false;
          return true;
        });

        // Then apply custom search (passenger name + booking ID)
        if (search) {
          filtered = filtered.filter((b) => {
            const psg = allPassengers.find((p) => p.id === b.passenger_id) || {
              full_name: "",
            };
            return (
              psg.full_name.toLowerCase().includes(search) ||
              b.id.toLowerCase().includes(search)
            );
          });
        }

        return filtered;
      }

      function renderTable() {
        const filtered = getFilteredBookings();
        const pagination = paginate(filtered, currentPage, pageSize);

        const tbody = document.getElementById("bookingsTableBody");
        if (pagination.items.length === 0) {
          tbody.innerHTML =
            '<tr><td colspan="6" style="text-align: center;">No approved bookings found.</td></tr>';
        } else {
          tbody.innerHTML = pagination.items
            .map((b) => {
              const psg = allPassengers.find(
                (p) => p.id === b.passenger_id,
              ) || { full_name: "Unknown" };
              const etk = allEtickets.find((e) => e.booking_id === b.id) || {
                ticket_no: "None",
                gcash_ref: "N/A",
              };
              // Prefer a successful payment; a later failed retry must not hide it.
              const bookingPayments = allPayments
                .filter((p) => p.booking_id === b.id)
                .sort(
                  (a, b) => new Date(a.created_at) - new Date(b.created_at),
                );
              const pay =
                bookingPayments.find((p) => p.status === "Paid") ||
                bookingPayments[bookingPayments.length - 1];
              const payStatus = pay ? pay.status : "Pending";
              const gcashRef =
                pay && pay.reference_no
                  ? pay.reference_no
                  : etk.gcash_ref || "N/A";

              return `
            <tr>
              <td><strong>${ui.escapeHtml(psg.full_name)}</strong><br><small style="color:var(--text-muted);">${ui.escapeHtml(b.id)}</small></td>
              <td><span class="badge" style="background:#e2e8f0; color:#334155;">${ui.escapeHtml(b.booking_type)}</span></td>
              <td>${b.booking_type === "Passenger" ? `${ui.escapeHtml(b.passenger_count)} pax` : `${ui.escapeHtml(b.cargo_weight_kg)} kg`}</td>
              <td>
                <div>E-Ticket: <strong>${ui.escapeHtml(etk.ticket_no)}</strong></div>
                <div style="font-size:0.8rem; color:var(--text-muted);">Ref: ${ui.escapeHtml(gcashRef)}</div>
              </td>
              <td>
                <span class="badge badge-active">Approved</span><br>
                <span class="badge ${payStatus === "Paid" ? "badge-active" : "badge-pending"}" style="margin-top:2px;">Pay: ${ui.escapeHtml(payStatus)}</span>
              </td>
              <td>${new Date(b.created_at).toLocaleDateString()}</td>
            </tr>
          `;
            })
            .join("");
        }

        // Update pagination controls in-place
        updatePagination("#paginationContainer", pagination);
      }

      initPagination("#paginationContainer", (page) => {
        currentPage = page;
        renderTable();
      });

      // Use standardized filter event setup (with custom renderTable)
      setupTableFilters({
        searchInput: document.getElementById("searchInput"),
        filterSelects: [
          document.getElementById("typeFilter"),
          document.getElementById("dateFilter"),
        ],
        renderTable: renderTable,
      });

      document.getElementById("exportCsvBtn").onclick = () => {
        const approved = getFilteredBookings();
        if (!approved.length) {
          ui.showToast("No approved bookings to export.", "warning");
          return;
        }
        const rows = approved.map((b) => {
          const psg = allPassengers.find((p) => p.id === b.passenger_id) || {};
          const etk = allEtickets.find((e) => e.booking_id === b.id) || {};
          // Match the table: prefer the successful payment's reference number.
          const bookingPayments = allPayments
            .filter((p) => p.booking_id === b.id)
            .sort((a, b) => new Date(a.created_at) - new Date(b.created_at));
          const pay =
            bookingPayments.find((p) => p.status === "Paid") ||
            bookingPayments[bookingPayments.length - 1];
          return {
            booking_id: b.id,
            passenger_name: psg.full_name || "Unknown",
            booking_type: b.booking_type,
            passenger_count: b.passenger_count,
            cargo_weight_kg: b.cargo_weight_kg,
            ticket_no: etk.ticket_no || "",
            gcash_ref: (pay && pay.reference_no) || etk.gcash_ref || "",
            status: b.status,
            created_at: b.created_at,
          };
        });
        exportToCSV("approved_bookings.csv", rows);
      };

      loadData();
    </script>
  </body>
</html>
