  <!-- MAIN -->
  <div class="admin-main">
    <header class="admin-header">
      <h2>Approved Booking & E-Ticket Records</h2>
      <button id="exportCsvBtn" class="btn btn-primary btn-sm">Export CSV</button>
    </header>

    <div class="admin-content">
      <div class="card" style="margin-bottom: 1.5rem;">
        <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 1rem;">
          <input type="text" id="searchInput" class="form-control" placeholder="Search passenger...">
          <select id="typeFilter" class="form-control">
            <option value="">All Types</option>
            <option value="Passenger">Passenger</option>
            <option value="Cargo">Cargo</option>
          </select>
          <input type="date" id="dateFilter" class="form-control">
        </div>
      </div>

      <div class="table-container">
        <table>
          <thead>
            <tr>
              <th>Passenger</th>
              <th>Type</th>
              <th>Pax Count / Cargo Wt</th>
              <th>E-Ticket / Ref</th>
              <th>Status</th>
              <th>Created At</th>
            </tr>
          </thead>
          <tbody id="bookingsTableBody">
            <tr><td colspan="6" style="text-align: center;">Loading bookings...</td></tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>

  <script type="module">
    import { api } from '/js/api.js';
    import { seedDatabase } from '/js/seed.js';
    import { auth } from '/js/auth.js';
    import { ui } from '/js/ui.js';

    await seedDatabase();
    const session = await auth.requireAuth(['administrator']);
    if (!session) throw new Error('Unauthorized');

    let allBookings = [];
    let allPassengers = [];
    let allEtickets = [];
    let allPayments = [];

    async function loadData() {
      allBookings = await api.bookings.list();
      allPassengers = await api.passengers.list();
      allEtickets = api._get('etickets') || [];
      allPayments = await api.payments.list();
      renderTable();

      const alerts = await api.alerts.list();
      const openAlerts = alerts.filter(a => a.status === 'Open');
      const badge = document.getElementById('sosBadge');
      if (openAlerts.length > 0) {
        badge.textContent = openAlerts.length;
        badge.style.display = 'inline';
      } else {
        badge.style.display = 'none';
      }
    }

    function renderTable() {
      const search = document.getElementById('searchInput').value.toLowerCase();
      const typeFilter = document.getElementById('typeFilter').value;
      const dateFilter = document.getElementById('dateFilter').value;

      const filtered = allBookings.filter(b => {
        if (b.status !== 'Approved') return false;
        if (typeFilter && b.booking_type !== typeFilter) return false;
        if (dateFilter && !b.created_at.startsWith(dateFilter)) return false;

        const psg = allPassengers.find(p => p.id === b.passenger_id) || { full_name: '' };
        if (search && !psg.full_name.toLowerCase().includes(search) && !b.id.toLowerCase().includes(search)) return false;

        return true;
      });

      const tbody = document.getElementById('bookingsTableBody');
      if (filtered.length === 0) {
        tbody.innerHTML = '<tr><td colspan="7" style="text-align: center;">No approved bookings found.</td></tr>';
        return;
      }

      tbody.innerHTML = filtered.map(b => {
        const psg = allPassengers.find(p => p.id === b.passenger_id) || { full_name: 'Unknown' };
        const etk = allEtickets.find(e => e.booking_id === b.id) || { ticket_no: 'None', gcash_ref: 'N/A' };
        const pay = allPayments.find(p => p.booking_id === b.id);
        const payStatus = pay ? pay.status : 'Pending';
        const gcashRef = pay && pay.reference_no ? pay.reference_no : (etk.gcash_ref || 'N/A');

        return `
          <tr>
            <td><strong>${psg.full_name}</strong><br><small style="color:var(--text-muted);">${b.id}</small></td>
            <td><span class="badge" style="background:#e2e8f0; color:#334155;">${b.booking_type}</span></td>
            <td>${b.booking_type === 'Passenger' ? `${b.passenger_count} pax` : `${b.cargo_weight_kg} kg`}</td>
            <td>
              <div>E-Ticket: <strong>${etk.ticket_no}</strong></div>
              <div style="font-size:0.8rem; color:var(--text-muted);">Ref: ${gcashRef}</div>
            </td>
            <td>
              <span class="badge badge-active">Approved</span><br>
              <span class="badge ${payStatus === 'Paid' ? 'badge-active' : 'badge-pending'}" style="margin-top:2px;">Pay: ${payStatus}</span>
            </td>
            <td>${new Date(b.created_at).toLocaleDateString()}</td>
          </tr>
        `;
      }).join('');
    }

    document.getElementById('searchInput').oninput = renderTable;
    document.getElementById('typeFilter').onchange = renderTable;
    document.getElementById('dateFilter').onchange = renderTable;

    document.getElementById('exportCsvBtn').onclick = () => {
      const approved = allBookings.filter(b => b.status === 'Approved');
      if (!approved.length) {
        ui.showToast('No approved bookings to export.', 'warning');
        return;
      }
      const rows = approved.map(b => {
        const psg = allPassengers.find(p => p.id === b.passenger_id) || {};
        const etk = allEtickets.find(e => e.booking_id === b.id) || {};
        return {
          booking_id: b.id,
          passenger_name: psg.full_name || 'Unknown',
          booking_type: b.booking_type,
          passenger_count: b.passenger_count,
          cargo_weight_kg: b.cargo_weight_kg,
          ticket_no: etk.ticket_no || '',
          gcash_ref: etk.gcash_ref || '',
          status: b.status,
          created_at: b.created_at
        };
      });
      ui.exportToCSV('approved_bookings.csv', rows);
    };

    loadData();
    document.getElementById('logoutBtn').onclick = async (e) => {
      e.preventDefault();
      await api.auth.logout();
      window.location.href = '/login.html';
    };
  </script>
