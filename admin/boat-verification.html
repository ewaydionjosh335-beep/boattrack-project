<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Boat Verification - BoatTrack Admin</title>
    <link rel="stylesheet" href="/css/tokens.css" />
    <link rel="stylesheet" href="/css/base.css" />
    <link rel="stylesheet" href="/css/components.css" />
    <link rel="stylesheet" href="/css/layout.css" />
  </head>
  <body class="admin-layout">
    <!-- SIDEBAR -->
    <div id="sidebarContainer"></div>

    <!-- MAIN -->
    <div class="admin-main">
      <header class="admin-header">
        <h2>Boat Registration Verification</h2>
        <div style="display: flex; gap: 1rem; align-items: center">
          <input
            type="text"
            id="searchInput"
            class="form-control"
            placeholder="Search boat name or owner..."
            style="width: 250px"
          />
          <select id="statusFilter" class="form-control" style="width: 200px">
            <option value="">All Statuses</option>
            <option value="Pending" selected>Pending</option>
            <option value="Verified">Verified</option>
            <option value="Rejected">Rejected</option>
          </select>
        </div>
      </header>

      <div class="admin-content">
        <div class="table-container">
          <table>
            <thead>
              <tr>
                <th>Boat Name</th>
                <th>Type</th>
                <th>Capacity (Pax / Cargo)</th>
                <th>Max Load (kg)</th>
                <th>Registration Status</th>
                <th>Remarks</th>
                <th>Actions</th>
              </tr>
            </thead>
            <tbody id="boatsTableBody">
              <tr>
                <td colspan="7" style="text-align: center">Loading boats...</td>
              </tr>
            </tbody>
          </table>
        </div>
        <div id="paginationContainer" style="margin-top: 1rem"></div>
      </div>
    </div>

    <!-- VERIFICATION MODAL -->
    <div id="verifyModal" class="modal-backdrop" style="display: none">
      <div class="modal" style="max-width: 600px">
        <div class="modal-header">
          <h3 id="modalBoatName">Verify Boat Registration</h3>
          <button class="btn btn-outline btn-sm" id="closeModalBtn">
            &times;
          </button>
        </div>
        <div class="modal-body">
          <input type="hidden" id="verifyBoatId" />
          <div
            id="boatDetailsSummary"
            style="
              background: var(--bg-main);
              padding: 1rem;
              border-radius: var(--radius-sm);
              margin-bottom: 1rem;
              font-size: 0.9rem;
              line-height: 1.6;
            "
          ></div>

          <div class="form-group">
            <label class="form-label">Submitted Documents</label>
            <div
              id="boatDocsList"
              style="
                padding: 0.5rem;
                background: #fff;
                border: 1px solid var(--border);
                border-radius: var(--radius-sm);
              "
            ></div>
          </div>

          <div class="form-group">
            <label class="form-label">Assign Boat Operator</label>
            <select id="assignOperator" class="form-control"></select>
          </div>

          <div class="form-group">
            <label class="form-label"
              >Registration Type <span style="color: var(--danger); font-weight: bold;">*</span></label
            >
            <div style="display: flex; gap: 1.5rem; margin-top: 0.5rem">
              <label
                ><input type="radio" name="regType" value="Franchised" />
                Franchised</label
              >
              <label
                ><input type="radio" name="regType" value="Licensed" />
                Licensed</label
              >
            </div>
            <small style="color: var(--text-muted); font-size: 0.8rem;">
              Required for approval. Select the appropriate registration type.
            </small>
          </div>

          <div class="form-group">
            <label class="form-label"
              >Remarks / Inspection Notes (Required if rejecting)</label
            >
            <textarea
              id="verifyRemarks"
              class="form-control"
              rows="3"
              placeholder="Enter inspection remarks or reason for rejection..."
            ></textarea>
          </div>
        </div>
        <div class="modal-footer">
          <button class="btn btn-danger" id="rejectBtn">Reject Boat</button>
          <button class="btn btn-primary" id="verifyBtn">
            Verify & Approve
          </button>
        </div>
      </div>
    </div>

    <script type="module">
      import { api } from "/js/api.js";
      import { auth } from "/js/auth.js";
      import { ui } from "/js/ui.js";
      import { AdminSidebar } from "/admin/_sidebar.js";
      import { initAdminPage } from "/admin/init.js";
      import { ensureCSRFToken } from "/js/api.js";
      import { refreshSosBadge } from "/js/utils/sosBadge.js";
      import {
        paginate,
        renderPagination,
        updatePagination,
        initPagination,
        createTableFilter,
        filterTable,
        setupTableFilters,
        handleApiError,
        handleApiSuccess,
      } from "/admin/common.js";

      const session = await initAdminPage({ activePage: "boat-verification" });
      const csrfToken = ensureCSRFToken();

      let allBoats = [];
      let allUsers = [];
      let currentPage = 1;
      const pageSize = 25;

      // Create standardized filter function
      const boatFilter = createTableFilter({
        searchFields: ["name"],
        exactFilters: [
          { field: "registration_status", value: "statusFilter" },
        ],
      });

      async function loadBoats() {
        allBoats = await api.boats.list();
        allUsers = await api.users.list();
        renderTable();
        await refreshSosBadge();
      }

      function renderTable() {
        const filters = {
          search: document.getElementById("searchInput").value,
          statusFilter: document.getElementById("statusFilter").value,
        };

        // Custom filter for owner name search
        const filtered = allBoats.filter((b) => {
          if (filters.statusFilter && b.registration_status !== filters.statusFilter)
            return false;
          if (filters.search) {
            const search = filters.search.toLowerCase();
            const owner = allUsers.find((u) => u.id === b.owner_id);
            const ownerName = owner ? owner.full_name.toLowerCase() : "";
            if (
              !b.name.toLowerCase().includes(search) &&
              !ownerName.includes(search)
            )
              return false;
          }
          return true;
        });

        const pagination = paginate(filtered, currentPage, pageSize);
        const tbody = document.getElementById("boatsTableBody");
        if (pagination.items.length === 0) {
          tbody.innerHTML =
            '<tr><td colspan="7" style="text-align: center;">No boats found.</td></tr>';
        } else {
          tbody.innerHTML = pagination.items
            .map((b) => {
              const owner = allUsers.find((u) => u.id === b.owner_id);
              const operator = allUsers.find((u) => u.id === b.operator_id);
              return `
            <tr>
              <td>
                <strong>${ui.escapeHtml(b.name)}</strong><br>
                <span style="font-size: 0.8rem; color: var(--text-muted);">Owner: ${ui.escapeHtml(owner ? owner.full_name : "N/A")}</span>
              </td>
              <td><span class="badge" style="background:#e2e8f0; color:#334155;">${ui.escapeHtml(b.boat_type)}</span> (${ui.escapeHtml(b.registration_type || "Unregistered")})</td>
              <td>${ui.escapeHtml(b.passenger_capacity)} pax / ${ui.escapeHtml(b.cargo_capacity)} kg</td>
              <td><strong>${ui.escapeHtml(b.max_load_kg)} kg</strong></td>
              <td><span class="badge badge-${ui.escapeHtml(b.registration_status.toLowerCase())}">${ui.escapeHtml(b.registration_status)}</span></td>
              <td>${ui.escapeHtml(b.remarks || "None")}</td>
              <td>
                <div class="table-actions">
                  <button class="btn btn-primary btn-sm" data-action="verify" data-id="${b.id}">Review / Verify</button>
                  <button class="btn btn-outline btn-sm" data-action="toggle-status" data-id="${b.id}" data-status="${b.boat_status}">${b.boat_status === "Active" ? "Suspend" : "Activate"}</button>
                </div>
              </td>
            </tr>
          `;
            })
            .join("");
        }

        // Update pagination controls in-place
        updatePagination("#paginationContainer", pagination);
      }

      initPagination("#paginationContainer", (page) => {
        currentPage = page;
        renderTable();
      });

      // Use standardized filter event setup
      setupTableFilters({
        searchInput: document.getElementById("searchInput"),
        filterSelects: [document.getElementById("statusFilter")],
        renderTable: renderTable,
      });

      const modal = document.getElementById("verifyModal");
      const { open: openModal, close: closeModal } = ui.modal(modal);
      document.getElementById("closeModalBtn").onclick = closeModal;

      const openVerifyModal = async (boatId) => {
        const boat = allBoats.find((b) => b.id === boatId);
        if (!boat) return;

        document.getElementById("verifyBoatId").value = boat.id;
        document.getElementById("modalBoatName").textContent =
          `Review: ${boat.name}`;

        const owner = allUsers.find((u) => u.id === boat.owner_id);
        document.getElementById("boatDetailsSummary").innerHTML = `
        <strong>Boat Type:</strong> ${ui.escapeHtml(boat.boat_type)} | <strong>Max Load:</strong> ${ui.escapeHtml(boat.max_load_kg)} kg<br>
        <strong>Passenger Capacity:</strong> ${ui.escapeHtml(boat.passenger_capacity)} | <strong>Cargo Capacity:</strong> ${ui.escapeHtml(boat.cargo_capacity)} kg<br>
        <strong>Owner:</strong> ${ui.escapeHtml(owner ? owner.full_name : "N/A")} | <strong>Current Status:</strong> ${ui.escapeHtml(boat.registration_status)}
      `;

        const docs = await api.boatDocuments.listByBoat(boat.id);
        const docsContainer = document.getElementById("boatDocsList");
        if (docs.length === 0) {
          docsContainer.innerHTML =
            '<span style="color:var(--text-muted);">No documents uploaded.</span>';
        } else {
          docsContainer.innerHTML = docs
            .map(
              (d) =>
                `<div>Document: <strong>${ui.escapeHtml(d.file_name)}</strong> (${ui.escapeHtml(d.doc_type)})</div>`,
            )
            .join("");
        }

        const opSelect = document.getElementById("assignOperator");
        // An operator may run more than one boat (the seed data does this), so do not
        // hide operators that already operate another vessel.
        const ownerCluster = owner ? owner.cluster : null;
        const operators = allUsers.filter(
          (u) =>
            u.role === "boat_operator" &&
            u.status === "Active" &&
            (!ownerCluster || u.cluster === ownerCluster),
        );
        opSelect.innerHTML =
          '<option value="">-- Select Operator --</option>' +
          operators
            .map(
              (o) => `
        <option value="${o.id}" ${o.id === boat.operator_id ? "selected" : ""}>${ui.escapeHtml(o.full_name)} (${ui.escapeHtml(o.email)})${o.cluster ? " - Cluster: " + ui.escapeHtml(o.cluster) : ""}</option>
      `,
            )
            .join("");

        document.getElementById("verifyRemarks").value = boat.remarks || "";
        // Pre-select the registration type, otherwise "Verify & Approve" had no checked radio.
        document.querySelectorAll('input[name="regType"]').forEach((r) => {
          r.checked = r.value === boat.registration_type;
        });
        openWithA11y();
      };

      // Setup loading state for verify/reject buttons
      const setupButtonLoading = (btn, loadingText = "Saving...") => {
        const originalText = btn.textContent;
        btn.disabled = true;
        btn.textContent = loadingText;
        return () => {
          btn.disabled = false;
          btn.textContent = originalText;
        };
      };

      document.getElementById("verifyBtn").onclick = async () => {
        const btn = document.getElementById("verifyBtn");
        const id = document.getElementById("verifyBoatId").value;
        const operator_id =
          document.getElementById("assignOperator").value || null;
        const regTypeInput = document.querySelector(
          'input[name="regType"]:checked',
        );
        const remarks = document.getElementById("verifyRemarks").value.trim();
        if (!regTypeInput) {
          handleApiError("Select a registration type (Franchised or Licensed).", { toast: true });
          return;
        }
        const registration_type = regTypeInput.value;
        const resetBtn = setupButtonLoading(btn, "Verifying...");

        try {
          await api.boats.verify(id, {
            registration_status: "Verified",
            registration_type,
            verified_by: session.user_id,
            remarks: remarks || "Verified and approved by Administrator.",
            operator_id,
          }, csrfToken);
          handleApiSuccess("Boat successfully verified and approved.");
          closeModal();
          await loadBoats();
        } catch (err) {
          handleApiError(err);
        } finally {
          resetBtn();
        }
      };

      document.getElementById("rejectBtn").onclick = async () => {
        const btn = document.getElementById("rejectBtn");
        const resetBtn = setupButtonLoading(btn, "Rejecting...");
        const id = document.getElementById("verifyBoatId").value;
        const remarks = document.getElementById("verifyRemarks").value.trim();
        if (!remarks) {
          handleApiError("Please enter remarks/reason for rejecting.", { toast: true });
          resetBtn();
          return;
        }

        try {
          await api.boats.verify(id, {
            registration_status: "Rejected",
            verified_by: session.user_id,
            remarks,
          }, csrfToken);
          handleApiSuccess("Boat registration rejected.", { toast: true });
          closeModal();
          await loadBoats();
        } catch (err) {
          handleApiError(err);
        } finally {
          resetBtn();
        }
      };

      const toggleBoatStatus = async (id, currentStatus) => {
        const newStatus = currentStatus === "Active" ? "Suspended" : "Active";
        ui.confirm(
          `Are you sure you want to set boat status to ${newStatus}?`,
          async () => {
            try {
              await api.boats.updateStatus(id, newStatus, null, csrfToken);
              handleApiSuccess(`Boat status updated to ${newStatus}`);
              await loadBoats();
            } catch (err) {
              handleApiError(err);
            }
          },
        );
      };

      document.getElementById("boatsTableBody").onclick = (e) => {
        const btn = e.target.closest("button[data-action]");
        if (!btn) return;
        if (btn.dataset.action === "verify")
          openVerifyModal(btn.dataset.id);
        else if (btn.dataset.action === "toggle-status")
          toggleBoatStatus(btn.dataset.id, btn.dataset.status);
      };

      loadBoats();
    </script>
  </body>
</html>
