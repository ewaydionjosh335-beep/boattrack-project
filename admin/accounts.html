<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Manage Accounts - BoatTrack Admin</title>
    <link rel="stylesheet" href="/css/tokens.css" />
    <link rel="stylesheet" href="/css/base.css" />
    <link rel="stylesheet" href="/css/components.css" />
    <link rel="stylesheet" href="/css/layout.css" />
  </head>
  <body class="admin-layout">
    <!-- SIDEBAR -->
    <div id="sidebarContainer"></div>

    <!-- MAIN -->
    <div class="admin-main">
      <header class="admin-header">
        <h2>Account Management</h2>
        <button id="openAddModalBtn" class="btn btn-primary">
          Add New Account
        </button>
      </header>

      <div class="admin-content">
        <div class="card" style="margin-bottom: 1.5rem">
          <div
            style="
              display: grid;
              grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
              gap: 1rem;
            "
          >
            <input
              type="text"
              id="searchInput"
              class="form-control"
              placeholder="Search name or email..."
            />
            <select id="roleFilter" class="form-control">
              <option value="">All Roles</option>
              <option value="administrator">Administrator</option>
              <option value="port_manager">Port Manager</option>
              <option value="receptionist">Receptionist</option>
              <option value="boat_owner">Boat Owner</option>
              <option value="boat_operator">Boat Operator</option>
              <option value="crew">Crew</option>
              <option value="passenger">Passenger</option>
            </select>
            <select id="statusFilter" class="form-control">
              <option value="">All Statuses</option>
              <option value="Active">Active</option>
              <option value="Suspended">Suspended</option>
            </select>
          </div>
        </div>

        <div class="table-container">
          <table>
            <thead>
              <tr>
                <th>Full Name</th>
                <th>Username</th>
                <th>Email</th>
                <th>Role</th>
                <th>Cluster</th>
                <th>Status</th>
                <th>Created At</th>
                <th>Actions</th>
              </tr>
            </thead>
            <tbody id="accountsTableBody">
              <tr>
                <td colspan="8" style="text-align: center">
                  Loading accounts...
                </td>
              </tr>
            </tbody>
          </table>
        </div>
        <div id="paginationContainer" style="margin-top: 1rem"></div>
      </div>
    </div>

    <!-- ADD / EDIT MODAL -->
    <div id="accountModal" class="modal-backdrop" style="display: none">
      <div class="modal">
        <div class="modal-header">
          <h3 id="modalTitle">Add Account</h3>
          <button class="btn btn-outline btn-sm" id="closeModalBtn">
            &times;
          </button>
        </div>
        <form id="accountForm">
          <div class="modal-body">
            <input type="hidden" id="editUserId" />
            <div class="form-group">
              <label class="form-label">Full Name</label>
              <input type="text" id="modalName" class="form-control" required />
            </div>
            <div class="form-group">
              <label class="form-label">Email</label>
              <input
                type="email"
                id="modalEmail"
                class="form-control"
                required
              />
            </div>
            <div class="form-group">
              <label class="form-label">Username</label>
              <input
                type="text"
                id="modalUsername"
                class="form-control"
                required
              />
            </div>
            <div class="form-group">
              <label class="form-label">Cluster</label>
              <input type="text" id="modalCluster" class="form-control" />
            </div>
            <div class="form-group">
              <label class="form-label">Role</label>
              <select id="modalRole" class="form-control">
                <option value="port_manager">Port Manager</option>
                <option value="receptionist">Receptionist</option>
                <option value="boat_owner">Boat Owner</option>
                <option value="boat_operator">Boat Operator</option>
                <option value="crew">Crew</option>
                <option value="passenger">Passenger</option>
                <option value="administrator">Administrator</option>
              </select>
            </div>
            <div
              class="form-group"
              id="passwordGroup"
              style="position: relative"
            >
              <label class="form-label">Password / Temp Password</label>
              <div style="display: flex; position: relative; width: 100%">
                <input
                  type="password"
                  id="modalPassword"
                  class="form-control"
                  autocomplete="new-password"
                  placeholder="••••••••"
                  style="padding-right: 40px; width: 100%"
                />
                <button
                  type="button"
                  class="btn btn-outline"
                  id="togglePassBtn"
                  style="
                    position: absolute;
                    right: 0;
                    top: 0;
                    bottom: 0;
                    width: 40px;
                    padding: 0;
                    display: flex;
                    align-items: center;
                    justify-content: center;
                    background: none;
                    border: none;
                    cursor: pointer;
                    border-left: 1px solid var(--border);
                  "
                >
                  <svg
                    width="18"
                    height="18"
                    viewBox="0 0 24 24"
                    fill="none"
                    stroke="currentColor"
                    stroke-width="2"
                  >
                    <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z" />
                    <circle cx="12" cy="12" r="3" />
                  </svg>
                </button>
              </div>
              <div
                id="passwordHint"
                style="
                  font-size: 0.8rem;
                  color: var(--text-muted);
                  margin-top: 0.35rem;
                  display: none;
                "
              >
                Password is saved and hidden. Leave blank to keep it, or type a
                new password to replace it.
              </div>
            </div>
            <div id="modalError" class="error-text"></div>
          </div>
          <div class="modal-footer">
            <button type="button" class="btn btn-outline" id="cancelModalBtn">
              Cancel
            </button>
            <button type="submit" class="btn btn-primary">Save Account</button>
          </div>
        </form>
      </div>
    </div>

    <script type="module">
      import { api } from "/js/api.js";
      import { seedDatabase } from "/js/seed.js";
      import { auth, hashPassword } from "/js/auth.js";
      import { ui } from "/js/ui.js";
      import { refreshSosBadge } from "/js/utils/sosBadge.js";
      import { AdminSidebar } from "/admin/_sidebar.js";
      import {
        paginate,
        renderPagination,
        initPagination,
        setupModalAccessibility,
        setupModalSubmit,
      } from "/admin/common.js";

      await seedDatabase();
      const session = await auth.requireAuth(["administrator"]);
      if (!session) throw new Error("Unauthorized");

      // Load shared sidebar
      AdminSidebar.mount({
        activePage: "accounts",
        userName: session.full_name || "Administrator",
      });

      let allUsers = [];
      let currentPage = 1;
      const pageSize = 25;

      async function loadAccounts() {
        allUsers = await api.users.list();
        renderTable();
        await refreshSosBadge();
      }

      function renderTable() {
        const search = document
          .getElementById("searchInput")
          .value.toLowerCase();
        const role = document.getElementById("roleFilter").value;
        const status = document.getElementById("statusFilter").value;

        const filtered = allUsers.filter((u) => {
          if (role && u.role !== role) return false;
          if (status && u.status !== status) return false;
          if (
            search &&
            !u.full_name.toLowerCase().includes(search) &&
            !u.email.toLowerCase().includes(search) &&
            !u.username.toLowerCase().includes(search)
          )
            return false;
          return true;
        });

        const pagination = paginate(filtered, currentPage, pageSize);
        const tbody = document.getElementById("accountsTableBody");
        if (pagination.items.length === 0) {
          tbody.innerHTML =
            '<tr><td colspan="8" style="text-align: center;">No accounts found.</td></tr>';
        } else {
          tbody.innerHTML = pagination.items
            .map(
              (u) => `
          <tr>
            <td><strong>${ui.escapeHtml(u.full_name)}</strong></td>
            <td>${ui.escapeHtml(u.username)}</td>
            <td>${ui.escapeHtml(u.email)}</td>
            <td><span class="badge" style="background:#e2e8f0; color:#334155;">${ui.escapeHtml(u.role)}</span></td>
            <td>${ui.escapeHtml(u.cluster || "-")}</td>
            <td><span class="badge badge-${ui.escapeHtml(u.status.toLowerCase())}">${ui.escapeHtml(u.status)}</span></td>
            <td>${new Date(u.created_at).toLocaleDateString()}</td>
            <td>
              <div class="table-actions">
                <button class="btn btn-outline btn-sm" data-action="edit" data-id="${u.id}">Edit</button>
                <button class="btn btn-outline btn-sm" data-action="toggle" data-id="${u.id}" data-status="${ui.escapeHtml(u.status)}">${u.status === "Active" ? "Suspend" : "Activate"}</button>
                ${u.id !== session.user_id ? `<button class="btn btn-danger btn-sm" data-action="delete" data-id="${u.id}">Delete</button>` : ""}
              </div>
            </td>
          </tr>
        `,
            )
            .join("");
        }

        // Render pagination controls
        const paginationContainer = document.getElementById(
          "paginationContainer",
        );
        if (paginationContainer) {
          paginationContainer.innerHTML = renderPagination(pagination);
        }
      }

      initPagination("#paginationContainer", (page) => {
        currentPage = page;
        renderTable();
      });
      document.getElementById("searchInput").oninput = () => {
        currentPage = 1;
        renderTable();
      };
      document.getElementById("roleFilter").onchange = () => {
        currentPage = 1;
        renderTable();
      };
      document.getElementById("statusFilter").onchange = () => {
        currentPage = 1;
        renderTable();
      };

      const modal = document.getElementById("accountModal");
      const { open: openModal, close: closeModal } = ui.modal(modal);
      // Apply accessibility enhancements
      let modalCleanup = null;
      const openWithA11y = () => {
        openModal();
        modalCleanup = setupModalAccessibility(modal);
      };
      document.getElementById("openAddModalBtn").onclick = () => {
        document.getElementById("modalTitle").textContent = "Add Account";
        document.getElementById("editUserId").value = "";
        document.getElementById("modalName").value = "";
        document.getElementById("modalEmail").value = "";
        document.getElementById("modalUsername").value = "";
        document.getElementById("modalCluster").value = "";
        document.getElementById("modalRole").value = "port_manager";
        document.getElementById("modalPassword").value = "";
        document.getElementById("modalPassword").placeholder =
          "Temporary password";
        document.getElementById("modalPassword").type = "password";
        document.getElementById("passwordGroup").style.display = "block";
        document.getElementById("passwordHint").style.display = "none";
        document.getElementById("modalError").textContent = "";
        openWithA11y();
      };

      document.getElementById("togglePassBtn").onclick = () => {
        const passInput = document.getElementById("modalPassword");
        const btn = document.getElementById("togglePassBtn");
        if (passInput.type === "password") {
          passInput.type = "text";
          btn.innerHTML = `<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/></svg>`;
        } else {
          passInput.type = "password";
          btn.innerHTML = `<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>`;
        }
      };

      document.getElementById("closeModalBtn").onclick = closeModal;
      document.getElementById("cancelModalBtn").onclick = closeModal;

      const editUser = (id) => {
        const user = allUsers.find((u) => u.id === id);
        if (!user) return;
        document.getElementById("modalTitle").textContent = "Edit Account";
        document.getElementById("editUserId").value = user.id;
        document.getElementById("modalName").value = user.full_name;
        document.getElementById("modalEmail").value = user.email;
        document.getElementById("modalUsername").value = user.username;
        document.getElementById("modalCluster").value = user.cluster || "";
        document.getElementById("modalRole").value = user.role;
        document.getElementById("passwordGroup").style.display = "block";
        document.getElementById("modalPassword").value = "";
        document.getElementById("modalPassword").placeholder =
          "Leave blank to keep current";
        document.getElementById("modalPassword").type = "password";
        document.getElementById("passwordHint").style.display = "block";
        document.getElementById("modalError").textContent = "";
        openWithA11y();
      };

      const toggleSuspend = async (id, currentStatus) => {
        if (id === session.user_id) {
          ui.showToast("You cannot suspend your own account.", "error");
          return;
        }
        const newStatus = currentStatus === "Active" ? "Suspended" : "Active";
        ui.confirm(
          `Are you sure you want to set this account status to ${newStatus}?`,
          async () => {
            try {
              await api.users.update(id, { status: newStatus });
              ui.showToast(`Account status updated to ${newStatus}`, "success");
              await loadAccounts();
            } catch (err) {
              ui.showToast(err.message, "error");
            }
          },
        );
      };

      const deleteUser = async (id) => {
        ui.confirm(
          "Are you sure you want to delete this account? This action cannot be undone.",
          async () => {
            try {
              await api.users.delete(id);
              ui.showToast("Account deleted successfully.", "success");
              await loadAccounts();
            } catch (err) {
              ui.showToast(err.message, "error");
            }
          },
        );
      };

      document.getElementById("accountsTableBody").onclick = (e) => {
        const btn = e.target.closest("button[data-action]");
        if (!btn) return;
        if (btn.dataset.action === "edit") editUser(btn.dataset.id);
        else if (btn.dataset.action === "toggle")
          toggleSuspend(btn.dataset.id, btn.dataset.status);
        else if (btn.dataset.action === "delete") deleteUser(btn.dataset.id);
      };

      // Setup modal submit with loading state
      setupModalSubmit(
        document.getElementById("accountForm"),
        async () => {
          const id = document.getElementById("editUserId").value;
          const full_name = document.getElementById("modalName").value.trim();
          const email = document.getElementById("modalEmail").value.trim();
          const username = document
            .getElementById("modalUsername")
            .value.trim();
          const cluster = document.getElementById("modalCluster").value.trim();
          const role = document.getElementById("modalRole").value;
          const errBox = document.getElementById("modalError");
          errBox.textContent = "";

          const rawPass = document.getElementById("modalPassword").value;
          const isNewAccount = !id;
          if (isNewAccount && !rawPass)
            throw new Error("A temporary password is required.");
          if (
            rawPass &&
            (rawPass.length < 8 ||
              !/[a-zA-Z]/.test(rawPass) ||
              !/[0-9]/.test(rawPass))
          ) {
            throw new Error(
              "Password must be at least 8 characters and contain at least one letter and one number.",
            );
          }

          if (id) {
            const updateData = { full_name, email, username, role, cluster };
            if (rawPass) {
              updateData.password_hash = await hashPassword(rawPass);
            }
            await api.users.update(id, updateData);
            ui.showToast(
              rawPass
                ? "Account updated. New password saved — it will be required on next login."
                : "Account updated successfully.",
              "success",
            );
          } else {
            const password_hash = await hashPassword(rawPass);
            await api.users.create({
              full_name,
              email,
              username,
              role,
              cluster,
              password_hash,
              status: "Active",
              must_change_password: true,
            });
            ui.showToast("Account created successfully.", "success");
          }
          closeModal();
          await loadAccounts();
        },
        {
          submitBtnSelector: '#accountForm button[type="submit"]',
          successToast: null,
        },
      );

      loadAccounts();
    </script>
  </body>
</html>
