        Administrator

    <div class="sidebar-menu">

      <a href="/admin/accounts.html" class="active"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg> Accounts</a>
      <a href="/admin/boat-verification.html"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="5" r="3"/><path d="M12 22V8"/><path d="M5 12H2a10 10 0 0 0 20 0h-3"/></svg> Boat Verification</a>
      <a href="/admin/crew-verification.html"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg> Crew Verification</a>
      <a href="/admin/routes-fares.html"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="1 6 1 22 8 18 16 22 23 18 23 2 16 6 8 2 1 6"/><line x1="8" y1="2" x2="8" y2="18"/><line x1="16" y1="6" x2="16" y2="22"/></svg> Routes & Fares</a>
      <a href="/admin/terminals.html"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="4" y="2" width="16" height="20" rx="2" ry="2"/><path d="M9 22v-4h6v4"/><path d="M8 6h.01"/><path d="M16 6h.01"/><path d="M12 6h.01"/></svg> Terminals</a>
      <a href="/admin/manifests.html"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"/><rect x="8" y="2" width="8" height="4" rx="1" ry="1"/></svg> Manifests</a>
      <a href="/admin/bookings.html"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"/></svg> Bookings</a>
      <a href="/admin/sos-alerts.html"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3Z"/><line x1="12" y1="9" x2="12" y2="13"/></svg> SOS Alerts <span class="badge badge-pending" id="sosBadge">0</span></a>
      <a href="/admin/dev-tools.html"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l-.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l-.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9c0 .69.21 1.35.6 1.91z"/></svg> Dev Tools</a>
          <a href="#" id="logoutBtn" style="color: var(--danger);"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg> Logout</a>
    </div>
  </aside>

  <!-- MAIN -->
  <div class="admin-main">
    <header class="admin-header">
      <h2>Account Management</h2>
      <button id="openAddModalBtn" class="btn btn-primary">Add New Account</button>
    </header>

    <div class="admin-content">
      <div class="card" style="margin-bottom: 1.5rem;">
        <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 1rem;">
          <input type="text" id="searchInput" class="form-control" placeholder="Search name or email...">
          <select id="roleFilter" class="form-control">
            <option value="">All Roles</option>
            <option value="administrator">Administrator</option>
            <option value="port_manager">Port Manager</option>
            <option value="receptionist">Receptionist</option>
            <option value="boat_owner">Boat Owner</option>
            <option value="boat_operator">Boat Operator</option>
            <option value="crew">Crew</option>
            <option value="passenger">Passenger</option>
          </select>
          <select id="statusFilter" class="form-control">
            <option value="">All Statuses</option>
            <option value="Active">Active</option>
            <option value="Suspended">Suspended</option>
          </select>
        </div>
      </div>

      <div class="table-container">
        <table>
          <thead>
            <tr>
              <th>Full Name</th>
              <th>Username</th>
              <th>Email</th>
              <th>Role</th>
              <th>Cluster</th>
              <th>Status</th>
              <th>Created At</th>
              <th>Actions</th>
            </tr>
          </thead>
          <tbody id="accountsTableBody">
            <tr><td colspan="8" style="text-align: center;">Loading accounts...</td></tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>

  <!-- ADD / EDIT MODAL -->
  <div id="accountModal" class="modal-backdrop" style="display: none;">
    <div class="modal">
      <div class="modal-header">
        <h3 id="modalTitle">Add Account</h3>
        <button class="btn btn-outline btn-sm" id="closeModalBtn">&times;</button>
      </div>
      <form id="accountForm">
        <div class="modal-body">
          <input type="hidden" id="editUserId">
          <div class="form-group">
            <label class="form-label">Full Name</label>
            <input type="text" id="modalName" class="form-control" required>
          </div>
          <div class="form-group">
            <label class="form-label">Email</label>
            <input type="email" id="modalEmail" class="form-control" required>
          </div>
          <div class="form-group">
            <label class="form-label">Username</label>
            <input type="text" id="modalUsername" class="form-control" required>
          </div>
          <div class="form-group">
            <label class="form-label">Cluster</label>
            <input type="text" id="modalCluster" class="form-control">
          </div>
          <div class="form-group">
            <label class="form-label">Role</label>
            <select id="modalRole" class="form-control">
              <option value="port_manager">Port Manager</option>
              <option value="receptionist">Receptionist</option>
              <option value="boat_owner">Boat Owner</option>
              <option value="boat_operator">Boat Operator</option>
              <option value="crew">Crew</option>
              <option value="passenger">Passenger</option>
              <option value="administrator">Administrator</option>
            </select>
          </div>
           <div class="form-group" id="passwordGroup" style="position: relative;">
             <label class="form-label">Password / Temp Password</label>
             <div style="display: flex; position: relative; width: 100%;">
               <input type="password" id="modalPassword" class="form-control" placeholder="••••••••" style="padding-right: 40px; width: 100%;">
               <button type="button" class="btn btn-outline" id="togglePassBtn" style="position: absolute; right: 0; top: 0; bottom: 0; width: 40px; padding: 0; display: flex; align-items: center; justify-content: center; background: none; border: none; cursor: pointer; border-left: 1px solid var(--border);">
                 <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
               </button>
             </div>
           </div>
          <div id="modalError" class="error-text"></div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-outline" id="cancelModalBtn">Cancel</button>
          <button type="submit" class="btn btn-primary">Save Account</button>
        </div>
      </form>
    </div>
  </div>

  <script type="module">
    import { api } from '/js/api.js';
    import { seedDatabase } from '/js/seed.js';
    import { auth, hashPassword } from '/js/auth.js';
    import { ui } from '/js/ui.js';

    await seedDatabase();
    const session = await auth.requireAuth(['administrator']);
    if (!session) throw new Error('Unauthorized');

    let allUsers = [];

    async function loadAccounts() {
      allUsers = await api.users.list();
      renderTable();
      
      const alerts = await api.alerts.list();
      const openAlerts = alerts.filter(a => a.status === 'Open');
      const badge = document.getElementById('sosBadge');
      if (openAlerts.length > 0) {
        badge.textContent = openAlerts.length;
        badge.style.display = 'inline';
      } else {
        badge.style.display = 'none';
      }
    }

    function renderTable() {
      const search = document.getElementById('searchInput').value.toLowerCase();
      const role = document.getElementById('roleFilter').value;
      const status = document.getElementById('statusFilter').value;

      const filtered = allUsers.filter(u => {
        if (role && u.role !== role) return false;
        if (status && u.status !== status) return false;
        if (search && !u.full_name.toLowerCase().includes(search) && !u.email.toLowerCase().includes(search) && !u.username.toLowerCase().includes(search)) return false;
        return true;
      });

      const tbody = document.getElementById('accountsTableBody');
      if (filtered.length === 0) {
        tbody.innerHTML = '<tr><td colspan="8" style="text-align: center;">No accounts found.</td></tr>';
        return;
      }

      tbody.innerHTML = filtered.map(u => `
        <tr>
          <td><strong>${u.full_name}</strong></td>
          <td>${u.username}</td>
          <td>${u.email}</td>
          <td><span class="badge" style="background:#e2e8f0; color:#334155;">${u.role}</span></td>
          <td>${u.cluster || '-'}</td>
          <td><span class="badge badge-${u.status.toLowerCase()}">${u.status}</span></td>
          <td>${new Date(u.created_at).toLocaleDateString()}</td>
          <td>
            <div class="table-actions">
              <button class="btn btn-outline btn-sm" onclick="window.editUser('${u.id}')">Edit</button>
              <button class="btn btn-outline btn-sm" onclick="window.toggleSuspend('${u.id}', '${u.status}')">${u.status === 'Active' ? 'Suspend' : 'Activate'}</button>
              ${u.id !== session.user_id ? `<button class="btn btn-danger btn-sm" onclick="window.deleteUser('${u.id}')">Delete</button>` : ''}
            </div>
          </td>
        </tr>
      `).join('');
    }

    document.getElementById('searchInput').oninput = renderTable;
    document.getElementById('roleFilter').onchange = renderTable;
    document.getElementById('statusFilter').onchange = renderTable;

    const modal = document.getElementById('accountModal');
    document.getElementById('openAddModalBtn').onclick = () => {
      document.getElementById('modalTitle').textContent = 'Add Account';
      document.getElementById('editUserId').value = '';
      document.getElementById('modalName').value = '';
      document.getElementById('modalEmail').value = '';
      document.getElementById('modalUsername').value = '';
      document.getElementById('modalCluster').value = '';
      document.getElementById('modalRole').value = 'port_manager';
      document.getElementById('modalPassword').value = '123';
      document.getElementById('passwordGroup').style.display = 'block';
      document.getElementById('modalError').textContent = '';
      modal.style.display = 'flex';
    };

    document.getElementById('togglePassBtn').onclick = () => {
      const passInput = document.getElementById('modalPassword');
      const btn = document.getElementById('togglePassBtn');
      if (passInput.type === 'password') {
        passInput.type = 'text';
        btn.innerHTML = `<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/></svg>`;
      } else {
        passInput.type = 'password';
        btn.innerHTML = `<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>`;
      }
    };

    const closeModal = () => modal.style.display = 'none';
    document.getElementById('closeModalBtn').onclick = closeModal;
    document.getElementById('cancelModalBtn').onclick = closeModal;

    window.editUser = (id) => {
      const user = allUsers.find(u => u.id === id);
      if (!user) return;
      document.getElementById('modalTitle').textContent = 'Edit Account';
      document.getElementById('editUserId').value = user.id;
      document.getElementById('modalName').value = user.full_name;
      document.getElementById('modalEmail').value = user.email;
      document.getElementById('modalUsername').value = user.username;
      document.getElementById('modalCluster').value = user.cluster || '';
      document.getElementById('modalRole').value = user.role;
      document.getElementById('passwordGroup').style.display = 'block';
      document.getElementById('modalPassword').value = user.password || ''; 
      document.getElementById('modalPassword').placeholder = 'Leave blank to keep current';
      document.getElementById('modalError').textContent = '';
      modal.style.display = 'flex';
    };

    window.toggleSuspend = async (id, currentStatus) => {
      const newStatus = currentStatus === 'Active' ? 'Suspended' : 'Active';
      ui.confirm(`Are you sure you want to set this account status to ${newStatus}?`, async () => {
        await api.users.update(id, { status: newStatus });
        ui.showToast(`Account status updated to ${newStatus}`, 'success');
        await loadAccounts();

    
      });
    };

    window.deleteUser = async (id) => {
      ui.confirm('Are you sure you want to delete this account? This action cannot be undone.', async () => {
        try {
          await api.users.delete(id);
          ui.showToast('Account deleted successfully.', 'success');
          await loadAccounts();

    
        } catch (err) {
          ui.showToast(err.message, 'error');
        }
      });
    };

    document.getElementById('accountForm').onsubmit = async (e) => {
      e.preventDefault();
      const id = document.getElementById('editUserId').value;
      const full_name = document.getElementById('modalName').value.trim();
      const email = document.getElementById('modalEmail').value.trim();
      const username = document.getElementById('modalUsername').value.trim();
      const cluster = document.getElementById('modalCluster').value.trim();
      const role = document.getElementById('modalRole').value;
      const errBox = document.getElementById('modalError');
      errBox.textContent = '';

        try {
        if (id) {
const updateData = { full_name, email, username, role, cluster };
           const rawPass = document.getElementById('modalPassword').value;
           if (rawPass) {
              updateData.password_hash = await hashPassword(rawPass);
              updateData.password = rawPass;
           }
           await api.users.update(id, updateData);
          ui.showToast('Account updated successfully.', 'success');
        } else {
const rawPass = document.getElementById('modalPassword').value || '123';
           const password_hash = await hashPassword(rawPass);
           await api.users.create({ full_name, email, username, role, cluster, password: rawPass, password_hash, status: 'Active' });
          ui.showToast('Account created successfully.', 'success');
        }
        closeModal();
        await loadAccounts();

    
      } catch (err) {
        errBox.textContent = err.message;
      }
    };

    loadAccounts();
    document.getElementById('logoutBtn').onclick = async (e) => {
      e.preventDefault();
      await api.auth.logout();
      window.location.href = '/login.html';
    };
  </script>
</body>
</html>
