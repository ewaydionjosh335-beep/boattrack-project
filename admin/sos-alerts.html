  <!-- MAIN -->
  <div class="admin-main">
    <header class="admin-header">
      <h2>Emergency SOS Distress Alerts</h2>
      <button id="pollAlertsBtn" class="btn btn-outline btn-sm">Refresh Alerts</button>
    </header>

    <div class="admin-content">
      <div class="table-container">
        <table>
          <thead>
            <tr>
              <th>Vessel / Trip</th>
              <th>Sender & Role</th>
              <th>Message</th>
              <th>Status</th>
              <th>Time Sent</th>
              <th>Actions</th>
            </tr>
          </thead>
          <tbody id="alertsTableBody">
            <tr><td colspan="6" style="text-align: center;">Loading alerts...</td></tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>

  <script type="module">
    import { api } from '/js/api.js';
    import { seedDatabase } from '/js/seed.js';
    import { auth } from '/js/auth.js';
    import { ui } from '/js/ui.js';

    await seedDatabase();
    const session = await auth.requireAuth(['administrator']);
    if (!session) throw new Error('Unauthorized');

    let allAlerts = [];
    let allBoats = [];
    let allUsers = [];

    async function loadAlerts() {
      allAlerts = await api.alerts.list();
      allBoats = await api.boats.list();
      allUsers = await api.users.list();
      renderTable();

      const openCount = allAlerts.filter(a => a.status === 'Open').length;
      const badge = document.getElementById('sosBadge');
      if (openCount > 0) {
        badge.textContent = openCount;
        badge.style.display = 'inline';
      } else {
        badge.style.display = 'none';
      }
    }

    function renderTable() {
      const tbody = document.getElementById('alertsTableBody');
      if (allAlerts.length === 0) {
        tbody.innerHTML = '<tr><td colspan="6" style="text-align: center;">No emergency alerts recorded.</td></tr>';
        return;
      }

      tbody.innerHTML = allAlerts.map(a => {
        const boat = allBoats.find(b => b.id === a.boat_id) || { name: 'General / Unknown' };
        const sender = allUsers.find(u => u.id === a.sent_by_user_id) || { full_name: 'Passenger/Crew' };
        const role = a.sender_role || 'Passenger';
        const time = new Date(a.created_at).toLocaleString();
        const isOpen = a.status === 'Open';
        const rowStyle = isOpen ? 'background-color: rgba(231, 111, 81, 0.05);' : '';

        return `
          <tr style="${rowStyle}">
            <td><strong>${boat.name}</strong><br><small style="color:var(--text-muted);">Trip: ${a.trip_id || 'N/A'}</small></td>
            <td><strong>${sender.full_name}</strong><br><span class="badge" style="background:#e2e8f0; color:#334155; font-size:0.7rem;">${role}</span></td>
            <td><span style="color: ${isOpen ? 'var(--danger)' : 'inherit'}; font-weight: ${isOpen ? '600' : '400'};">${a.message}</span></td>
            <td><span class="badge badge-${a.status.toLowerCase()}">${a.status}</span></td>
            <td>${time}</td>
            <td>
              ${isOpen ? `<button class="btn btn-primary btn-sm" onclick="window.acknowledgeAlert('${a.id}')">Acknowledge</button>` : `<span style="font-size:0.85rem; color:var(--text-muted);">Acknowledged</span>`}
            </td>
          </tr>
        `;
      }).join('');
    }

    window.acknowledgeAlert = async (id) => {
      ui.confirm('Are you sure you want to acknowledge this SOS alert?', async () => {
        await api.alerts.acknowledge(id);
        ui.showToast('SOS alert acknowledged.', 'success');
        await loadAlerts();

    
      });
    };

    document.getElementById('pollAlertsBtn').onclick = loadAlerts;

    window.addEventListener('storage', (e) => {
      if (e.key === 'alerts') {
        loadAlerts();

    
        ui.showToast('New SOS Alert received!', 'error');
      }
    });

    loadAlerts();
    document.getElementById('logoutBtn').onclick = async (e) => {
      e.preventDefault();
      await api.auth.logout();
      window.location.href = '/login.html';
    };
  </script>
</body>
