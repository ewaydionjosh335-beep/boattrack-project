<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SOS Alerts - BoatTrack Admin</title>
    <link rel="stylesheet" href="/css/tokens.css" />
    <link rel="stylesheet" href="/css/base.css" />
    <link rel="stylesheet" href="/css/components.css" />
    <link rel="stylesheet" href="/css/layout.css" />
  </head>
  <body class="admin-layout">
    <!-- SIDEBAR -->
    <div id="sidebarContainer"></div>

    <!-- MAIN -->
    <div class="admin-main">
      <header class="admin-header">
        <h2>Emergency SOS Distress Alerts</h2>
        <div class="header-filters">
          <span class="live-indicator" title="Live updates enabled">
            <span class="live-dot"></span>Live
          </span>
          <button id="pollAlertsBtn" class="btn btn-outline btn-sm">
            Refresh Alerts
          </button>
        </div>
      </header>

      <div class="admin-content">
        <div class="table-container">
          <table>
            <thead>
              <tr>
                <th>Vessel / Trip</th>
                <th>Sender & Role</th>
                <th>Message</th>
                <th>Status</th>
                <th>Time Sent</th>
                <th>Actions</th>
              </tr>
            </thead>
            <tbody id="alertsTableBody">
              <tr>
                <td colspan="6" class="table-message">
                  Loading alerts...
                </td>
              </tr>
            </tbody>
          </table>
        </div>
        <div id="paginationContainer"></div>
      </div>
    </div>

    <script type="module">
      import { api } from "/js/api.js";
      import { auth } from "/js/auth.js";
      import { ui } from "/js/ui.js";
      import { AdminSidebar } from "/admin/_sidebar.js";
      import { initAdminPage } from "/admin/init.js";
      import { ensureCSRFToken } from "/js/api.js";
      import {
        paginate,
        renderPagination,
        updatePagination,
        initPagination,
        createTableFilter,
        filterTable,
        setupTableFilters,
        handleApiError,
        handleApiSuccess,
        setupButtonLoading,
      } from "/admin/common.js";
      import { refreshSosBadge } from "/js/utils/sosBadge.js";

      const session = await initAdminPage({ activePage: "sos-alerts" });
      const csrfToken = ensureCSRFToken();

      let allAlerts = [];
      let allBoats = [];
      let allUsers = [];
      let currentPage = 1;
      const pageSize = 25;

      // Create standardized filter function (no search/filter UI on this page yet, but ready for future)
      const alertFilter = createTableFilter({
        searchFields: ["message"],
        exactFilters: [
          { field: "status", value: "statusFilter" },
        ],
      });

      async function loadAlerts() {
        allAlerts = await api.alerts.list();
        allBoats = await api.boats.list();
        allUsers = await api.users.list();
        renderTable();
        await refreshSosBadge();
      }

      function renderTable() {
        const tbody = document.getElementById("alertsTableBody");

        const pagination = paginate(allAlerts, currentPage, pageSize);

        if (pagination.items.length === 0) {
          tbody.innerHTML =
            '<tr><td colspan="6" class="table-message">No emergency alerts recorded.</td></tr>';
        } else {
          tbody.innerHTML = pagination.items
            .map((a) => {
              const boat = allBoats.find((b) => b.id === a.boat_id) || {
                name: "General / Unknown",
              };
              const sender = allUsers.find(
                (u) => u.id === a.sent_by_user_id,
              ) || { full_name: "Passenger/Crew" };
              const role = a.sender_role || "Passenger";
              const time = new Date(a.created_at).toLocaleString();
              const isOpen = a.status === "Open";
              const ackUser = allUsers.find((u) => u.id === a.acknowledged_by);
              const ackInfo =
                a.status === "Acknowledged" && (ackUser || a.acknowledged_at)
                  ? `<br><small class="text-muted text-xs">by ${ui.escapeHtml(ackUser ? ackUser.full_name : "Unknown")}${a.acknowledged_at ? " · " + new Date(a.acknowledged_at).toLocaleString() : ""}</small>`
                  : "";
              const rowClass = isOpen ? "alert-row open" : "alert-row";

              return `
            <tr class="${rowClass}">
              <td><strong>${ui.escapeHtml(boat.name)}</strong></td>
              <td><strong>${ui.escapeHtml(sender.full_name)}</strong><br><span class="badge badge-neutral text-xs">${ui.escapeHtml(role)}</span></td>
              <td><span class="alert-message ${isOpen ? "open" : ""}">${ui.escapeHtml(a.message)}</span></td>
              <td><span class="badge badge-${ui.escapeHtml(a.status.toLowerCase())}">${ui.escapeHtml(a.status)}</span>${ackInfo}</td>
              <td>${time}</td>
              <td>
                ${isOpen ? `<button class="btn btn-primary btn-sm" data-action="acknowledge" data-id="${a.id}">Acknowledge</button>` : `<span class="text-sm text-muted">Acknowledged</span>`}
              </td>
            </tr>
          `;
            })
            .join("");
        }

        // Update pagination controls in-place
        updatePagination("#paginationContainer", pagination);
      }

      initPagination("#paginationContainer", (page) => {
        currentPage = page;
        renderTable();
      });

      const acknowledgeAlert = async (id, btn) => {
        ui.confirm(
          "Are you sure you want to acknowledge this SOS alert?",
          async () => {
            const resetBtn = setupButtonLoading(btn, "Acknowledging...");
            try {
              await api.alerts.acknowledge(id, session.user_id, csrfToken);
              handleApiSuccess("SOS alert acknowledged.");
              await loadAlerts();
            } catch (err) {
              handleApiError(err);
              resetBtn();
            }
          },
        );
      };

      document.getElementById("alertsTableBody").onclick = (e) => {
        const btn = e.target.closest('button[data-action="acknowledge"]');
        if (btn) acknowledgeAlert(btn.dataset.id, btn);
      };

      document.getElementById("pollAlertsBtn").onclick = loadAlerts;

      // Reuse BroadcastChannel across page navigations to avoid leaks
      if (!window.__sosChannel) {
        window.__sosChannel = new BroadcastChannel("sos-alerts");
      }
      const alertChannel = window.__sosChannel;
      alertChannel.onmessage = (e) => {
        if (e.data === "alerts-changed") {
          loadAlerts();
          ui.showToast("New SOS Alert received!", "error");
        }
      };

      loadAlerts();
    </script>
  </body>
</html>
