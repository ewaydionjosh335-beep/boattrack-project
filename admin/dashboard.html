<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Admin Dashboard - BoatTrack</title>
    <link rel="stylesheet" href="/css/tokens.css" />
    <link rel="stylesheet" href="/css/base.css" />
    <link rel="stylesheet" href="/css/components.css" />
    <link rel="stylesheet" href="/css/layout.css" />
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="/js/lib/leaflet.css" />
    <style>
      .stats-grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
        gap: 1rem;
        margin-bottom: 2rem;
      }
      .stat-card {
        background: white;
        padding: 1.25rem;
        border-radius: var(--radius-md);
        border: 1px solid var(--border);
        box-shadow: var(--shadow-sm);
      }
      .stat-card h4 {
        color: var(--text-muted);
        font-size: 0.9rem;
        margin-bottom: 0.5rem;
      }
      .stat-card .val {
        font-size: 1.75rem;
        font-weight: 700;
        color: var(--primary);
      }
      .map-container-grid {
        display: grid;
        grid-template-columns: 2fr 1fr;
        gap: 1.5rem;
      }
      #vesselMap {
        height: 450px;
        border-radius: var(--radius-md);
        border: 1px solid var(--border);
      }
      .terminal-marker,
      .boat-marker {
        background: transparent !important;
        border: none !important;
      }
      @media (max-width: 992px) {
        .map-container-grid {
          grid-template-columns: 1fr;
        }
      }
    </style>
  </head>
  <body class="admin-layout">
    <!-- SIDEBAR -->
    <div id="sidebarContainer"></div>

    <!-- MAIN -->
    <div class="admin-main">
      <header class="admin-header">
        <h2>Dashboard & Vessel Tracking</h2>
        <span id="adminName" style="font-weight: 600">Administrator</span>
      </header>

      <div class="admin-content">
        <div class="stats-grid">
          <div class="stat-card">
            <h4>Total Users</h4>
            <div class="val" id="statUsers">0</div>
          </div>
          <div class="stat-card">
            <h4>Verified Boats</h4>
            <div class="val" id="statBoats">0</div>
          </div>
          <div class="stat-card">
            <h4>Pending Boat Verifications</h4>
            <div
              class="val"
              id="statPendingBoats"
              style="color: var(--warning, #d97706)"
            >
              0
            </div>
          </div>
          <div class="stat-card">
            <h4>Pending Crew Verifications</h4>
            <div
              class="val"
              id="statPendingCrew"
              style="color: var(--warning, #d97706)"
            >
              0
            </div>
          </div>
          <div class="stat-card">
            <h4>Today's Trips</h4>
            <div class="val" id="statTrips">0</div>
          </div>
          <div class="stat-card">
            <h4>Open SOS Alerts</h4>
            <div class="val" id="statSos" style="color: var(--danger)">0</div>
          </div>
          <div class="stat-card">
            <h4>Approved Bookings</h4>
            <div class="val" id="statBookings">0</div>
          </div>
        </div>

        <div class="card">
          <div
            style="
              display: flex;
              justify-content: space-between;
              align-items: center;
              margin-bottom: 1rem;
            "
          >
            <h3>Binangonan Port & Laguna de Bay Vessel Radar</h3>
            <button id="simulateGpsBtn" class="btn btn-primary btn-sm">
              Simulate Movement & GPS Update
            </button>
          </div>
          <div class="map-container-grid">
            <div id="vesselMap"></div>
            <div
              style="
                background: var(--bg-main);
                padding: 1rem;
                border-radius: var(--radius-md);
                border: 1px solid var(--border);
                max-height: 450px;
                overflow-y: auto;
              "
            >
              <h4 style="margin-bottom: 0.75rem">Active Vessels & Terminals</h4>
              <div id="vesselListContainer">
                <p style="color: var(--text-muted); font-size: 0.9rem">
                  Loading vessels...
                </p>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>

    <script type="module">
      import { api } from "/js/api.js";
      import { seedDatabase } from "/js/seed.js";
      import { auth } from "/js/auth.js";
      import { ui } from "/js/ui.js";
      import { refreshSosBadge } from "/js/utils/sosBadge.js";
      import { AdminSidebar } from "/admin/_sidebar.js";
      import { adminLogout } from "/admin/common.js";

      // Load Leaflet dynamically - using local ES module wrapper
      import L from "/js/lib/leaflet.mjs";

      await seedDatabase();
      const session = await auth.requireAuth(["administrator"]);
      if (!session) throw new Error("Unauthorized");

      // Load shared sidebar
      AdminSidebar.mount({
        activePage: "dashboard",
        userName: session.full_name || "Administrator",
      });

      document.getElementById("adminName").textContent =
        session.full_name || "Administrator";

      async function refreshStats() {
        try {
          const users = await api.users.list();
          const boats = await api.boats.list();
          const crewApps = await api.crewApplications.list();
          const trips = await api.trips.list();
          const bookings = await api.bookings.list();
          const alerts = await api.alerts.list();

          document.getElementById("statUsers").textContent = users.length;
          document.getElementById("statBoats").textContent = boats.filter(
            (b) => b.registration_status === "Verified",
          ).length;
          document.getElementById("statPendingBoats").textContent =
            boats.filter((b) => b.registration_status === "Pending").length;
          document.getElementById("statPendingCrew").textContent =
            crewApps.filter(
              (a) => a.stage === "Pending Admin Verification",
            ).length;
          const todayStr = new Date().toDateString();
          const todaysTrips = trips.filter(
            (t) => new Date(t.departure_time).toDateString() === todayStr,
          );
          document.getElementById("statTrips").textContent = todaysTrips.length;
          document.getElementById("statSos").textContent = alerts.filter(
            (a) => a.status === "Open",
          ).length;
          await refreshSosBadge();
          document.getElementById("statBookings").textContent = bookings.filter(
            (b) => api.bookings.isApproved(b),
          ).length;
        } catch (err) {
          console.error("Failed to refresh dashboard stats:", err);
        }
      }

      await refreshStats();
      ui.setupSync(refreshStats, 10000);

      const map = L.map("vesselMap").setView([14.4445, 121.1911], 12);
      L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
        maxZoom: 19,
        attribution: "&copy; OpenStreetMap contributors",
      }).addTo(map);

      let mapMarkers = [];
      let refreshMapLock = false;

      async function refreshMap() {
        if (refreshMapLock) return;
        refreshMapLock = true;
        try {
          mapMarkers.forEach((m) => map.removeLayer(m));
          mapMarkers = [];

          const terminals = await api.terminals.list();
          const boats = await api.boats.list();
          const gpsLogs = await api.gpsLogs.list();

          const listContainer = document.getElementById("vesselListContainer");
          let htmlList =
            '<ul style="display: flex; flex-direction: column; gap: 0.75rem;">';

          terminals.forEach((term) => {
            // Bad legacy coordinates used to throw "Invalid LatLng" and kill the whole map.
            const lat = Number(term.lat);
            const lng = Number(term.lng);
            const hasCoords = Number.isFinite(lat) && Number.isFinite(lng);
            const markerLat = hasCoords ? lat : 14.4645;
            const markerLng = hasCoords ? lng : 121.1918;

            const marker = L.marker([markerLat, markerLng], {
              icon: L.divIcon({
                className: "terminal-marker",
                html: '<div style="display:flex;align-items:center;justify-content:center;width:32px;height:32px;background:#0d1b2a;color:#ffffff;border:2px solid #0077b6;border-radius:50%;box-shadow:0 2px 5px rgba(0,0,0,0.3);"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="2"><path d="M3 21h18"/><path d="M5 21V7l7-4 7 4v14"/><path d="M9 21v-6h6v6"/></svg></div>',
                iconSize: [32, 32],
                iconAnchor: [16, 16],
                popupAnchor: [0, -16],
              }),
            })
              .addTo(map)
              .bindPopup(
                `<strong>${ui.escapeHtml(term.name)}</strong><br>Location: ${ui.escapeHtml(term.location)}<br>Coast Guard: ${ui.escapeHtml(term.coast_guard_personnel)}`,
              );
            mapMarkers.push(marker);

            htmlList += `<li style="background:white; padding:0.5rem; border-radius:4px; border:1px solid var(--border); font-size:0.85rem;">
            <strong>Terminal: ${ui.escapeHtml(term.name)}</strong><br><span style="color:var(--text-muted);">PCG: ${ui.escapeHtml(term.coast_guard_personnel)}</span>
          </li>`;
          });

          boats.forEach((boat) => {
            if (
              boat.registration_status !== "Verified" ||
              boat.boat_status !== "Active"
            )
              return;
            const boatLogs = gpsLogs.filter((l) => l.boat_id === boat.id);
            const lastLog =
              boatLogs.length > 0
                ? boatLogs[boatLogs.length - 1]
                : api.gpsLogs.demoPosition();

            const marker = L.marker([lastLog.lat, lastLog.lng], {
              icon: L.divIcon({
                className: "boat-marker",
                html: '<div style="display:flex;align-items:center;justify-content:center;width:32px;height:32px;background:#2a9d8f;color:#ffffff;border:2px solid #ffffff;border-radius:50%;box-shadow:0 2px 5px rgba(0,0,0,0.3);"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="2"><path d="M2 21c.6.5 1.2 1 2.5 1 2.5 0 2.5-2 5-2 1.3 0 1.9.5 2.5 1 .6.5 1.2 1 2.5 1 2.5 0 2.5-2 5-2 1.3 0 1.9.5 2.5 1"/><path d="M19.38 20A11.6 11.6 0 0 0 21 14l-9-4-9 4c0 2.3.6 4.5 1.62 6"/><path d="M12 10V4l3 2-3 2"/></svg></div>',
                iconSize: [32, 32],
                iconAnchor: [16, 16],
                popupAnchor: [0, -16],
              }),
            })
              .addTo(map)
              .bindPopup(
                `<strong>Vessel: ${ui.escapeHtml(boat.name)}</strong><br>Type: ${ui.escapeHtml(boat.boat_type)}<br>Max Load: ${ui.escapeHtml(boat.max_load_kg)} kg`,
              );
            mapMarkers.push(marker);

            htmlList += `<li style="background:white; padding:0.5rem; border-radius:4px; border:1px solid var(--border); font-size:0.85rem; cursor:pointer;" data-action="focus" data-lat="${lastLog.lat}" data-lng="${lastLog.lng}">
            <strong>Vessel: ${ui.escapeHtml(boat.name)}</strong><br><span style="color:var(--success);">Active</span> (${ui.escapeHtml(boat.boat_type)})
          </li>`;
          });

          htmlList += "</ul>";
          listContainer.innerHTML = htmlList;
        } finally {
          refreshMapLock = false;
        }
      }

      window.focusBoat = (lat, lng) => {
        map.setView([lat, lng], 14);
      };

      document.getElementById("vesselListContainer").onclick = (e) => {
        const item = e.target.closest('[data-action="focus"]');
        if (item)
          window.focusBoat(Number(item.dataset.lat), Number(item.dataset.lng));
      };

      document.getElementById("simulateGpsBtn").onclick = async () => {
        try {
          await api.gpsLogs.simulateMovement();
          await refreshMap();
          await refreshStats();
          ui.showToast(
            "GPS vessel movement simulated for active trips in Laguna de Bay.",
            "success",
          );
        } catch (err) {
          ui.showToast(err.message || "Simulation failed.", "error");
        }
      };

      refreshMap();
    </script>
  </body>
</html>
