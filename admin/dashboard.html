<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Admin Dashboard - BoatTrack</title>
    <link rel="stylesheet" href="/css/tokens.css" />
    <link rel="stylesheet" href="/css/base.css" />
    <link rel="stylesheet" href="/css/components.css" />
    <link rel="stylesheet" href="/css/layout.css" />
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="/js/lib/leaflet.css" />
    <style>
      .stats-grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
        gap: 1rem;
        margin-bottom: 2rem;
      }
      .stat-card {
        background: white;
        padding: 1.25rem;
        border-radius: var(--radius-md);
        border: 1px solid var(--border);
        box-shadow: var(--shadow-sm);
      }
      .stat-card h4 {
        color: var(--text-muted);
        font-size: 0.9rem;
        margin-bottom: 0.5rem;
      }
      .stat-card .val {
        font-size: 1.75rem;
        font-weight: 700;
        color: var(--primary);
      }
      .map-container-grid {
        display: grid;
        grid-template-columns: 2fr 1fr;
        gap: 1.5rem;
      }
      #vesselMap {
        height: 450px;
        border-radius: var(--radius-md);
        border: 1px solid var(--border);
      }
      .terminal-marker,
      .boat-marker {
        background: transparent !important;
        border: none !important;
      }
      @media (max-width: 992px) {
        .map-container-grid {
          grid-template-columns: 1fr;
        }
      }
    </style>
  </head>
  <body class="admin-layout">
    <!-- SIDEBAR -->
    <div id="sidebarContainer"></div>

    <!-- MAIN -->
    <div class="admin-main">
      <header class="admin-header">
        <h2>Dashboard & Vessel Tracking</h2>
        <span id="adminName" style="font-weight: 600">Administrator</span>
      </header>

      <div class="admin-content">
        <div class="stats-grid">
          <div class="stat-card">
            <h4>Total Users</h4>
            <div class="val" id="statUsers">0</div>
          </div>
          <div class="stat-card">
            <h4>Verified Boats</h4>
            <div class="val" id="statBoats">0</div>
          </div>
          <div class="stat-card">
            <h4>Pending Boat Verifications</h4>
            <div
              class="val"
              id="statPendingBoats"
              style="color: var(--warning, #d97706)"
            >
              0
            </div>
          </div>
          <div class="stat-card">
            <h4>Pending Crew Verifications</h4>
            <div
              class="val"
              id="statPendingCrew"
              style="color: var(--warning, #d97706)"
            >
              0
            </div>
          </div>
          <div class="stat-card">
            <h4>Today's Trips</h4>
            <div class="val" id="statTrips">0</div>
          </div>
          <div class="stat-card">
            <h4>Open SOS Alerts</h4>
            <div class="val" id="statSos" style="color: var(--danger)">0</div>
          </div>
          <div class="stat-card">
            <h4>Approved Bookings</h4>
            <div class="val" id="statBookings">0</div>
          </div>
        </div>

        <div class="card">
          <div
            style="
              display: flex;
              justify-content: space-between;
              align-items: center;
              margin-bottom: 1rem;
            "
          >
            <h3>Binangonan Port & Laguna de Bay Vessel Radar</h3>
            <button id="simulateGpsBtn" class="btn btn-primary btn-sm">
              Simulate Movement & GPS Update
            </button>
          </div>
          <div class="map-container-grid">
            <div id="vesselMap"></div>
            <div
              style="
                background: var(--bg-main);
                padding: 1rem;
                border-radius: var(--radius-md);
                border: 1px solid var(--border);
                max-height: 450px;
                overflow-y: auto;
              "
            >
              <h4 style="margin-bottom: 0.75rem">Active Vessels & Terminals</h4>
              <div id="vesselListContainer">
                <p style="color: var(--text-muted); font-size: 0.9rem">
                  Loading vessels...
                </p>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>

    <script type="module">
      import { api } from "/js/api.js";
      import { auth } from "/js/auth.js";
      import { ui } from "/js/ui.js";
      import { AdminSidebar } from "/admin/_sidebar.js";
      import { initAdminPage } from "/admin/init.js";
import { handleApiError, handleApiSuccess } from "/admin/common.js";
      import { refreshSosBadge } from "/js/utils/sosBadge.js";
      import { initDashboardMap, refreshMap, simulateGpsMovement } from "/admin/dashboardMap.js";

      const session = await initAdminPage({ activePage: "dashboard" });

      document.getElementById("adminName").textContent =
        session.full_name || "Administrator";

      async function refreshStats() {
        try {
          const users = await api.users.list();
          const boats = await api.boats.list();
          const crewApps = await api.crewApplications.list();
          const trips = await api.trips.list();
          const bookings = await api.bookings.list();
          const alerts = await api.alerts.list();

          document.getElementById("statUsers").textContent = users.length;
          document.getElementById("statBoats").textContent = boats.filter(
            (b) => b.registration_status === "Verified",
          ).length;
          document.getElementById("statPendingBoats").textContent =
            boats.filter((b) => b.registration_status === "Pending").length;
          document.getElementById("statPendingCrew").textContent =
            crewApps.filter(
              (a) => a.stage === "Pending Admin Verification",
            ).length;
          const todayStr = new Date().toDateString();
          const todaysTrips = trips.filter(
            (t) => new Date(t.departure_time).toDateString() === todayStr,
          );
          document.getElementById("statTrips").textContent = todaysTrips.length;
          document.getElementById("statSos").textContent = alerts.filter(
            (a) => a.status === "Open",
          ).length;
          await refreshSosBadge();
          document.getElementById("statBookings").textContent = bookings.filter(
            (b) => api.bookings.isApproved(b),
          ).length;
        } catch (err) {
          handleApiError(err, { toast: false, fallbackMessage: "Failed to refresh dashboard stats" });
        }
      }

      await refreshStats();
      ui.setupSync(refreshStats, 10000);

      // Initialize map using the extracted module
      const mapController = initDashboardMap({
        mapElementId: "vesselMap",
        onMapClick: (lat, lng) => {
          if (mapController && mapController.map) {
            mapController.map.setView([lat, lng], 14);
          }
        },
      });

      // Initial map load
      if (mapController) {
        await mapController.refresh({ listContainer: document.getElementById("vesselListContainer") });
      }

      // Simulate GPS button
      document.getElementById("simulateGpsBtn").onclick = async () => {
        try {
          const activeCount = await simulateGpsMovement();
          if (activeCount === 0) {
            handleApiError("No active trips to simulate GPS movement for.", { toast: true });
            return;
          }
          if (mapController) {
            await mapController.refresh({ listContainer: document.getElementById("vesselListContainer") });
          }
          await refreshStats();
          handleApiSuccess(
            `GPS vessel movement simulated for ${activeCount} active trip(s) in Laguna de Bay.`,
          );
        } catch (err) {
          handleApiError(err, { fallbackMessage: "Simulation failed." });
        }
      };
    </script>
  </body>
</html>
