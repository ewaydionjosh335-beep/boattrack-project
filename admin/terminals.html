<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Terminals - BoatTrack Admin</title>
    <link rel="stylesheet" href="/css/tokens.css" />
    <link rel="stylesheet" href="/css/base.css" />
    <link rel="stylesheet" href="/css/components.css" />
    <link rel="stylesheet" href="/css/layout.css" />
  </head>
  <body class="admin-layout">
    <!-- SIDEBAR -->
    <div id="sidebarContainer"></div>

    <!-- MAIN -->
    <div class="admin-main">
      <header class="admin-header">
        <h2>Terminal Stations & Coast Guard Assignment</h2>
        <button id="openAddModalBtn" class="btn btn-primary">
          Add New Terminal
        </button>
      </header>

      <div class="admin-content">
        <div class="table-container">
          <table>
            <thead>
              <tr>
                <th>Terminal Name</th>
                <th>Location</th>
                <th>Assigned Coast Guard Personnel</th>
                <th>Assigned Boats</th>
                <th>Actions</th>
              </tr>
            </thead>
            <tbody id="terminalsTableBody">
              <tr>
                <td colspan="5" style="text-align: center">
                  Loading terminals...
                </td>
              </tr>
            </tbody>
          </table>
        </div>
        <div id="paginationContainer" style="margin-top: 1rem"></div>
      </div>
    </div>

    <!-- ADD/EDIT TERMINAL MODAL -->
    <div id="termModal" class="modal-backdrop" style="display: none">
      <div class="modal">
        <div class="modal-header">
          <h3 id="modalTitle">Add Terminal</h3>
          <button class="btn btn-outline btn-sm" id="closeModalBtn">
            &times;
          </button>
        </div>
        <form id="termForm">
          <div class="modal-body">
            <input type="hidden" id="editTermId" />
            <div class="form-group">
              <label class="form-label">Terminal Name</label>
              <input
                type="text"
                id="termName"
                class="form-control"
                required
                placeholder="Binangonan Main Port"
              />
            </div>
            <div class="form-group">
              <label class="form-label">Location / Address</label>
              <input
                type="text"
                id="termLocation"
                class="form-control"
                required
                placeholder="Binangonan, Rizal"
              />
            </div>
            <div class="form-group">
              <label class="form-label">Latitude</label>
              <input
                type="number"
                step="any"
                min="-90"
                max="90"
                id="termLat"
                class="form-control"
                placeholder="14.3950"
                title="Required for weather and risk assessment"
              />
            </div>
            <div class="form-group">
              <label class="form-label">Longitude</label>
              <input
                type="number"
                step="any"
                min="-180"
                max="180"
                id="termLng"
                class="form-control"
                placeholder="121.1950"
                title="Required for weather and risk assessment"
              />
            </div>
            <div class="form-group">
              <label class="form-label">Coast Guard Personnel Name</label>
              <input
                type="text"
                id="termCoastGuard"
                class="form-control"
                required
                placeholder="PCG Cdr. Edgardo Mendoza"
              />
            </div>
            <div id="modalError" class="error-text"></div>
          </div>
          <div class="modal-footer">
            <button type="button" class="btn btn-outline" id="cancelModalBtn">
              Cancel
            </button>
            <button type="submit" class="btn btn-primary">Save Terminal</button>
          </div>
        </form>
      </div>
    </div>

    <!-- MANAGE BOATS MODAL -->
    <div id="boatsModal" class="modal-backdrop" style="display: none">
      <div class="modal modal-lg">
        <div class="modal-header">
          <h3 id="boatsModalTitle">Manage Boats</h3>
          <button class="btn btn-outline btn-sm" id="closeBoatsModalBtn">
            &times;
          </button>
        </div>
        <div class="modal-body">
          <input type="hidden" id="boatsTermId" />
          <div class="table-container">
            <table>
              <thead>
                <tr>
                  <th>Boat Name</th>
                  <th>Type</th>
                  <th>Status</th>
                  <th>Assigned</th>
                  <th>Actions</th>
                </tr>
              </thead>
              <tbody id="boatsTableBody">
                <tr>
                  <td colspan="5" style="text-align: center">
                    Loading boats...
                  </td>
                </tr>
              </tbody>
            </table>
          </div>
        </div>
        <div class="modal-footer">
          <button
            type="button"
            class="btn btn-primary"
            id="closeBoatsModalBtn2"
          >
            Close
          </button>
        </div>
      </div>
    </div>

    <script type="module">
      import { api } from "/js/api.js";
      import { seedDatabase } from "/js/seed.js";
      import { auth } from "/js/auth.js";
      import { ui } from "/js/ui.js";
      import { refreshSosBadge } from "/js/utils/sosBadge.js";
      import { AdminSidebar } from "/admin/_sidebar.js";
      import {
        paginate,
        renderPagination,
        initPagination,
        setupModalAccessibility,
      } from "/admin/common.js";

      await seedDatabase();
      const session = await auth.requireAuth(["administrator"]);
      if (!session) throw new Error("Unauthorized");

      // Load shared sidebar
      AdminSidebar.mount({
        activePage: "terminals",
        userName: session.full_name || "Administrator",
      });

      let allTerminals = [];
      let currentPage = 1;
      const pageSize = 25;

      async function loadTerminals() {
        allTerminals = await api.terminals.list();
        // Fetch assigned boats for each terminal
        for (const term of allTerminals) {
          const boats = await api.terminals.listBoats(term.id);
          term.assignedBoats = boats;
        }
        renderTable();
        await refreshSosBadge();
      }

      function renderTable() {
        const tbody = document.getElementById("terminalsTableBody");

        const pagination = paginate(allTerminals, currentPage, pageSize);

        if (pagination.items.length === 0) {
          tbody.innerHTML =
            '<tr><td colspan="5" style="text-align: center;">No terminals found.</td></tr>';
        } else {
          tbody.innerHTML = pagination.items
            .map(
              (t) => `
          <tr>
            <td><strong>${ui.escapeHtml(t.name)}</strong></td>
            <td>${ui.escapeHtml(t.location)}</td>
            <td><span class="badge" style="background:#e2e8f0; color:#334155;">${ui.escapeHtml(t.coast_guard_personnel)}</span></td>
            <td><span class="badge" style="background:#dbeafe; color:#1e40af;">${t.assignedBoats?.length || 0} boat(s)</span></td>
              <td>
                <div class="table-actions">
                  <button class="btn btn-outline btn-sm" data-action="edit" data-id="${t.id}">Edit</button>
                  <button class="btn btn-outline btn-sm" data-action="boats" data-id="${t.id}">Manage Boats</button>
                  <button class="btn btn-danger btn-sm" data-action="delete" data-id="${t.id}">Delete</button>
                </div>
              </td>
          </tr>
        `,
            )
            .join("");
        }

        // Render pagination controls
        const paginationContainer = document.getElementById(
          "paginationContainer",
        );
        if (paginationContainer) {
          paginationContainer.innerHTML = renderPagination(pagination);
        }
      }

      initPagination("#paginationContainer", (page) => {
        currentPage = page;
        renderTable();
      });

      const modal = document.getElementById("termModal");
      const { open: openModal, close: closeModal } = ui.modal(modal);
      // Apply accessibility enhancements
      let modalCleanup = null;
      const openWithA11y = () => {
        openModal();
        modalCleanup = setupModalAccessibility(modal);
      };
      const closeWithCleanup = () => {
        if (modalCleanup) modalCleanup();
        closeModal();
      };
      document.getElementById("closeModalBtn").onclick = closeWithCleanup;
      document.getElementById("cancelModalBtn").onclick = closeWithCleanup;

      document.getElementById("openAddModalBtn").onclick = () => {
        document.getElementById("modalTitle").textContent = "Add Terminal";
        document.getElementById("editTermId").value = "";
        document.getElementById("termName").value = "";
        document.getElementById("termLocation").value = "";
        document.getElementById("termLat").value = "";
        document.getElementById("termLng").value = "";
        document.getElementById("termCoastGuard").value = "";
        document.getElementById("modalError").textContent = "";
        openWithA11y();
      };

      const editTerm = (id) => {
        const term = allTerminals.find((t) => t.id === id);
        if (!term) return;
        document.getElementById("modalTitle").textContent = "Edit Terminal";
        document.getElementById("editTermId").value = term.id;
        document.getElementById("termName").value = term.name;
        document.getElementById("termLocation").value = term.location;
        document.getElementById("termLat").value = term.lat ?? "";
        document.getElementById("termLng").value = term.lng ?? "";
        document.getElementById("termCoastGuard").value =
          term.coast_guard_personnel;
        document.getElementById("modalError").textContent = "";
        openWithA11y();
      };

      const deleteTerm = async (id) => {
        ui.confirm(
          "Are you sure you want to delete this terminal?",
          async () => {
            try {
              await api.terminals.delete(id);
              ui.showToast("Terminal deleted successfully.", "success");
              await loadTerminals();
            } catch (err) {
              ui.showToast(err.message, "error");
            }
          },
        );
      };

      document.getElementById("terminalsTableBody").onclick = (e) => {
        const btn = e.target.closest("button[data-action]");
        if (!btn) return;
        if (btn.dataset.action === "edit") editTerm(btn.dataset.id);
        else if (btn.dataset.action === "boats") manageBoats(btn.dataset.id);
        else if (btn.dataset.action === "delete") deleteTerm(btn.dataset.id);
      };

      document.getElementById("termForm").onsubmit = async (e) => {
        e.preventDefault();
        const id = document.getElementById("editTermId").value;
        const name = document.getElementById("termName").value.trim();
        const location = document.getElementById("termLocation").value.trim();
        const lat = document.getElementById("termLat").value.trim();
        const lng = document.getElementById("termLng").value.trim();
        const coast_guard_personnel = document
          .getElementById("termCoastGuard")
          .value.trim();
        const errBox = document.getElementById("modalError");
        errBox.textContent = "";

        // Validate coordinates: both must be provided or both empty
        const hasLat = lat !== "";
        const hasLng = lng !== "";
        if (hasLat !== hasLng) {
          errBox.textContent =
            "Both latitude and longitude must be provided together, or both left empty.";
          return;
        }

        try {
          const data = {
            name,
            location,
            coast_guard_personnel,
          };
          // Only include coordinates if both are provided or both are cleared.
          if (hasLat && hasLng) {
            data.lat = lat;
            data.lng = lng;
          } else if (!hasLat && !hasLng && id) {
            // Explicitly clearing both on edit
            data.lat = null;
            data.lng = null;
          }
          if (id) {
            await api.terminals.update(id, data);
            ui.showToast("Terminal updated successfully.", "success");
          } else {
            await api.terminals.create(data);
            ui.showToast("Terminal created successfully.", "success");
          }
          closeModal();
          await loadTerminals();
        } catch (err) {
          errBox.textContent = err.message;
        }
      };

      // --- Boat Management ---
      const boatsModal = document.getElementById("boatsModal");
      const { open: openBoatsModal, close: closeBoatsModal } =
        ui.modal(boatsModal);
      // Apply accessibility to boats modal
      let boatsModalCleanup = null;
      const openBoatsWithA11y = () => {
        openBoatsModal();
        boatsModalCleanup = setupModalAccessibility(boatsModal);
      };
      const closeBoatsWithCleanup = () => {
        if (boatsModalCleanup) boatsModalCleanup();
        closeBoatsModal();
      };

      document.getElementById("closeBoatsModalBtn").onclick =
        closeBoatsWithCleanup;
      document.getElementById("closeBoatsModalBtn2").onclick =
        closeBoatsWithCleanup;

      async function manageBoats(termId) {
        document.getElementById("boatsTermId").value = termId;
        document.getElementById("boatsModalTitle").textContent =
          `Manage Boats - ${allTerminals.find((t) => t.id === termId)?.name}`;
        await loadTerminalBoats(termId);
        openBoatsWithA11y();
      }

      async function loadTerminalBoats(termId) {
        const tbody = document.getElementById("boatsTableBody");
        const term = allTerminals.find((t) => t.id === termId);
        const assignedBoats = term?.assignedBoats || [];
        const allBoats = await api.boats.list();

        if (allBoats.length === 0) {
          tbody.innerHTML =
            '<tr><td colspan="5" style="text-align: center;">No boats in system.</td></tr>';
          return;
        }

        tbody.innerHTML = allBoats
          .map((b) => {
            const isAssigned = assignedBoats.some((ab) => ab.id === b.id);
            return `
          <tr>
            <td>${ui.escapeHtml(b.name)}</td>
            <td>${ui.escapeHtml(b.boat_type)}</td>
            <td><span class="badge" style="background:${b.boat_status === "Active" ? "#dcfce7" : "#fee2e2"}; color:${b.boat_status === "Active" ? "#166534" : "#991b1b"}">${ui.escapeHtml(b.boat_status)}</span></td>
            <td>${isAssigned ? '<span class="badge" style="background:#dbeafe; color:#1e40af;">Yes</span>' : '<span class="badge" style="background:#f1f5f9; color:#64748b;">No</span>'}</td>
            <td>
              ${
                isAssigned
                  ? `<button class="btn btn-danger btn-sm" data-action="unassign" data-boat-id="${b.id}">Unassign</button>`
                  : `<button class="btn btn-primary btn-sm" data-action="assign" data-boat-id="${b.id}">Assign</button>`
              }
            </td>
          </tr>
        `;
          })
          .join("");

        // Add click handlers for assign/unassign
        tbody.querySelectorAll("button[data-action]").forEach((btn) => {
          btn.onclick = async (e) => {
            const boatId = e.target.dataset.boatId;
            const action = e.target.dataset.action;
            if (action === "assign") {
              await assignBoatToTerminal(termId, boatId);
            } else if (action === "unassign") {
              await unassignBoatFromTerminal(termId, boatId);
            }
            await loadTerminalBoats(termId);
            await loadTerminals(); // Refresh main table
          };
        });
      }

      async function assignBoatToTerminal(termId, boatId) {
        try {
          await api.boats.update(boatId, { home_terminal_id: termId });
          ui.showToast("Boat assigned to terminal successfully.", "success");
        } catch (err) {
          ui.showToast(err.message, "error");
        }
      }

      async function unassignBoatFromTerminal(termId, boatId) {
        try {
          await api.boats.update(boatId, { home_terminal_id: null });
          ui.showToast("Boat unassigned from terminal.", "success");
        } catch (err) {
          ui.showToast(err.message, "error");
        }
      }

      loadTerminals();
    </script>
  </body>
</html>
