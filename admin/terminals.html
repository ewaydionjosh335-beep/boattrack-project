  <!-- MAIN -->
  <div class="admin-main">
    <header class="admin-header">
      <h2>Terminal Stations & Coast Guard Assignment</h2>
      <button id="openAddModalBtn" class="btn btn-primary">Add New Terminal</button>
    </header>

    <div class="admin-content">
      <div class="table-container">
        <table>
          <thead>
            <tr>
              <th>Terminal Name</th>
              <th>Location</th>
              <th>Assigned Coast Guard Personnel</th>
              <th>Actions</th>
            </tr>
          </thead>
          <tbody id="terminalsTableBody">
            <tr><td colspan="5" style="text-align: center;">Loading terminals...</td></tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>

  <!-- ADD/EDIT TERMINAL MODAL -->
  <div id="termModal" class="modal-backdrop" style="display: none;">
    <div class="modal">
      <div class="modal-header">
        <h3 id="modalTitle">Add Terminal</h3>
        <button class="btn btn-outline btn-sm" id="closeModalBtn">&times;</button>
      </div>
      <form id="termForm">
        <div class="modal-body">
          <input type="hidden" id="editTermId">
          <div class="form-group">
            <label class="form-label">Terminal Name</label>
            <input type="text" id="termName" class="form-control" required placeholder="Binangonan Main Port">
          </div>
          <div class="form-group">
            <label class="form-label">Location / Address</label>
            <input type="text" id="termLocation" class="form-control" required placeholder="Binangonan, Rizal">
          </div>
          <div class="form-group">
            <label class="form-label">Coast Guard Personnel Name</label>
            <input type="text" id="termCoastGuard" class="form-control" required placeholder="PCG Cdr. Edgardo Mendoza">
          </div>
          <div id="modalError" class="error-text"></div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-outline" id="cancelModalBtn">Cancel</button>
          <button type="submit" class="btn btn-primary">Save Terminal</button>
        </div>
      </form>
    </div>
  </div>

  <script type="module">
    import { api } from '/js/api.js';
    import { seedDatabase } from '/js/seed.js';
    import { auth } from '/js/auth.js';
    import { ui } from '/js/ui.js';

    await seedDatabase();
    const session = await auth.requireAuth(['administrator']);
    if (!session) throw new Error('Unauthorized');

    let allTerminals = [];

    async function loadTerminals() {
      allTerminals = await api.terminals.list();
      renderTable();

      const alerts = await api.alerts.list();
      const openAlerts = alerts.filter(a => a.status === 'Open');
      const badge = document.getElementById('sosBadge');
      if (openAlerts.length > 0) {
        badge.textContent = openAlerts.length;
        badge.style.display = 'inline';
      } else {
        badge.style.display = 'none';
      }
    }

    function renderTable() {
      const tbody = document.getElementById('terminalsTableBody');
      if (allTerminals.length === 0) {
        tbody.innerHTML = '<tr><td colspan="5" style="text-align: center;">No terminals found.</td></tr>';
        return;
      }

      tbody.innerHTML = allTerminals.map(t => `
        <tr>
          <td><strong>${t.name}</strong></td>
          <td>${t.location}</td>
          <td><span class="badge" style="background:#e2e8f0; color:#334155;">${t.coast_guard_personnel}</span></td>
            <td>
              <div class="table-actions">
                <button class="btn btn-outline btn-sm" onclick="window.editTerm('${t.id}')">Edit</button>
                <button class="btn btn-danger btn-sm" onclick="window.deleteTerm('${t.id}')">Delete</button>
              </div>
            </td>
        </tr>
      `).join('');
    }

    const modal = document.getElementById('termModal');
    const closeModal = () => modal.style.display = 'none';
    document.getElementById('closeModalBtn').onclick = closeModal;
    document.getElementById('cancelModalBtn').onclick = closeModal;

    document.getElementById('openAddModalBtn').onclick = () => {
      document.getElementById('modalTitle').textContent = 'Add Terminal';
      document.getElementById('editTermId').value = '';
      document.getElementById('termName').value = '';
      document.getElementById('termLocation').value = '';
      document.getElementById('termCoastGuard').value = '';
      document.getElementById('modalError').textContent = '';
      modal.style.display = 'flex';
    };

    window.editTerm = (id) => {
      const term = allTerminals.find(t => t.id === id);
      if (!term) return;
      document.getElementById('modalTitle').textContent = 'Edit Terminal';
      document.getElementById('editTermId').value = term.id;
      document.getElementById('termName').value = term.name;
      document.getElementById('termLocation').value = term.location;
      document.getElementById('termCoastGuard').value = term.coast_guard_personnel;
      document.getElementById('modalError').textContent = '';
      modal.style.display = 'flex';
    };

    window.deleteTerm = async (id) => {
      ui.confirm('Are you sure you want to delete this terminal?', async () => {
        try {
          await api.terminals.delete(id);
          ui.showToast('Terminal deleted successfully.', 'success');
          await loadTerminals();

    
        } catch (err) {
          ui.showToast(err.message, 'error');
        }
      });
    };

    document.getElementById('termForm').onsubmit = async (e) => {
      e.preventDefault();
      const id = document.getElementById('editTermId').value;
      const name = document.getElementById('termName').value.trim();
      const location = document.getElementById('termLocation').value.trim();
      const coast_guard_personnel = document.getElementById('termCoastGuard').value.trim();
      const errBox = document.getElementById('modalError');
      errBox.textContent = '';

      try {
        if (id) {
          await api.terminals.update(id, { name, location, coast_guard_personnel });
          ui.showToast('Terminal updated successfully.', 'success');
        } else {
          await api.terminals.create({ name, location, coast_guard_personnel });
          ui.showToast('Terminal created successfully.', 'success');
        }
        closeModal();
        await loadTerminals();

    
      } catch (err) {
        errBox.textContent = err.message;
      }
    };

    loadTerminals();
    document.getElementById('logoutBtn').onclick = async (e) => {
      e.preventDefault();
      await api.auth.logout();
      window.location.href = '/login.html';
    };
  </script>
</body>
