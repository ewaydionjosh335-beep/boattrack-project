<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Trips History - BoatTrack Passenger</title>
  <link rel="stylesheet" href="/css/tokens.css">
  <link rel="stylesheet" href="/css/base.css">
  <link rel="stylesheet" href="/css/components.css">
  <link rel="stylesheet" href="/css/layout.css">
  <style>
    .portal-layout { display: flex; min-height: 100vh; background-color: var(--bg-main); }
    .portal-sidebar { width: 240px; background: var(--bg-sidebar); color: white; display: flex; flex-direction: column; position: fixed; top: 0; bottom: 0; left: 0; z-index: 200; }
    .portal-main { flex: 1; margin-left: 240px; display: flex; flex-direction: column; min-width: 0; }
    .portal-header { background: white; padding: 1rem 1.5rem; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; position: sticky; top: 0; z-index: 100; }
    .portal-content { padding: 1.5rem; flex: 1; }
    
    .bottom-tab-bar { display: none; position: fixed; bottom: 0; left: 0; right: 0; background: white; border-top: 1px solid var(--border); height: 60px; z-index: 1000; justify-content: space-around; align-items: center; }
    .bottom-tab-bar a { display: flex; flex-direction: column; align-items: center; justify-content: center; color: var(--text-muted); text-decoration: none; font-size: 0.7rem; font-weight: 500; gap: 2px; flex: 1; height: 100%; }
    .bottom-tab-bar a.active, .bottom-tab-bar a:hover { color: var(--teal); }

    @media (max-width: 992px) {
      .portal-sidebar { display: none !important; }
      .portal-main { margin-left: 0 !important; padding-bottom: 70px !important; }
      .bottom-tab-bar { display: flex !important; }
    }
  </style>
</head>
<body class="portal-layout">

  <!-- Desktop Sidebar -->
  <aside class="portal-sidebar">
    <div style="padding: 1.5rem; font-family: var(--font-display); font-weight: 700; font-size: 1.1rem; border-bottom: 1px solid var(--border-dark); display: flex; align-items: center; gap: 0.5rem; white-space: nowrap;">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M2 21c.6.5 1.2 1 2.5 1 2.5 0 2.5-2 5-2 1.3 0 1.9.5 2.5 1 .6.5 1.2 1 2.5 1 2.5 0 2.5-2 5-2 1.3 0 1.9.5 2.5 1"/><path d="M19.38 20A11.6 11.6 0 0 0 21 14l-9-4-9 4c0 2.3.6 4.5 1.62 6"/></svg>
      Passenger Portal
    </div>
    <div style="padding: 1rem 0; overflow-y: auto;">
      <a href="/passenger/dashboard.html" style="display: flex; align-items: center; gap: 0.75rem; padding: 0.75rem 1.5rem; color: #adb5bd; text-decoration: none; font-weight: 500;"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M3 9h18"/><path d="M9 21V9"/></svg> Dashboard</a>
      <a href="/passenger/schedules.html" style="display: flex; align-items: center; gap: 0.75rem; padding: 0.75rem 1.5rem; color: #adb5bd; text-decoration: none; font-weight: 500;"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg> Schedules</a>
      <a href="/passenger/my-bookings.html" style="display: flex; align-items: center; gap: 0.75rem; padding: 0.75rem 1.5rem; color: #adb5bd; text-decoration: none; font-weight: 500;"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/></svg> My Bookings</a>
      <a href="/passenger/my-trips.html" class="active" style="display: flex; align-items: center; gap: 0.75rem; padding: 0.75rem 1.5rem; color: white; text-decoration: none; font-weight: 500; background: rgba(255,255,255,0.05);"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 15s1-1 4-1 5 2 8 2 4-1 4-1V3s-1 1-4 1-5-2-8-2-4 1-4 1z"/><line x1="4" y1="22" x2="4" y2="15"/></svg> My Trips</a>
      <a href="/passenger/my-qr.html" style="display: flex; align-items: center; gap: 0.75rem; padding: 0.75rem 1.5rem; color: #adb5bd; text-decoration: none; font-weight: 500;"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/></svg> My QR</a>
      <a href="/passenger/sos.html" style="display: flex; align-items: center; gap: 0.75rem; padding: 0.75rem 1.5rem; color: #adb5bd; text-decoration: none; font-weight: 500;"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg> SOS Emergency</a>
      <a href="/passenger/profile.html" style="display: flex; align-items: center; gap: 0.75rem; padding: 0.75rem 1.5rem; color: #adb5bd; text-decoration: none; font-weight: 500;"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg> Profile</a>
      <a href="#" id="logoutBtn" style="display: flex; align-items: center; gap: 0.75rem; padding: 0.75rem 1.5rem; color: var(--danger); text-decoration: none; font-weight: 500;"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg> Logout</a>
    </div>
  </aside>

  <!-- Main Content Area -->
  <div class="portal-main">
    <header class="portal-header">
      <h2 style="font-size: 1.25rem; font-weight: 700; color: var(--primary);">My Trip History</h2>
    </header>

    <div class="portal-content">
      <!-- Filters -->
      <div class="card" style="margin-bottom: 1.5rem; padding: 1rem;">
        <div style="display: flex; gap: 1rem; flex-wrap: wrap; align-items: flex-end;">
          <div class="form-group" style="margin-bottom: 0; flex: 1; min-width: 140px;">
            <label class="form-label">From Date</label>
            <input type="date" id="filterFrom" class="form-control">
          </div>
          <div class="form-group" style="margin-bottom: 0; flex: 1; min-width: 140px;">
            <label class="form-label">To Date</label>
            <input type="date" id="filterTo" class="form-control">
          </div>
          <div class="form-group" style="margin-bottom: 0; flex: 1; min-width: 140px;">
            <label class="form-label">Trip Status</label>
            <select id="filterStatus" class="form-control">
              <option value="">All Statuses</option>
              <option value="Scheduled">Scheduled</option>
              <option value="Departed">Departed</option>
              <option value="Arrived">Arrived</option>
              <option value="Cancelled">Cancelled</option>
            </select>
          </div>
          <div>
            <button id="filterBtn" class="btn btn-primary btn-sm">Filter</button>
            <button id="resetBtn" class="btn btn-outline btn-sm">Reset</button>
          </div>
        </div>
      </div>

      <!-- Trips Table -->
      <div class="table-container">
        <table>
          <thead>
            <tr>
              <th>Ticket No.</th>
              <th>Vessel</th>
              <th>Route</th>
              <th>Departure</th>
              <th>Fare</th>
              <th>Discount Type</th>
              <th>Trip Status</th>
            </tr>
          </thead>
          <tbody id="tripsTableBody">
            <tr><td colspan="7" style="text-align: center; color: var(--text-muted);">Loading trip history...</td></tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>

  <!-- Mobile Bottom Tab Bar -->
  <nav class="bottom-tab-bar">
    <a href="/passenger/dashboard.html">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M3 9h18"/><path d="M9 21V9"/></svg>
      Dashboard
    </a>
    <a href="/passenger/schedules.html">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
      Schedules
    </a>
    <a href="/passenger/my-bookings.html">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/></svg>
      Bookings
    </a>
    <a href="/passenger/my-trips.html" class="active">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 15s1-1 4-1 5 2 8 2 4-1 4-1V3s-1 1-4 1-5-2-8-2-4 1-4 1z"/><line x1="4" y1="22" x2="4" y2="15"/></svg>
      My Trips
    </a>
    <a href="/passenger/my-qr.html">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/></svg>
      My QR
    </a>
  </nav>

  <script type="module">
    import { api } from '/js/api.js';
    import { auth } from '/js/auth.js';
    import { ui } from '/js/ui.js';

    const session = await auth.requireAuth(['passenger']);
    if (!session) throw new Error('Unauthorized');

    const passenger = await api.passengers.getByUserId(session.user_id);

    async function loadTrips() {
      const manifests = await api.manifests.list();
      const trips = await api.trips.list();
      const boats = await api.boats.list();
      const routes = await api.routes.list();
      const terminals = await api.terminals.list();

      const myManifests = manifests.filter(m => m.passenger_id === passenger.id);

      const fromDate = document.getElementById('filterFrom').value;
      const toDate = document.getElementById('filterTo').value;
      const statusFilter = document.getElementById('filterStatus').value;

      const tbody = document.getElementById('tripsTableBody');
      
      let filtered = myManifests.map(m => {
        const trip = trips.find(t => t.id === m.trip_id);
        const boat = trip ? boats.find(b => b.id === trip.boat_id) : null;
        const route = trip ? routes.find(r => r.id === trip.route_id) : null;
        const orig = route ? terminals.find(t => t.id === route.origin_terminal_id) : null;
        const dest = route ? terminals.find(t => t.id === route.destination_terminal_id) : null;
        return { manifest: m, trip, boat, route, orig, dest };
      }).filter(item => item.trip);

      if (fromDate) {
        filtered = filtered.filter(item => new Date(item.trip.departure_time) >= new Date(fromDate));
      }
      if (toDate) {
        const endD = new Date(toDate);
        endD.setHours(23, 59, 59, 999);
        filtered = filtered.filter(item => new Date(item.trip.departure_time) <= endD);
      }
      if (statusFilter) {
        filtered = filtered.filter(item => item.trip.trip_status === statusFilter);
      }

      // Sort newest departure first
      filtered.sort((a, b) => new Date(b.trip.departure_time) - new Date(a.trip.departure_time));

      if (filtered.length === 0) {
        tbody.innerHTML = `<tr><td colspan="7" style="text-align: center; color: var(--text-muted);">No trip history found matching filters.</td></tr>`;
        return;
      }

      tbody.innerHTML = filtered.map(({ manifest, trip, boat, orig, dest }) => `
        <tr>
          <td><code>${manifest.ticket_no || 'N/A'}</code></td>
          <td>${boat ? boat.name : 'Vessel'}</td>
          <td>${orig ? orig.name : 'Origin'} → ${dest ? dest.name : 'Dest'}</td>
          <td>${new Date(trip.departure_time).toLocaleString()}</td>
          <td>₱${parseFloat(manifest.fare || 100).toFixed(2)}</td>
          <td><span class="badge badge-info">${manifest.discount_type || 'None'}</span></td>
          <td><span class="badge badge-${(trip.trip_status || 'scheduled').toLowerCase()}">${trip.trip_status}</span></td>
        </tr>
      `).join('');
    }

    document.getElementById('filterBtn').onclick = loadTrips;
    document.getElementById('resetBtn').onclick = () => {
      document.getElementById('filterFrom').value = '';
      document.getElementById('filterTo').value = '';
      document.getElementById('filterStatus').value = '';
      loadTrips();
    };

    loadTrips();
    ui.setupSync(loadTrips, 5000);

    document.getElementById('logoutBtn').onclick = async (e) => {
      e.preventDefault();
      await api.auth.logout();
      window.location.href = '/login.html';
    };
  </script>
</body>
</html>
