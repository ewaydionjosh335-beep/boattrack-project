<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Book Trip - BoatTrack Passenger</title>
  <link rel="stylesheet" href="/css/tokens.css">
  <link rel="stylesheet" href="/css/base.css">
  <link rel="stylesheet" href="/css/components.css">
  <link rel="stylesheet" href="/css/layout.css">
  <style>
    .portal-layout { display: flex; min-height: 100vh; background-color: var(--bg-main); }
    .portal-sidebar { width: 240px; background: var(--bg-sidebar); color: white; display: flex; flex-direction: column; position: fixed; top: 0; bottom: 0; left: 0; z-index: 200; }
    .portal-main { flex: 1; margin-left: 240px; display: flex; flex-direction: column; min-width: 0; }
    .portal-header { background: white; padding: 1rem 1.5rem; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; position: sticky; top: 0; z-index: 100; }
    .portal-content { padding: 1.5rem; flex: 1; }
    
    .bottom-tab-bar { display: none; position: fixed; bottom: 0; left: 0; right: 0; background: white; border-top: 1px solid var(--border); height: 60px; z-index: 1000; justify-content: space-around; align-items: center; }
    .bottom-tab-bar a { display: flex; flex-direction: column; align-items: center; justify-content: center; color: var(--text-muted); text-decoration: none; font-size: 0.7rem; font-weight: 500; gap: 2px; flex: 1; height: 100%; }
    .bottom-tab-bar a.active, .bottom-tab-bar a:hover { color: var(--teal); }

    @media (max-width: 992px) {
      .portal-sidebar { display: none !important; }
      .portal-main { margin-left: 0 !important; padding-bottom: 70px !important; }
      .bottom-tab-bar { display: flex !important; }
    }
  </style>
</head>
<body class="portal-layout">

  <!-- Desktop Sidebar -->
  <aside class="portal-sidebar">
    <div style="padding: 1.5rem; font-family: var(--font-display); font-weight: 700; font-size: 1.1rem; border-bottom: 1px solid var(--border-dark); display: flex; align-items: center; gap: 0.5rem; white-space: nowrap;">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M2 21c.6.5 1.2 1 2.5 1 2.5 0 2.5-2 5-2 1.3 0 1.9.5 2.5 1 .6.5 1.2 1 2.5 1 2.5 0 2.5-2 5-2 1.3 0 1.9.5 2.5 1"/><path d="M19.38 20A11.6 11.6 0 0 0 21 14l-9-4-9 4c0 2.3.6 4.5 1.62 6"/></svg>
      Passenger Portal
    </div>
    <div style="padding: 1rem 0; overflow-y: auto;">
      <a href="/passenger/dashboard.html" style="display: flex; align-items: center; gap: 0.75rem; padding: 0.75rem 1.5rem; color: #adb5bd; text-decoration: none; font-weight: 500;"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M3 9h18"/><path d="M9 21V9"/></svg> Dashboard</a>
      <a href="/passenger/schedules.html" style="display: flex; align-items: center; gap: 0.75rem; padding: 0.75rem 1.5rem; color: #adb5bd; text-decoration: none; font-weight: 500;"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg> Schedules</a>
      <a href="/passenger/my-bookings.html" style="display: flex; align-items: center; gap: 0.75rem; padding: 0.75rem 1.5rem; color: #adb5bd; text-decoration: none; font-weight: 500;"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/></svg> My Bookings</a>
      <a href="/passenger/my-trips.html" style="display: flex; align-items: center; gap: 0.75rem; padding: 0.75rem 1.5rem; color: #adb5bd; text-decoration: none; font-weight: 500;"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 15s1-1 4-1 5 2 8 2 4-1 4-1V3s-1 1-4 1-5-2-8-2-4 1-4 1z"/><line x1="4" y1="22" x2="4" y2="15"/></svg> My Trips</a>
      <a href="/passenger/my-qr.html" style="display: flex; align-items: center; gap: 0.75rem; padding: 0.75rem 1.5rem; color: #adb5bd; text-decoration: none; font-weight: 500;"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/></svg> My QR</a>
      <a href="/passenger/sos.html" style="display: flex; align-items: center; gap: 0.75rem; padding: 0.75rem 1.5rem; color: #adb5bd; text-decoration: none; font-weight: 500;"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg> SOS Emergency</a>
      <a href="/passenger/profile.html" style="display: flex; align-items: center; gap: 0.75rem; padding: 0.75rem 1.5rem; color: #adb5bd; text-decoration: none; font-weight: 500;"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg> Profile</a>
      <a href="#" id="logoutBtn" style="display: flex; align-items: center; gap: 0.75rem; padding: 0.75rem 1.5rem; color: var(--danger); text-decoration: none; font-weight: 500;"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg> Logout</a>
    </div>
  </aside>

  <!-- Main Content Area -->
  <div class="portal-main">
    <header class="portal-header">
      <h2 style="font-size: 1.25rem; font-weight: 700; color: var(--primary);">Book a Trip</h2>
    </header>

    <div class="portal-content">
      <div class="card" style="max-width: 600px; margin: 0 auto;">
        <form id="bookForm">
          <div class="form-group">
            <label class="form-label">Select Trip</label>
            <select id="tripSelect" class="form-control" required></select>
          </div>
          <div class="form-group">
            <label class="form-label">Booking Type</label>
            <select id="typeSelect" class="form-control">
              <option value="Passenger">Passenger</option>
              <option value="Cargo">Cargo</option>
            </select>
          </div>
          
          <div id="passengerFields">
            <div class="form-group">
              <label class="form-label">Number of Passengers</label>
              <input type="number" id="passCount" class="form-control" value="1" min="1">
            </div>
          </div>

          <div id="cargoFields" style="display: none;">
            <div class="form-group">
              <label class="form-label">Cargo Weight (kg)</label>
              <input type="number" id="cargoWeight" class="form-control" min="0">
            </div>
            <div class="form-group">
              <label class="form-label">Area (m²)</label>
              <input type="number" id="cargoArea" class="form-control" min="0">
            </div>
            <div class="form-group">
              <label class="form-label">Crowding</label>
              <select id="cargoCrowding" class="form-control">
                <option value="Low">Low</option>
                <option value="Medium">Medium</option>
                <option value="High">High</option>
              </select>
            </div>
            <div class="form-group">
              <label class="form-label">Description</label>
              <input type="text" id="cargoDesc" class="form-control">
            </div>
          </div>

          <div class="form-group">
            <label class="form-label">Notes (optional)</label>
            <textarea id="notes" class="form-control" rows="2"></textarea>
          </div>

          <div style="background: var(--bg-main); padding: 1rem; border-radius: var(--radius-sm); margin-bottom: 1rem;">
            <strong>Estimated Amount Due: ₱<span id="amountDue">0.00</span></strong>
            <p style="font-size: 0.75rem; color: var(--text-muted); margin-top: 0.5rem;">Fare discounts (Senior/PWD/Student) are applied at the port after ID verification by the Receptionist.</p>
          </div>
          
          <button type="submit" class="btn btn-primary" style="width: 100%;">Submit Booking Request</button>
        </form>
      </div>
    </div>
  </div>

  <script type="module">
    import { api } from '/js/api.js';
    import { auth } from '/js/auth.js';
    import { ui } from '/js/ui.js';

    const session = await auth.requireAuth(['passenger']);
    const passenger = await api.passengers.getByUserId(session.user_id);
    const trips = await api.trips.list();
    const routes = await api.routes.list();
    const boats = await api.boats.list();
    const terminals = await api.terminals.list();

    const tripSelect = document.getElementById('tripSelect');
    const urlParams = new URLSearchParams(window.location.search);
    const preselectedTripId = urlParams.get('trip_id');

    trips.filter(t => t.trip_status === 'Scheduled' && new Date(t.departure_time) > new Date()).forEach(t => {
      const boat = boats.find(b => b.id === t.boat_id);
      const route = routes.find(r => r.id === t.route_id);
      const orig = terminals.find(term => term.id === route.origin_terminal_id);
      const dest = terminals.find(term => term.id === route.destination_terminal_id);
      const option = document.createElement('option');
      option.value = t.id;
      option.textContent = `${boat.name} - ${orig.name} to ${dest.name} (${new Date(t.departure_time).toLocaleString()})`;
      if (t.id === preselectedTripId) option.selected = true;
      tripSelect.appendChild(option);
    });

    const typeSelect = document.getElementById('typeSelect');
    typeSelect.onchange = () => {
      if (typeSelect.value === 'Cargo') {
        document.getElementById('passengerFields').style.display = 'none';
        document.getElementById('cargoFields').style.display = 'block';
      } else {
        document.getElementById('passengerFields').style.display = 'block';
        document.getElementById('cargoFields').style.display = 'none';
      }
      updateAmount();
    };

    function updateAmount() {
      const amount = api._calculateAmountDue(
        tripSelect.value, 
        typeSelect.value, 
        document.getElementById('passCount').value, 
        document.getElementById('cargoWeight').value
      );
      document.getElementById('amountDue').textContent = amount.toFixed(2);
    }
    tripSelect.onchange = updateAmount;
    document.getElementById('passCount').oninput = updateAmount;
    document.getElementById('cargoWeight').oninput = updateAmount;
    updateAmount();

    document.getElementById('bookForm').onsubmit = async (e) => {
      e.preventDefault();
      try {
        await api.bookings.create({
          passenger_id: passenger.id,
          trip_id: tripSelect.value,
          booking_type: typeSelect.value,
          passenger_count: document.getElementById('passCount').value,
          cargo_weight_kg: document.getElementById('cargoWeight').value,
          cargo_area_sqm: document.getElementById('cargoArea').value,
          cargo_crowding: document.getElementById('cargoCrowding').value,
          notes: document.getElementById('notes').value
        });
        ui.showToast('Booking submitted!', 'success');
        setTimeout(() => window.location.href = '/passenger/my-bookings.html', 1000);
      } catch (err) {
        ui.showToast(err.message, 'danger');
      }
    };

    document.getElementById('logoutBtn').onclick = async (e) => {
      e.preventDefault();
      await api.auth.logout();
      window.location.href = '/login.html';
    };
  </script>
</body>
</html>
