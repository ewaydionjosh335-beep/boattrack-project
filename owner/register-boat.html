<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Register New Boat - BoatTrack</title>
  <link rel="stylesheet" href="/css/tokens.css">
  <link rel="stylesheet" href="/css/base.css">
  <link rel="stylesheet" href="/css/components.css">
  <link rel="stylesheet" href="/css/layout.css">
</head>
<body class="admin-layout">

  <aside class="admin-sidebar">
    <div class="sidebar-header">
      <span style="display: flex; align-items: center; gap: 0.5rem;">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M2 21c.6.5 1.2 1 2.5 1 2.5 0 2.5-2 5-2 1.3 0 1.9.5 2.5 1 .6.5 1.2 1 2.5 1 2.5 0 2.5-2 5-2 1.3 0 1.9.5 2.5 1"/><path d="M19.38 20A11.6 11.6 0 0 0 21 14l-9-4-9 4c0 2.3.6 4.5 1.62 6"/><path d="M12 10V4l3 2-3 2"/></svg>
        Boat Owner
      </span>
    </div>
    <div class="sidebar-menu">
      <a href="/owner/dashboard.html"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M3 9h18"/><path d="M9 21V9"/></svg> Dashboard</a>
      <a href="/owner/my-boats.html"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M2 21c.6.5 1.2 1 2.5 1 2.5 0 2.5-2 5-2 1.3 0 1.9.5 2.5 1 .6.5 1.2 1 2.5 1 2.5 0 2.5-2 5-2 1.3 0 1.9.5 2.5 1"/><path d="M19.38 20A11.6 11.6 0 0 0 21 14l-9-4-9 4c0 2.3.6 4.5 1.62 6"/><path d="M12 10V4l3 2-3 2"/></svg> My Boats</a>
      <a href="/owner/crew-list.html"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"/><rect x="8" y="2" width="8" height="4" rx="1" ry="1"/></svg> Crew List</a>
      <a href="/owner/register-boat.html" class="active"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="5" r="3"/><path d="M12 22V8"/><path d="M5 12H2a10 10 0 0 0 20 0h-3"/></svg> Register New Boat</a>
      <a href="#" id="logoutBtn" style="color: var(--danger);"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg> Logout</a>
    </div>
  </aside>

  <div class="admin-main">
    <header class="admin-header">
      <h2>Register New Boat</h2>
    </header>

    <div class="admin-content">
      <form id="registerBoatForm" class="card" style="max-width: 100%;">
        <div class="form-group">
          <label class="form-label">Boat Name</label>
          <input type="text" name="name" required class="form-control" placeholder="M/B Express">
        </div>
        <div class="form-group">
          <label class="form-label">Boat Type</label>
          <select name="boat_type" class="form-control">
            <option value="Normal">Normal</option>
            <option value="Cargo">Cargo</option>
          </select>
        </div>
        <div class="form-group">
          <label class="form-label">Passenger Capacity</label>
          <input type="number" name="passenger_capacity" min="0" required class="form-control" placeholder="30">
        </div>
        <div class="form-group">
          <label class="form-label">Cargo Capacity (kg)</label>
          <input type="number" name="cargo_capacity" min="0" required class="form-control" placeholder="500">
        </div>
        <div class="form-group">
          <label class="form-label">Max Load (kg)</label>
          <input type="number" name="max_load_kg" min="1" required class="form-control" placeholder="2000">
        </div>
        <div class="form-group">
          <label class="form-label">Documents (Image/PDF, max 1MB each, max 6)</label>
          <input type="file" id="fileInput" accept="image/*,application/pdf" multiple class="form-control">
          <div id="filePreviews" style="display: flex; gap: 0.5rem; flex-wrap: wrap; margin-top: 0.5rem;"></div>
        </div>
        <button type="submit" class="btn btn-primary">Submit Registration</button>
      </form>
    </div>
  </div>

  <script type="module">
    import { api } from '/js/api.js';
    import { auth } from '/js/auth.js';
    import { ui } from '/js/ui.js';

    const session = await auth.requireAuth(['boat_owner']);
    const form = document.getElementById('registerBoatForm');
    const fileInput = document.getElementById('fileInput');
    const filePreviews = document.getElementById('filePreviews');
    let selectedFiles = [];

    fileInput.onchange = (e) => {
      const newFiles = Array.from(e.target.files);
      if (selectedFiles.length + newFiles.length > 6) {
        alert('Max 6 files allowed');
        return;
      }
      
      newFiles.forEach(file => {
        if (file.size > 1024 * 1024) {
          alert(`File ${file.name} is too large (max 1MB)`);
          return;
        }
        selectedFiles.push(file);
        
        const div = document.createElement('div');
        div.style.border = '1px solid var(--border)';
        div.style.padding = '0.5rem';
        div.style.borderRadius = 'var(--radius-sm)';
        div.innerHTML = `<span>${file.name}</span> <button type="button" class="btn btn-sm btn-danger" style="margin-left: 0.5rem;">X</button>`;
        div.querySelector('button').onclick = () => {
          selectedFiles = selectedFiles.filter(f => f !== file);
          div.remove();
        };
        filePreviews.appendChild(div);
      });
      fileInput.value = '';
    };

    form.onsubmit = async (e) => {
      e.preventDefault();
      const formData = new FormData(form);
      const data = Object.fromEntries(formData.entries());
      data.owner_id = session.user_id;
      data.registration_status = 'Pending';
      data.boat_status = 'Active';

      try {
        const boat = await api.boats.create(data);
        
        for (const file of selectedFiles) {
          const reader = new FileReader();
          reader.readAsDataURL(file);
          await new Promise((resolve, reject) => {
            reader.onload = async () => {
              try {
                await api.boatDocuments.create({
                  boat_id: boat.id,
                  file_name: file.name,
                  data_url: reader.result
                });
                resolve();
              } catch (err) {
                if (err instanceof QuotaExceededError || (err.message && err.message.includes('Quota'))) {
                  alert('Storage quota exceeded. Please remove some documents.');
                  reject(err);
                } else {
                  reject(err);
                }
              }
            };
            reader.onerror = reject;
          });
        }
        ui.showToast('Boat registered successfully!', 'success');
        window.location.href = '/owner/my-boats.html';
      } catch (err) {
        alert(err.message);
      }
    };

    document.getElementById('logoutBtn').onclick = async (e) => {
      e.preventDefault();
      await api.auth.logout();
      window.location.href = '/login.html';
    };
  </script>
</body>
</html>
