<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Boat Owner Dashboard - BoatTrack</title>
  <link rel="stylesheet" href="/css/tokens.css">
  <link rel="stylesheet" href="/css/base.css">
  <link rel="stylesheet" href="/css/components.css">
  <link rel="stylesheet" href="/css/layout.css">
  <style>
    .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 1rem; margin-bottom: 2rem; }
    .stat-card { background: white; padding: 1.25rem; border-radius: var(--radius-md); border: 1px solid var(--border); box-shadow: var(--shadow-sm); }
    .stat-card h4 { color: var(--text-muted); font-size: 0.9rem; margin-bottom: 0.5rem; }
    .stat-card .val { font-size: 1.75rem; font-weight: 700; color: var(--primary); }
  </style>
</head>
<body class="admin-layout">

  <aside class="admin-sidebar">
    <div class="sidebar-header">
      <span style="display: flex; align-items: center; gap: 0.5rem;">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M2 21c.6.5 1.2 1 2.5 1 2.5 0 2.5-2 5-2 1.3 0 1.9.5 2.5 1 .6.5 1.2 1 2.5 1 2.5 0 2.5-2 5-2 1.3 0 1.9.5 2.5 1"/><path d="M19.38 20A11.6 11.6 0 0 0 21 14l-9-4-9 4c0 2.3.6 4.5 1.62 6"/><path d="M12 10V4l3 2-3 2"/></svg>
        Boat Owner
      </span>
    </div>
    <div class="sidebar-menu">
      <a href="/owner/dashboard.html" class="active"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M3 9h18"/><path d="M9 21V9"/></svg> Dashboard</a>
      <a href="/owner/my-boats.html"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M2 21c.6.5 1.2 1 2.5 1 2.5 0 2.5-2 5-2 1.3 0 1.9.5 2.5 1 .6.5 1.2 1 2.5 1 2.5 0 2.5-2 5-2 1.3 0 1.9.5 2.5 1"/><path d="M19.38 20A11.6 11.6 0 0 0 21 14l-9-4-9 4c0 2.3.6 4.5 1.62 6"/><path d="M12 10V4l3 2-3 2"/></svg> My Boats</a>
      <a href="/owner/crew-list.html"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"/><rect x="8" y="2" width="8" height="4" rx="1" ry="1"/></svg> Crew List</a>
      <a href="/owner/register-boat.html"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="5" r="3"/><path d="M12 22V8"/><path d="M5 12H2a10 10 0 0 0 20 0h-3"/></svg> Register New Boat</a>
      <a href="#" id="logoutBtn" style="color: var(--danger);"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg> Logout</a>
    </div>
  </aside>

  <div class="admin-main">
    <header class="admin-header">
      <h2>Owner Dashboard</h2>
      <span id="ownerName" style="font-weight: 600;"></span>
    </header>

    <div class="admin-content">
      <div class="stats-grid">
        <div class="stat-card"><h4>Total Boats</h4><div class="val" id="statTotal">0</div></div>
        <div class="stat-card"><h4>Pending</h4><div class="val" id="statPending">0</div></div>
        <div class="stat-card"><h4>Verified</h4><div class="val" id="statVerified">0</div></div>
        <div class="stat-card"><h4>Rejected</h4><div class="val" id="statRejected" style="color: var(--danger);">0</div></div>
      </div>

      <div class="card">
        <h3>Rejected Boats Requiring Attention</h3>
        <div class="table-container" style="margin-top: 1rem;">
          <table id="rejectedBoatsTable">
            <thead>
              <tr>
                <th>Boat Name</th>
                <th>Remarks</th>
                <th>Action</th>
              </tr>
            </thead>
            <tbody></tbody>
          </table>
        </div>
      </div>
    </div>
  </div>

  <script type="module">
    import { api } from '/js/api.js';
    import { auth } from '/js/auth.js';

    const session = await auth.requireAuth(['boat_owner']);
    if (!session) throw new Error('Unauthorized');
    document.getElementById('ownerName').textContent = session.full_name;

    const boats = await api.boats.listByOwner(session.user_id);
    
    document.getElementById('statTotal').textContent = boats.length;
    document.getElementById('statPending').textContent = boats.filter(b => b.registration_status === 'Pending').length;
    document.getElementById('statVerified').textContent = boats.filter(b => b.registration_status === 'Verified').length;
    document.getElementById('statRejected').textContent = boats.filter(b => b.registration_status === 'Rejected').length;

    const rejectedBoats = boats.filter(b => b.registration_status === 'Rejected');
    const tbody = document.querySelector('#rejectedBoatsTable tbody');
    if (rejectedBoats.length === 0) {
      tbody.innerHTML = '<tr><td colspan="3" style="text-align: center; color: var(--text-muted);">No rejected boats requiring attention.</td></tr>';
    } else {
      rejectedBoats.forEach(boat => {
        const tr = document.createElement('tr');
        tr.innerHTML = `
          <td><strong>${boat.name}</strong></td>
          <td>${boat.remarks}</td>
          <td><a href="/owner/boat-details.html?id=${boat.id}" class="btn btn-sm btn-primary">Edit & Resubmit</a></td>
        `;
        tbody.appendChild(tr);
      });
    }

    document.getElementById('logoutBtn').onclick = async (e) => {
      e.preventDefault();
      await api.auth.logout();
      window.location.href = '/login.html';
    };
  </script>
</body>
</html>
