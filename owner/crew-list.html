<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Crew List - BoatTrack Owner</title>
  <link rel="stylesheet" href="/css/tokens.css">
  <link rel="stylesheet" href="/css/base.css">
  <link rel="stylesheet" href="/css/components.css">
  <link rel="stylesheet" href="/css/layout.css">
</head>
<body class="admin-layout">

  <aside class="admin-sidebar">
    <div class="sidebar-header">
      <span style="display: flex; align-items: center; gap: 0.5rem;">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M2 21c.6.5 1.2 1 2.5 1 2.5 0 2.5-2 5-2 1.3 0 1.9.5 2.5 1 .6.5 1.2 1 2.5 1 2.5 0 2.5-2 5-2 1.3 0 1.9.5 2.5 1"/><path d="M19.38 20A11.6 11.6 0 0 0 21 14l-9-4-9 4c0 2.3.6 4.5 1.62 6"/><path d="M12 10V4l3 2-3 2"/></svg>
        Boat Owner
      </span>
    </div>
    <div class="sidebar-menu">
      <a href="/owner/dashboard.html"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M3 9h18"/><path d="M9 21V9"/></svg> Dashboard</a>
      <a href="/owner/my-boats.html"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M2 21c.6.5 1.2 1 2.5 1 2.5 0 2.5-2 5-2 1.3 0 1.9.5 2.5 1 .6.5 1.2 1 2.5 1 2.5 0 2.5-2 5-2 1.3 0 1.9.5 2.5 1"/><path d="M19.38 20A11.6 11.6 0 0 0 21 14l-9-4-9 4c0 2.3.6 4.5 1.62 6"/><path d="M12 10V4l3 2-3 2"/></svg> My Boats</a>
      <a href="/owner/crew-list.html" class="active"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"/><rect x="8" y="2" width="8" height="4" rx="1" ry="1"/></svg> Crew List</a>
      <a href="/owner/register-boat.html"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="5" r="3"/><path d="M12 22V8"/><path d="M5 12H2a10 10 0 0 0 20 0h-3"/></svg> Register New Boat</a>
      <a href="#" id="logoutBtn" style="color: var(--danger);"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg> Logout</a>
    </div>
  </aside>

  <div class="admin-main">
    <header class="admin-header">
      <h2>Crew List</h2>
    </header>

    <div class="admin-content">
      <div class="table-container">
        <table>
          <thead>
            <tr>
              <th>Name</th>
              <th>Contact</th>
              <th>Boat</th>
              <th>Status</th>
              <th>Actions</th>
            </tr>
          </thead>
          <tbody id="crewTableBody">
            <tr><td colspan="5" style="text-align: center;">Loading crew list...</td></tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>

  <script type="module">
    import { api } from '/js/api.js';
    import { auth } from '/js/auth.js';
    import { ui } from '/js/ui.js';

    const session = await auth.requireAuth(['boat_owner']);
    
    async function loadData() {
        const allBoats = await api.boats.list();
        const myBoats = allBoats.filter(b => b.owner_id === session.user_id);
        const myBoatIds = myBoats.map(b => b.id);
        
        const allCrew = await api.crewMembers.list();
        const myCrew = allCrew.filter(c => myBoatIds.includes(c.boat_id));
        
        const tbody = document.getElementById('crewTableBody');
        if (myCrew.length === 0) {
            tbody.innerHTML = '<tr><td colspan="5" style="text-align: center;">No crew members found for your boats.</td></tr>';
            return;
        }

        tbody.innerHTML = myCrew.map(c => `
            <tr>
                <td><strong>${c.full_name}</strong></td>
                <td><input type="text" value="${c.contact || ''}" class="form-control" style="max-width: 200px;" onchange="window.updateContact('${c.id}', this.value)"></td>
                <td>${myBoats.find(b=>b.id===c.boat_id)?.name || 'N/A'}</td>
                <td><span class="badge ${c.status === 'Active' ? 'badge-active' : 'badge-suspended'}">${c.status}</span></td>
                <td>
                    <div class="table-actions">
                      <button class="btn btn-sm btn-outline" onclick="window.toggleStatus('${c.id}', '${c.status}')">Set ${c.status === 'Active' ? 'Inactive' : 'Active'}</button>
                    </div>
                </td>
            </tr>
        `).join('');
    }

    window.updateContact = async (id, contact) => {
        await api.crewMembers.update(id, { contact });
        ui.showToast('Crew contact updated.', 'success');
        await loadData();
    };

    window.toggleStatus = async (id, currentStatus) => {
        const newStatus = currentStatus === 'Active' ? 'Inactive' : 'Active';
        await api.crewMembers.update(id, { status: newStatus });
        
        const crew = await api.crewMembers.get(id);
        if(crew && crew.user_id) {
            await api.users.update(crew.user_id, { status: newStatus === 'Active' ? 'Active' : 'Suspended' });
        }
        ui.showToast(`Crew status updated to ${newStatus}.`, 'success');
        await loadData();
    };

    document.getElementById('logoutBtn').onclick = async (e) => {
      e.preventDefault();
      await api.auth.logout();
      window.location.href = '/login.html';
    };
    
    loadData();
  </script>
</body>
</html>
